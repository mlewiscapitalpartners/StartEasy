<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Subdomain Diagnostic — StartEasy</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="font-family:system-ui;padding:30px;background:#f5faf6">
<h1 style="color:#0a1f12">Subdomain Diagnostic</h1>
<div id="checklist" style="font-size:16px;line-height:2"></div>
<div id="root" style="margin-top:30px;padding:20px;border:2px solid #ccc;border-radius:8px"></div>
<script>
var list = document.getElementById('checklist');
function line(ok, text){
  var d = document.createElement('div');
  d.innerHTML = (ok ? '<span style="color:green;font-weight:700">✅</span> ' : '<span style="color:red;font-weight:700">❌</span> ') + text;
  list.appendChild(d);
}
window.addEventListener('load', function(){
  line(typeof React !== 'undefined', 'React loaded: ' + (typeof React !== 'undefined' ? React.version : 'NOT LOADED'));
  line(typeof ReactDOM !== 'undefined', 'ReactDOM loaded: ' + (typeof ReactDOM !== 'undefined' ? 'yes' : 'NOT LOADED'));
  line(typeof Babel !== 'undefined', 'Babel loaded: ' + (typeof Babel !== 'undefined' ? Babel.version : 'NOT LOADED'));
  line(window.location.protocol === 'https:', 'Protocol: ' + window.location.protocol);
  line(true, 'Host: ' + window.location.host);
});
</script>
<script type="text/babel" data-presets="react">
function App(){
  return <div style={{color:'green',fontSize:'22px',fontWeight:'bold'}}>✅ React + Babel are both working on this subdomain</div>;
}
try {
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
} catch(e){
  document.getElementById('root').innerHTML = '<div style="color:red;font-weight:700">❌ ' + e.message + '</div>';
}
</script>
</body>
</html>
