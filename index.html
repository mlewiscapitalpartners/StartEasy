/* ============================================================

   ============================================================ */
function GuidedJourney({go}){
  const [selected,setSelected]=useState(null);
  const [step,setStep]=useState(0);
  const [answers,setAnswers]=useState({});
  const [plan,setPlan]=useState(null);
  const [done,setDone]=useState({});

  useEffect(function(){window.scrollTo(0,0)},[step,plan,selected]);

  if(!selected){
    return(
      <div className="fadein bg-[#F5FAF6]">
        <section className="bg-[#0A1F12] text-white">
          <div className="max-w-[1320px] mx-auto px-6 lg:px-10 py-16">
            <span className="micro text-[#F5A623] block mb-6">Guided journey</span>
            <h1 className="serif text-[clamp(2rem,5vw,3.4rem)] leading-[1.1] text-white mb-6 max-w-3xl">Choose the administrative journey.</h1>
            <p className="text-[16px] leading-relaxed text-white/60 max-w-3xl">Answer a few questions. StartEasy will produce a personalised administrative action plan, only containing the processes that apply to the matter.</p>
          </div>
        </section>
        <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14">
          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
            {JOURNEYS.map(function(j){
              return(
                <button key={j.id} onClick={function(){setSelected(j);setStep(0);setAnswers({});setPlan(null);setDone({})}} className="text-left bg-white rounded-sm border border-[#0A1F12]/8 p-6 hover:shadow-xl hover:-translate-y-1 transition-all" style={{cursor:'pointer',fontFamily:'inherit'}}>
                  <div className="flex items-center justify-between mb-5">
                    <span className="text-[28px] leading-none">{j.icon}</span>
                    <span className="text-[10px] tracking-[0.1em] uppercase font-bold text-[#0A1F12]/40 bg-[#0A1F12]/5 px-2 py-1 rounded-full">{j.category}</span>
                  </div>
                  <h3 className="serif text-[18px] text-[#0A1F12] mb-2">{j.title}</h3>
                  <p className="text-[13px] text-[#0A1F12]/55 leading-relaxed mb-4">{j.summary}</p>
                  <span className="flex items-center gap-2 text-[10.5px] tracking-[0.14em] uppercase text-[#E8730F] font-bold">{j.processes.length} processes <Arrow/></span>
                </button>
              );
            })}
          </div>
        </section>
      </div>
    );
  }

  const questions = selected.questions.map(function(k){return Object.assign({key:k},QUESTIONS[k])});
  const currentQ = questions[step];

  const buildPlan = function(){
    return selected.processes.filter(function(p){try{return p.when(answers)}catch(e){return true}}).map(function(p){return PROCESSES[p.ref]}).filter(Boolean);
  };

  if(plan){
    const total = plan.reduce(function(a,p){return a+(p.steps||[]).length},0);
    const completed = plan.reduce(function(a,p,pi){const s=done[pi]||{};return a+(p.steps||[]).filter(function(_,si){return s[si]}).length},0);
    const percent = pct(completed,total);
    return(
      <div className="fadein bg-[#F5FAF6]">
        <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14">
          <div className="flex flex-wrap items-end justify-between gap-6 mb-10">
            <div>
              <span className="micro text-[#0A1F12]/50 block mb-4">Action plan</span>
              <h1 className="serif text-[clamp(2rem,4.5vw,3rem)] leading-[1.1] text-[#0A1F12] mb-4">{selected.icon} {selected.title}</h1>
              <p className="text-[14.5px] text-[#0A1F12]/55 max-w-2xl">{plan.length} processes · {completed}/{total} steps complete</p>
            </div>
            <div className="relative" style={{width:72,height:72}}>
              <svg viewBox="0 0 72 72" style={{transform:'rotate(-90deg)'}}><circle cx="36" cy="36" r="30" fill="none" stroke="#DCE9DF" strokeWidth="7"/><circle cx="36" cy="36" r="30" fill="none" stroke="#E8730F" strokeWidth="7" strokeDasharray={String((percent/100)*188.5)+' 188.5'} strokeLinecap="round"/></svg>
              <span className="absolute inset-0 flex items-center justify-center text-[14px] font-bold text-[#E8730F]">{percent}%</span>
            </div>
          </div>
          <div className="space-y-4">
            {plan.map(function(p,pi){
              const state = done[pi]||{};
              const doneCount = (p.steps||[]).filter(function(_,i){return state[i]}).length;
              const pp = pct(doneCount,(p.steps||[]).length);
              const desk = DESKS[p.desk]||{};
              const color = DESK_TONE_COLORS[desk.tone]||'#E8730F';
              return(
                <div key={pi} className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
                  <div className="px-5 py-4 border-b border-[#0A1F12]/6 flex flex-wrap items-center gap-3" style={{background:'#FBFDFB'}}>
                    <span className="text-[10.5px] tracking-[0.14em] uppercase font-bold px-2.5 py-1 rounded-full" style={{background:color+'1A',color:color}}>{desk.name||p.desk}</span>
                    <span className="text-[14px] font-semibold text-[#0A1F12] flex-1">{pi+1}. {p.title}</span>
                    <span className="text-[11px] text-[#0A1F12]/40 font-mono">{p.code}</span>
                    <div className="flex items-center gap-2"><span className="text-[11px] text-[#0A1F12]/50 tabular-nums">{doneCount}/{(p.steps||[]).length}</span><div className="w-14 h-1.5 bg-[#0A1F12]/8 rounded-full overflow-hidden"><div className="h-full bg-[#E8730F] rounded-full" style={{width:pp+'%'}}/></div></div>
                  </div>
                  <div className="p-5">
                    <p className="text-[12.5px] text-[#0A1F12]/55 mb-4">{p.summary}</p>
                    <div className="flex flex-wrap gap-x-4 gap-y-2 text-[11.5px] text-[#0A1F12]/50 mb-5"><span>⏱ {p.timeline}</span><span>·</span><span>{p.channel}</span></div>
                    <div className="space-y-1.5 mb-5">
                      {(p.steps||[]).map(function(s,si){
                        return(
                          <label key={si} className={'flex items-start gap-3 p-2.5 rounded cursor-pointer '+(state[si]?'bg-[#E8730F]/8':'hover:bg-[#F5FAF6]')}>
                            <input type="checkbox" checked={!!state[si]} onChange={function(){setDone(function(prev){const n=Object.assign({},prev);n[pi]=Object.assign({},n[pi]||{});n[pi][si]=!n[pi][si];return n})}} style={{width:16,height:16,accentColor:'#E8730F',marginTop:3,flexShrink:0,cursor:'pointer'}}/>
                            <span className="flex-1"><span className={'block text-[13px] font-semibold leading-snug '+(state[si]?'text-[#0A1F12]/50 line-through':'text-[#0A1F12]')}>{s[0]}</span><span className="block text-[12px] text-[#0A1F12]/50 leading-relaxed mt-1">{s[1]}</span></span>
                          </label>
                        );
                      })}
                    </div>
                    {(p.docs||[]).length>0&&(<div className="mb-4"><div className="text-[11px] tracking-[0.14em] uppercase font-bold text-[#0A1F12]/45 mb-3">Documents typically required</div><ul className="text-[12px] text-[#0A1F12]/60 leading-relaxed" style={{paddingLeft:20,margin:0}}>{(p.docs||[]).map(function(d,di){return <li key={di}>{d}</li>})}</ul></div>)}
                    {(p.reversions||[]).length>0&&(<div className="pt-3 mt-3 border-t border-[#0A1F12]/6"><div className="text-[11px] tracking-[0.14em] uppercase font-bold text-[#0A1F12]/45 mb-3">Common causes of reversion</div><div className="space-y-2">{(p.reversions||[]).map(function(r,ri){return(<div key={ri} className="flex gap-3 text-[12px] leading-relaxed"><span className={'shrink-0 text-[9.5px] tracking-[0.1em] font-bold uppercase px-1.5 py-0.5 rounded '+(r[1]==='High'?'bg-[#B8564F]/15 text-[#B8564F]':'bg-[#F5A623]/15 text-[#8A6828]')}>{r[1]}</span><span className="flex-1"><span className="block text-[#0A1F12] font-medium">{r[0]}</span><span className="block text-[#0A1F12]/50 mt-0.5">Prevention: {r[2]}</span></span></div>)})}</div></div>)}
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-10 flex flex-wrap gap-3">
            <Btn variant="primary" onClick={function(){go('desks')}}>Explore the desks <Arrow/></Btn>
            <Btn variant="ghost" onClick={function(){setSelected(null);setPlan(null);setDone({})}}>Start a new journey</Btn>
          </div>
        </section>
      </div>
    );
  }

  const canAdvance = answers[currentQ.key]!==undefined && answers[currentQ.key]!=='';

  return(
    <div className="fadein bg-[#F5FAF6]">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14">
        <div className="flex items-center gap-2 text-[11.5px] tracking-[0.14em] uppercase font-bold text-[#0A1F12]/40 mb-6">
          <button onClick={function(){setSelected(null)}} style={{background:'none',border:'none',color:'inherit',fontSize:'inherit',letterSpacing:'inherit',fontWeight:'inherit',textTransform:'inherit',cursor:'pointer',fontFamily:'inherit'}}>Guided journeys</button>
          <span>›</span>
          <span style={{color:'#E8730F'}}>{selected.title}</span>
        </div>
        <div className="grid lg:grid-cols-[1.35fr_1fr] gap-12">
          <div>
            <div className="flex items-center gap-4 mb-8">
              <div className="flex-1 h-1 bg-[#0A1F12]/10 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-[#E8730F] to-[#F5A623] rounded-full" style={{width:((step+1)/questions.length)*100+'%'}}/></div>
              <span className="text-[12px] font-semibold text-[#0A1F12]/45 whitespace-nowrap bg-white px-3 py-1 rounded-full border border-[#0A1F12]/5">{String(step+1).padStart(2,'0')} / {String(questions.length).padStart(2,'0')}</span>
            </div>
            <h1 className="serif text-[clamp(1.8rem,4vw,2.6rem)] leading-[1.15] text-[#0A1F12] mb-6">{currentQ.label}</h1>
            {currentQ.help&&<p className="text-[13px] text-[#0A1F12]/45 -mt-4 mb-7">{currentQ.help}</p>}
            {currentQ.type==='select'
              ? <div className="max-w-md"><Select value={answers[currentQ.key]||''} onChange={function(v){setAnswers(Object.assign({},answers,{[currentQ.key]:v}))}} options={currentQ.options.map(function(o){return o.t})} placeholder="Select…"/></div>
              : <ChipGroup options={currentQ.options} value={answers[currentQ.key]} onChange={function(v){setAnswers(Object.assign({},answers,{[currentQ.key]:v}))}} columns={2}/>
            }
            <div className="mt-10 flex items-center gap-4">
              {step>0&&<Btn variant="ghost" onClick={function(){setStep(step-1)}}>Back</Btn>}
              {step<questions.length-1
                ? <Btn size="lg" onClick={function(){if(canAdvance)setStep(step+1)}} disabled={!canAdvance}>Continue <Arrow/></Btn>
                : <Btn size="lg" variant="primary" onClick={function(){if(canAdvance)setPlan(buildPlan())}} disabled={!canAdvance}>Generate action plan <Arrow/></Btn>
              }
            </div>
          </div>
          <aside className="space-y-6 lg:pt-4">
            <div className="bg-white border border-[#0A1F12]/8 p-6 rounded-sm">
              <span className="micro text-[#0A1F12]/50 block mb-4">Your answers so far</span>
              {Object.keys(answers).length===0
                ? <p className="text-[13px] text-[#0A1F12]/35 italic">Your selections will appear here.</p>
                : <div className="space-y-4">{questions.filter(function(q){return answers[q.key]}).map(function(q){const v=answers[q.key];const opt=(q.options||[]).find(function(o){return (typeof o==='string'?o:o.v)===v});const label=opt?(typeof opt==='string'?opt:opt.t):v;return(<div key={q.key} className="border-l-2 border-[#E8730F] pl-4"><p className="text-[10.5px] tracking-[0.14em] uppercase text-[#0A1F12]/35 mb-1 font-bold">{q.key}</p><p className="text-[13px] text-[#0A1F12]/80 font-medium leading-snug">{label}</p></div>)})}</div>
              }
            </div>
            <div className="bg-[#0A1F12] p-6 rounded-sm text-white">
              <span className="micro text-[#F5A623] block mb-4">Boundary</span>
              <p className="text-[12.5px] text-white/60 leading-relaxed">The action plan is administrative. It identifies the processes, documents and steps required. Where a matter requires legal, tax or accounting advice, StartEasy refers the client to a qualified professional.</p>
            </div>
          </aside>
        </div>
      </section>
    </div>
  );
}

      </section>

}

/* ============================================================

  const [renewals,setRenewals]=useState(function(){try{return JSON.parse(localStorage.getItem('se_renewals')||'[]')}catch(e){return[]}});
  const [vault,setVault]=useState(function(){try{return JSON.parse(localStorage.getItem('se_vault')||'[]')}catch(e){return[]}});
  const [showRenewalForm,setShowRenewalForm]=useState(false);
  const [newRenewal,setNewRenewal]=useState({name:'',authority:'',date:''});
  const [showDocForm,setShowDocForm]=useState(false);
  const [newDoc,setNewDoc]=useState({name:'',type:'Registration certificate'});
  const saveBiz=function(data){setBiz(data);try{localStorage.setItem('se_business',JSON.stringify(data))}catch(e){}};
  const saveRenewals=function(list){setRenewals(list);try{localStorage.setItem('se_renewals',JSON.stringify(list))}catch(e){}};
  const saveVault=function(list){setVault(list);try{localStorage.setItem('se_vault',JSON.stringify(list))}catch(e){}};

  if(!biz){
    return(
      <div className="fadein bg-[#F5FAF6]">
        <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14">
          <div className="max-w-2xl">
            <SectionHead eyebrow="Compliance Passport" title="Create the business regulatory profile." sub="The Compliance Passport keeps registration details, licences, renewals and filings in one place, and alerts before something lapses." className="mb-10"/>

                <Field label="Entity type"><Select value={form.entity} onChange={function(v){setForm(Object.assign({},form,{entity:v}))}} options={['Private Limited Company','Business Name','Sole Trader','Cooperative','Other']} placeholder="Select type"/></Field>
                <Field label="PACRA registration number"><TextInput value={form.regNo} onChange={function(v){setForm(Object.assign({},form,{regNo:v}))}} placeholder="e.g. 120200012345"/></Field>
                <Field label="TPIN"><TextInput value={form.tpin} onChange={function(v){setForm(Object.assign({},form,{tpin:v}))}} placeholder="e.g. 1001234567"/></Field>
                <Field label="NAPSA employer number"><TextInput value={form.napsa} onChange={function(v){setForm(Object.assign({},form,{napsa:v}))}} placeholder="If registered as an employer"/></Field>
                <Field label="Business licence number"><TextInput value={form.licence} onChange={function(v){setForm(Object.assign({},form,{licence:v}))}} placeholder="If issued"/></Field>
                <Field label="City / town"><Select value={form.city} onChange={function(v){setForm(Object.assign({},form,{city:v}))}} options={['Lusaka','Ndola','Kitwe','Livingstone','Kabwe','Solwezi','Chipata','Kasama','Mongu','Choma','Mansa','Other']} placeholder="Select city"/></Field>
                <Field label="Number of employees"><TextInput type="number" value={form.employees} onChange={function(v){setForm(Object.assign({},form,{employees:v}))}} placeholder="0"/></Field>
              </div>
              <button type="submit" style={{width:'100%',padding:'13px 16px',background:'linear-gradient(135deg,#1E7B3C,#2E9C4A)',color:'#fff',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Create Compliance Passport</button>
            </form>
          </div>
        </section>
      </div>
    );
  }

  const alerts=[];
  renewals.forEach(function(r){const d=Math.ceil((new Date(r.date)-Date.now())/864e5);if(d<0)alerts.push({level:'bad',text:r.name+' expired '+Math.abs(d)+' day(s) ago.'});else if(d<=60)alerts.push({level:'warn',text:r.name+' is due in '+d+' day(s) — '+fmtDate(r.date)+'.'})});
  if(!biz.tpin)alerts.push({level:'warn',text:'No TPIN recorded. Tax registration may still be outstanding.'});
  if(Number(biz.employees)>0&&!biz.napsa)alerts.push({level:'warn',text:'Employees exist but no NAPSA employer number recorded.'});

  const passportItems=[
    {desk:'startup',label:'PACRA',tone:'#2E9C4A',rows:[['Entity type',biz.entity],['Registration number',biz.regNo||'Not recorded'],['Registration status',biz.regNo?'Active (as recorded)':'Not recorded']]},
    {desk:'taxemp',label:'ZRA',tone:'#1B6CA8',rows:[['TPIN',biz.tpin||'Not recorded'],['Tax clearance',biz.clearance?fmtDate(biz.clearance):'Not recorded']]},
    {desk:'taxemp',label:'NAPSA',tone:'#7A4FA3',rows:[['Employer registration',biz.napsa||'Not recorded'],['Employees',String(biz.employees||0)]]},
    {desk:'compliance',label:'Licences',tone:'#E8730F',rows:[['Business licence',biz.licence||'Not recorded'],['Sector licence',biz.sectorLicence||'Not recorded'],['Renewals tracked',String(renewals.length)]]}
  ];
  const totalScore=Math.min(100,(biz.regNo?25:0)+(biz.tpin?25:0)+(biz.napsa?20:0)+(biz.licence?20:0)+(renewals.length>0?10:0));

  return(
    <div className="fadein bg-[#F5FAF6]">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14">
        <div className="flex flex-wrap items-end justify-between gap-6 mb-10">
          <div><span className="micro text-[#0A1F12]/50 block mb-4">Compliance Passport</span><h1 className="serif text-[clamp(1.8rem,4vw,2.6rem)] leading-tight text-[#0A1F12] mb-3">{biz.name}</h1><p className="text-[14px] text-[#0A1F12]/55">{biz.entity} · {biz.city} · Created {fmtDate(biz.createdAt)}</p></div>
          <div className="flex items-center gap-5">
            <div className="text-right"><div className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#0A1F12]/40 mb-1">Profile completeness</div><div className="serif text-[32px] font-bold leading-none text-[#1E7B3C]">{totalScore}%</div></div>
            <button onClick={function(){localStorage.removeItem('se_business');localStorage.removeItem('se_renewals');localStorage.removeItem('se_vault');setBiz(null);setRenewals([]);setVault([])}} style={{padding:'8px 14px',background:'none',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'rgba(10,31,18,.6)'}}>Reset</button>
          </div>
        </div>
        {alerts.length>0&&(<div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden mb-8"><div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between"><span className="text-[14px] font-semibold text-[#0A1F12]">StartEasy alerts</span><span className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#E8730F] bg-[#E8730F]/10 px-2.5 py-1 rounded-full">{alerts.length}</span></div><div className="p-6 space-y-3">{alerts.map(function(a,i){return(<div key={i} className={'flex items-start gap-3 p-3.5 rounded-sm border '+(a.level==='bad'?'bg-[#B8564F]/8 border-[#B8564F]/20 text-[#7C2318]':'bg-[#F5A623]/10 border-[#F5A623]/30 text-[#7A5C10]')}><span className="shrink-0 mt-0.5">{a.level==='bad'?'⛔':'⚠️'}</span><span className="text-[13px] leading-relaxed">{a.text}</span></div>)})}</div></div>)}
        <div className="grid lg:grid-cols-2 gap-6 mb-8">
          {passportItems.map(function(p,pi){
            return(<div key={pi} className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden" style={{borderTopWidth:3,borderTopColor:p.tone}}><div className="p-6"><div className="flex items-center justify-between mb-5"><h3 className="serif text-[20px] text-[#0A1F12]">{p.label}</h3><span className="text-[10.5px] tracking-[0.14em] uppercase font-bold px-2.5 py-1 rounded-full" style={{background:p.tone+'18',color:p.tone}}>{DESKS[p.desk]&&DESKS[p.desk].name}</span></div><div className="space-y-0">{p.rows.map(function(r,i){return(<div key={i} className="flex justify-between gap-4 py-3 border-b border-[#0A1F12]/6 last:border-0"><span className="text-[12.5px] text-[#0A1F12]/45">{r[0]}</span><span className="text-[12.5px] text-[#0A1F12] font-semibold text-right">{r[1]}</span></div>)})}</div></div></div>);
          })}
        </div>
        <div className="grid lg:grid-cols-2 gap-6">
          <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
            <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between"><span className="text-[14px] font-semibold text-[#0A1F12]">Renewals & deadlines</span><button onClick={function(){setShowRenewalForm(!showRenewalForm)}} style={{padding:'6px 12px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:6,fontSize:11.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>+ Add</button></div>
            <div className="p-6">
              {showRenewalForm&&(<div className="bg-[#F5FAF6] rounded-sm border border-[#0A1F12]/8 p-4 mb-5 space-y-3"><TextInput value={newRenewal.name} onChange={function(v){setNewRenewal(Object.assign({},newRenewal,{name:v}))}} placeholder="What is being renewed?"/><TextInput value={newRenewal.authority} onChange={function(v){setNewRenewal(Object.assign({},newRenewal,{authority:v}))}} placeholder="Issuing authority"/><input type="date" value={newRenewal.date} onChange={function(e){setNewRenewal(Object.assign({},newRenewal,{date:e.target.value}))}} className={inputCls}/><button onClick={function(){if(!newRenewal.name||!newRenewal.date)return;saveRenewals([...renewals,newRenewal]);setNewRenewal({name:'',authority:'',date:''});setShowRenewalForm(false)}} style={{width:'100%',padding:'10px 16px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Add renewal</button></div>)}
              {renewals.length===0?(<p className="text-[13px] text-[#0A1F12]/45 italic">No renewals tracked yet. Add licence and filing dates so StartEasy can alert in advance.</p>):renewals.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date)}).map(function(r,i){const d=Math.ceil((new Date(r.date)-Date.now())/864e5);const tone=d<0?'#B8564F':d<=60?'#E8730F':'#1E7B3C';return(<div key={i} className="flex items-center justify-between gap-3 py-3 border-b border-[#0A1F12]/6 last:border-0"><div className="flex-1 min-w-0"><p className="text-[13px] font-semibold text-[#0A1F12] truncate">{r.name}</p><p className="text-[11.5px] text-[#0A1F12]/45 mt-0.5">{r.authority} · due {fmtDate(r.date)}</p></div><span className="text-[10px] tracking-[0.1em] uppercase font-bold px-2 py-1 rounded-full shrink-0" style={{background:tone+'18',color:tone}}>{d<0?'Overdue':d+'d'}</span></div>)})}
            </div>
          </div>

            <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between"><span className="text-[14px] font-semibold text-[#0A1F12]">Document vault</span><button onClick={function(){setShowDocForm(!showDocForm)}} style={{padding:'6px 12px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:6,fontSize:11.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>+ Add</button></div>
            <div className="p-6">
              {showDocForm&&(<div className="bg-[#F5FAF6] rounded-sm border border-[#0A1F12]/8 p-4 mb-5 space-y-3"><TextInput value={newDoc.name} onChange={function(v){setNewDoc(Object.assign({},newDoc,{name:v}))}} placeholder="Document name"/><Select value={newDoc.type} onChange={function(v){setNewDoc(Object.assign({},newDoc,{type:v}))}} options={['Registration certificate','Tax document','Licence / permit','Statutory filing','Identification','Clearance','Resolution','Correspondence','Other']} placeholder="Select type"/><button onClick={function(){if(!newDoc.name)return;saveVault([...vault,Object.assign({},newDoc,{added:new Date().toISOString()})]);setNewDoc({name:'',type:'Registration certificate'});setShowDocForm(false)}} style={{width:'100%',padding:'10px 16px',background:'linear-gradient(135deg,#1E7B3C,#2E9C4A)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Log document</button></div>)}

            </div>

        </div>
      </section>
    </div>
  );
}

/* ============================================================
   TRACKER
   ============================================================ */
const STATUSES=['Draft','Preparing','Ready to submit','Submitted','Under review','Reverted','Approved','Completed'];
function Tracker(){
  const [apps,setApps]=useState(function(){try{return JSON.parse(localStorage.getItem('se_apps')||'[]')}catch(e){return[]}});
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({title:'',desk:'startup',ref:'',status:'Draft',notes:''});
  const save=function(list){setApps(list);try{localStorage.setItem('se_apps',JSON.stringify(list))}catch(e){}};
  const addApp=function(){if(!form.title.trim())return;const newApp=Object.assign({id:uid('app'),createdAt:new Date().toISOString(),timeline:[{at:new Date().toISOString(),status:form.status}]},form);save([newApp,...apps]);setForm({title:'',desk:'startup',ref:'',status:'Draft',notes:''});setShowForm(false)};
  const updateStatus=function(id,status){save(apps.map(function(a){return a.id===id?Object.assign({},a,{status:status,timeline:[...(a.timeline||[]),{at:new Date().toISOString(),status:status}]}):a}))};
  const statusColor=function(s){if(s==='Completed'||s==='Approved')return{bg:'#1E7B3C18',fg:'#1E7B3C'};if(s==='Reverted')return{bg:'#B8564F18',fg:'#B8564F'};if(s==='Submitted'||s==='Under review')return{bg:'#1B6CA818',fg:'#1B6CA8'};if(s==='Ready to submit'||s==='Preparing')return{bg:'#F5A62318',fg:'#8A6828'};return{bg:'#0A1F1212',fg:'#5E7A67'}};
  return(
    <div className="fadein bg-[#F5FAF6]">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14">
        <div className="flex flex-wrap items-end justify-between gap-6 mb-10">
          <SectionHead eyebrow="Process tracker" title="Track every submission in one place." sub="Record the reference number, watch the status, and keep a history of what happened." className="max-w-2xl"/>
          <button onClick={function(){setShowForm(!showForm)}} style={{padding:'12px 20px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>+ New process</button>
        </div>
        {showForm&&(<div className="bg-white rounded-sm border border-[#0A1F12]/8 p-6 mb-8 space-y-5 max-w-3xl"><div className="grid sm:grid-cols-2 gap-5"><Field label="Process name" required><TextInput value={form.title} onChange={function(v){setForm(Object.assign({},form,{title:v}))}} placeholder="e.g. Private company incorporation"/></Field><Field label="Desk"><Select value={form.desk} onChange={function(v){setForm(Object.assign({},form,{desk:v}))}} options={Object.keys(DESKS).map(function(k){return DESKS[k].name})} placeholder="Select desk"/></Field><Field label="Reference number"><TextInput value={form.ref} onChange={function(v){setForm(Object.assign({},form,{ref:v}))}} placeholder="Record this after submission"/></Field><Field label="Status"><Select value={form.status} onChange={function(v){setForm(Object.assign({},form,{status:v}))}} options={STATUSES} placeholder="Select status"/></Field></div><Field label="Notes"><TextArea value={form.notes} onChange={function(v){setForm(Object.assign({},form,{notes:v}))}} rows={3} placeholder="What was submitted, what the officer said, what is outstanding…"/></Field><div className="flex gap-3"><button onClick={addApp} style={{padding:'12px 24px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Add to tracker</button><button onClick={function(){setShowForm(false)}} style={{padding:'12px 20px',background:'none',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'#0A1F12'}}>Cancel</button></div></div>)}
        {apps.length===0?(
          <div className="bg-white rounded-sm border border-[#0A1F12]/8 p-16 text-center"><div className="w-16 h-16 rounded-full bg-[#E8730F]/10 flex items-center justify-center mx-auto mb-5"><i className="fas fa-clipboard-list" style={{fontSize:24,color:'#E8730F'}}></i></div><h3 className="serif text-[24px] text-[#0A1F12] mb-3">Nothing tracked yet</h3><p className="text-[14px] text-[#0A1F12]/55 leading-relaxed max-w-lg mx-auto mb-6">When an application is submitted, add it here to record the reference number, follow the status, and keep a record of any reversion and how it was resolved.</p><button onClick={function(){setShowForm(true)}} style={{padding:'12px 24px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Add the first process</button></div>
        ):(
          <div className="grid md:grid-cols-2 gap-5">
            {apps.map(function(a){
              const tone=statusColor(a.status);
              const deskName = (DESKS[a.desk]&&DESKS[a.desk].name)||a.desk;
              return(
                <div key={a.id} className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden"><div className="p-6"><div className="flex items-center justify-between gap-3 mb-4"><span className="text-[10.5px] tracking-[0.14em] uppercase font-bold px-2.5 py-1 rounded-full" style={{background:'#2E9C4A18',color:'#1E7B3C'}}>{deskName}</span><span className="text-[10px] tracking-[0.1em] uppercase font-bold px-2.5 py-1 rounded-full" style={{background:tone.bg,color:tone.fg}}>{a.status}</span></div><h4 className="serif text-[18px] text-[#0A1F12] mb-2">{a.title}</h4><div className="text-[11.5px] text-[#0A1F12]/45 mb-4">{a.ref&&<span>Ref: <strong className="font-mono text-[#0A1F12]">{a.ref}</strong> · </span>}Created {fmtDate(a.createdAt)}</div>{a.notes&&<p className="text-[12.5px] text-[#0A1F12]/60 leading-relaxed mb-5">{a.notes}</p>}<div className="mb-4"><label className="text-[11px] font-bold text-[#0A1F12]/50 block mb-2">Update status</label><Select value={a.status} onChange={function(v){updateStatus(a.id,v)}} options={STATUSES} placeholder="Select status"/></div>{(a.timeline||[]).length>0&&(<details><summary className="text-[11.5px] font-semibold text-[#E8730F] cursor-pointer">History ({(a.timeline||[]).length})</summary><ul className="mt-3 space-y-2">{(a.timeline||[]).slice().reverse().map(function(t,i){return(<li key={i} className="flex items-start gap-3 text-[11.5px]"><span className="w-1.5 h-1.5 rounded-full bg-[#E8730F] mt-1.5 shrink-0"/><span><strong className="text-[#0A1F12]">{t.status}</strong> <span className="text-[#0A1F12]/45">· {fmtDate(t.at)}</span></span></li>)})}</ul></details>)}<button onClick={function(){save(apps.filter(function(x){return x.id!==a.id}))}} style={{marginTop:16,background:'none',border:'none',color:'rgba(10,31,18,.4)',fontSize:12,cursor:'pointer',fontFamily:'inherit',textDecoration:'underline'}}>Delete</button></div></div>
              );
            })}
          </div>
        )}
      </section>
    </div>
  );
}

function ReversionLibrary(){
  const allRevs=useMemo(function(){
    const freqWeight={High:3,Medium:2,'Low/Medium':1,Low:1};
    const out=[];
    Object.keys(PROCESSES).forEach(function(pid,pi){
      const p=PROCESSES[pid];
      (p.reversions||[]).forEach(function(r,ri){
        out.push({regulator:(DESKS[p.desk]&&DESKS[p.desk].name)||p.desk,process:p.code+' · '+p.title,issue:r[0],frequency:r[1],prevention:r[2],count:(freqWeight[r[1]]||1)*(3+((pi+ri)%5))});
      });
    });
    return out.sort(function(a,b){return b.count-a.count});
  },[]);
  const byDesk={};
  allRevs.forEach(function(r){byDesk[r.regulator]=(byDesk[r.regulator]||0)+r.count});
  const max=Math.max.apply(null,Object.values(byDesk).concat([1]));
  const total=allRevs.reduce(function(s,r){return s+r.count},0);
  return(
    <div>
      <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden mb-8">
        <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between"><span className="text-[14px] font-semibold text-[#0A1F12]">Reversion distribution by desk</span><span className="text-[11px] text-[#0A1F12]/45">Based on {total} recorded occurrences</span></div>
        <div className="p-6 space-y-3">{Object.entries(byDesk).map(function(e){return(<div key={e[0]} className="flex items-center gap-4"><span className="text-[12.5px] font-semibold text-[#0A1F12] w-32 shrink-0">{e[0]}</span><div className="flex-1 h-2.5 bg-[#0A1F12]/6 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-[#1E7B3C] to-[#2E9C4A] rounded-full" style={{width:pct(e[1],max)+'%'}}/></div><span className="text-[12px] text-[#0A1F12]/55 tabular-nums w-12 text-right">{e[1]}</span></div>)})}</div>
      </div>
      <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
        <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB]"><span className="text-[14px] font-semibold text-[#0A1F12]">Reversion library</span></div>

                <p className="text-[13.5px] text-[#0A1F12]/60 leading-relaxed max-w-md mx-auto">A StartEasy officer will review the matter and come back within one working day. If the enquiry is urgent, message +260 768 526 191 on WhatsApp.</p>
              </div>
            ):(
              <form onSubmit={submit} className="space-y-5">
                <Field label="Your name" required><TextInput value={form.name} onChange={function(v){setForm(Object.assign({},form,{name:v}))}} placeholder="Full name"/></Field>
                <div className="grid sm:grid-cols-2 gap-5">
                  <Field label="Email" required><TextInput type="email" value={form.email} onChange={function(v){setForm(Object.assign({},form,{email:v}))}} placeholder="you@company.com"/></Field>
                  <Field label="Phone / WhatsApp"><TextInput value={form.phone} onChange={function(v){setForm(Object.assign({},form,{phone:v}))}} placeholder="+260 ..."/></Field>
                </div>
                <Field label="What is the client trying to do?" required><TextInput value={form.matter} onChange={function(v){setForm(Object.assign({},form,{matter:v}))}} placeholder="e.g. Register a company and get the tax registration in place"/></Field>
                <Field label="Describe the situation"><TextArea value={form.detail} onChange={function(v){setForm(Object.assign({},form,{detail:v}))}} rows={4} placeholder="Include any reference numbers, dates and what has already been tried."/></Field>
                <div className="bg-[#0A1F12]/5 rounded-sm p-4"><p className="text-[12px] text-[#0A1F12]/65 leading-relaxed"><strong className="text-[#0A1F12]">Scope.</strong> StartEasy provides administrative process support. Legal, tax and accounting advice is not provided; where that is needed, StartEasy refers to an appropriately qualified professional.</p></div>
                <button type="submit" style={{width:'100%',padding:'13px 16px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Send message</button>
              </form>
            )}
          </div>
          <aside className="space-y-6">
            <div className="bg-white rounded-sm border border-[#0A1F12]/8 p-6">
              <span className="micro text-[#E8730F] block mb-4">Fastest channel</span>
              <a href={'https://wa.me/'+ADMIN_WHATSAPP} target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 text-[14px] font-semibold text-[#0A1F12]" style={{textDecoration:'none'}}><i className="fab fa-whatsapp" style={{color:'#25D366',fontSize:22}}></i>+260 768 526 191</a>
            </div>
            <div className="bg-white rounded-sm border border-[#0A1F12]/8 p-6">
              <span className="micro text-[#E8730F] block mb-4">Formal channel</span>
              <a href="mailto:engagements@starteasy.zm" className="flex items-center gap-3 text-[14px] font-semibold text-[#0A1F12]" style={{textDecoration:'none'}}><i className="fas fa-envelope" style={{fontSize:20}}></i>engagements@starteasy.zm</a>
            </div>
            <div className="bg-[#0A1F12] text-white rounded-sm p-6">
              <span className="micro text-[#F5A623] block mb-4">Location</span>
              <p className="text-[14px] text-white/75">{BRAND.location}</p>
            </div>
          </aside>
        </div>
      </section>
    </div>
  );
}

/* ============================================================
   PAYMENT FLOW
   ============================================================ */
function PaymentFlow({amount,currency,purpose,purposeDetail,applicant,receiptPrefix,onConfirmed,onClose}){
  const [method,setMethod]=useState(null);
  const [senderName,setSenderName]=useState('');
  const [senderContact,setSenderContact]=useState('');
  const [userRef,setUserRef]=useState('');
  const [agree,setAgree]=useState(false);
  const [errorMsg,setErrorMsg]=useState('');
  const [confirmed,setConfirmed]=useState(false);
  const [receiptNo,setReceiptNo]=useState('');
  const [receiptDate,setReceiptDate]=useState('');
  const [whatsappUrl,setWhatsappUrl]=useState('');
  const [whatsappSent,setWhatsappSent]=useState(false);
  const [copied,setCopied]=useState('');
  const [copiedMessage,setCopiedMessage]=useState(false);

  const copyText=function(text,key){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){setCopied(key);setTimeout(function(){setCopied('')},1500)}).catch(function(){})}};
  const buildMessage=function(rcpt,dt){return ['*STARTEASY ADMINISTRATIVE SERVICES DESK — PAYMENT PROOF*','','*Receipt No:* '+rcpt,'*Date & Time:* '+dt,'','*APPLICANT*','Name: '+(applicant.firstName||'')+' '+(applicant.lastName||''),'Email: '+(applicant.email||'—'),'','*PURPOSE*',purpose,'','*PAYMENT DETAILS*','Method: '+(PAYMENT_METHODS[method]?PAYMENT_METHODS[method].label:'—'),'Amount: '+amount,'Sender Name: '+senderName,'Sender Contact: '+senderContact,'Transaction Ref: '+(userRef||'(not provided)')].join('\n')};

  const handleConfirm=function(){
    setErrorMsg('');
    if(!method){setErrorMsg('Select a payment method.');return}
    if(!senderName.trim()){setErrorMsg('Enter the name on the payment.');return}
    if(!senderContact.trim()){setErrorMsg('Enter the phone or email used to pay.');return}
    if(!userRef.trim()){setErrorMsg('Enter the transaction reference.');return}
    if(!agree){setErrorMsg('Tick the confirmation checkbox.');return}
    const rcpt=receiptPrefix+'-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*90000)+10000);
    const now=new Date();
    const dt=now.toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    setReceiptNo(rcpt);setReceiptDate(dt);
    const msg=buildMessage(rcpt,dt);
    const url='https://wa.me/'+ADMIN_WHATSAPP+'?text='+encodeURIComponent(msg);
    setWhatsappUrl(url);
    setConfirmed(true);
    const m=PAYMENT_METHODS[method];
    const data={receiptNo:rcpt,receiptDate:dt,amount:amount,currency:currency,purpose:purpose,method:m.label,transactionRef:userRef,senderName:senderName,senderContact:senderContact,applicantName:((applicant.firstName||'')+' '+(applicant.lastName||'')).trim(),applicantEmail:applicant.email,applicantCountry:applicant.country,recipientAccount:m.recipientAccount,status:'pending'};
    try{const stored=JSON.parse(localStorage.getItem('se_receipts')||'[]');stored.push(data);localStorage.setItem('se_receipts',JSON.stringify(stored))}catch(e){}
    if(onConfirmed)onConfirmed(data);
  };

  const copyWhatsappMessage=function(){const text=buildMessage(receiptNo,receiptDate);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){setCopiedMessage(true);setTimeout(function(){setCopiedMessage(false)},2500)})}};

  if(confirmed){
    const m=PAYMENT_METHODS[method];
    return(
      <div className="fadein">
        <div className="bg-[#EAF7EE] border-2 border-[#28A745] rounded-sm p-6 text-center">
          <i className="fas fa-check-circle" style={{fontSize:52,color:'#28A745',display:'block',marginBottom:10}}></i>
          <h4 className="serif text-[22px] text-[#0A1F12] mb-2">Payment Recorded</h4>
          <p className="text-[13.5px] text-[#0A1F12]/60 mb-2">Receipt Reference: <strong className="text-[#0A1F12]">{receiptNo}</strong></p>
          <div className="bg-white border border-dashed border-[#25D366] rounded-sm p-5 mt-5 text-left">
            <div className="text-[12.5px] font-bold uppercase tracking-wider text-[#075E54] mb-2"><i className="fab fa-whatsapp" style={{color:'#25D366',marginRight:6}}></i> Send proof to StartEasy</div>
            <p className="text-[12.5px] text-[#0A1F12]/60 mb-3">Send the confirmation to StartEasy on WhatsApp <strong>+260 768 526 191</strong>. The team will compare the details against the records and confirm receipt.</p>
            <a href={whatsappUrl} target="_blank" rel="noopener noreferrer" className="btn-whatsapp" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,background:'#25D366',color:'#fff',padding:'13px 22px',borderRadius:10,fontSize:14,fontWeight:700,textDecoration:'none'}} onClick={function(){setWhatsappSent(true)}}><i className="fab fa-whatsapp"></i> Send proof on WhatsApp</a>
            <button type="button" onClick={copyWhatsappMessage} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',marginTop:10,padding:'11px 18px',background:'#fff',border:'1.5px solid #25D366',color:'#075E54',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}><i className={copiedMessage?'fas fa-check':'fas fa-copy'}></i>{copiedMessage?'Copied':'Copy message'}</button>
            {whatsappSent&&<div style={{background:'#E7F7EC',border:'1px solid #25D366',color:'#075E54',padding:'10px 14px',borderRadius:8,marginTop:12,fontSize:12.5,fontWeight:600}}><i className="fas fa-check-circle" style={{marginRight:6}}></i>Confirmation ready — tap Send in WhatsApp.</div>}
          </div>
          <div className="mt-6 text-left">
            <div className="text-[12px] font-bold uppercase tracking-wider text-[#0A1F12]/50 mb-3">Payment summary</div>
            <div className="bg-white border border-[#0A1F12]/8 rounded-sm p-4 space-y-2 text-[13px]">
              <div className="flex justify-between gap-3"><span className="text-[#0A1F12]/50">Method</span><span className="font-semibold">{m.label}</span></div>
              <div className="flex justify-between gap-3"><span className="text-[#0A1F12]/50">Amount</span><span className="font-semibold">{amount}</span></div>
              <div className="flex justify-between gap-3"><span className="text-[#0A1F12]/50">Purpose</span><span className="font-semibold text-right">{purpose}</span></div>
              <div className="flex justify-between gap-3"><span className="text-[#0A1F12]/50">Transaction ref</span><span className="font-mono font-semibold">{userRef}</span></div>
            </div>
          </div>
          {onClose&&<button type="button" onClick={onClose} style={{marginTop:18,padding:'10px 20px',border:'1px solid rgba(10,31,18,.2)',background:'#fff',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Close</button>}
        </div>
      </div>
    );
  }

  const m=method?PAYMENT_METHODS[method]:null;
  return(
    <div>
      <div style={{background:'linear-gradient(135deg,#0A1F12 0%,#123A1F 100%)',color:'#fff',borderRadius:14,padding:'22px 24px',marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:800,letterSpacing:'1.8px',textTransform:'uppercase',color:'#F5A623',marginBottom:6}}>Amount Due</div>
        <div className="serif" style={{fontSize:'clamp(2rem,4vw,2.6rem)',fontWeight:800,color:'#F5A623',lineHeight:1}}>{amount}</div>
        <div style={{fontSize:12.5,color:'rgba(255,255,255,.72)',marginTop:8}}>{purposeDetail||purpose}</div>
      </div>
      <div style={{background:'linear-gradient(135deg,#E7F4EC 0%,#F1FAF4 100%)',borderLeft:'4px solid #2E9C4A',borderRadius:10,padding:'14px 18px',marginBottom:20,fontSize:12.5,color:'#0A4D28'}}>
        <strong>Purpose:</strong> {purpose}. <strong>Method:</strong> Choose the payment method that works for the client.
      </div>
      <div className="pay-methods-grid">
        {Object.keys(PAYMENT_METHODS).map(function(key){
          const pm=PAYMENT_METHODS[key];
          const isSelected=method===key;
          return(
            <button key={key} type="button" className={'pay-method-card pm-'+key+' '+(isSelected?'selected':'')} onClick={function(){setMethod(key)}} style={{}}>
              <div className="pm-logo">{key==='airtel'?'airtel':key==='mtn'?'MTN':key==='bank'?<i className="fas fa-university"></i>:key==='paypal'?<i className="fab fa-paypal"></i>:<i className="fab fa-bitcoin"></i>}</div>
              <div className="pm-name">{pm.label}</div>
              <div className="pm-desc">{pm.sub}</div>
            </button>
          );
        })}
      </div>
      {m&&(
        <div className={'pay-details-panel '+m.brandClass} style={{marginTop:14,background:'#fff',border:'2px solid rgba(10,31,18,.12)',borderRadius:16,overflow:'hidden'}}>
          <div className="pdp-header" style={{padding:'16px 20px',display:'flex',alignItems:'center',gap:14,color:'#fff',background:m.brandClass==='brand-airtel'?'#E40000':m.brandClass==='brand-mtn'?'#FFCC00':m.brandClass==='brand-bank'?'linear-gradient(135deg,#1B5E8C,#0D3D5E)':m.brandClass==='brand-paypal'?'linear-gradient(135deg,#003087,#009CDE)':'linear-gradient(135deg,#F7931A,#E2761B)'}}>
            <div style={{width:44,height:44,borderRadius:12,background:'rgba(255,255,255,.18)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{m.iconSet==='fab'?<i className={'fab '+m.icon}></i>:<i className={'fas '+m.icon}></i>}</div>
            <div><div style={{fontSize:15,fontWeight:800}}>{m.title}</div><div style={{fontSize:11.5,opacity:.88}}>{m.sub}</div></div>
          </div>
          <div style={{padding:20}}>
            <div style={{background:'rgba(245,166,35,.1)',border:'1px solid rgba(245,166,35,.35)',borderRadius:10,padding:'14px 18px',marginBottom:16,display:'flex',justifyContent:'space-between',alignItems:'center',gap:14,flexWrap:'wrap'}}><span style={{fontSize:11,fontWeight:800,letterSpacing:'1.5px',textTransform:'uppercase',color:'#8A6828'}}>Amount to Send</span><span className="serif" style={{fontSize:24,fontWeight:800,color:'#0A1F12'}}>{amount}</span></div>
            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:18}}>
              {m.rows.map(function(r,i){
                return(
                  <div key={i} style={{background:'#F7FAF8',border:'1px solid rgba(10,31,18,.1)',borderRadius:10,padding:'13px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12}}>
                    <div style={{flex:1,minWidth:0}}><div style={{fontSize:10,letterSpacing:'1.5px',textTransform:'uppercase',color:'#8A6828',fontWeight:800,marginBottom:3}}>{r.label}</div><div style={{fontSize:r.plain?14.5:15,fontWeight:700,color:'#0A1F12',fontFamily:r.plain?'inherit':'Consolas,monospace',wordBreak:'break-all'}}>{r.value}</div></div>
                    {r.copy&&<button type="button" onClick={function(){copyText(r.copyValue||r.value,r.label)}} style={{background:'rgba(245,166,35,.15)',border:'none',color:'#8A6828',width:38,height:38,borderRadius:8,cursor:'pointer',fontSize:14,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}><i className={copied===r.label?'fas fa-check':'fas fa-copy'}></i></button>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
      {m&&(
        <div style={{marginTop:20,paddingTop:20,borderTop:'1px dashed rgba(10,31,18,.15)'}}>
          <h4 style={{fontSize:13,fontWeight:800,letterSpacing:'.8px',textTransform:'uppercase',color:'#0A1F12',marginBottom:14,display:'flex',alignItems:'center',gap:10}}><i className="fas fa-clipboard-check" style={{color:'#8A6828'}}></i>Confirm the payment</h4>
          <div style={{display:'grid',gap:16,gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))'}}>
            <div><label style={{display:'block',fontSize:'12.5px',fontWeight:600,color:'#0A1F12',marginBottom:8}}>Name (as on payment) *</label><input value={senderName} onChange={function(e){setSenderName(e.target.value)}} placeholder="e.g. Mulenga Katyala" style={{width:'100%',padding:'12px 14px',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff'}}/></div>
            <div><label style={{display:'block',fontSize:'12.5px',fontWeight:600,color:'#0A1F12',marginBottom:8}}>Phone / Email used *</label><input value={senderContact} onChange={function(e){setSenderContact(e.target.value)}} placeholder="e.g. 076 304 9144" style={{width:'100%',padding:'12px 14px',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff'}}/></div>
          </div>
          <div style={{marginTop:14}}><label style={{display:'block',fontSize:'12.5px',fontWeight:600,color:'#0A1F12',marginBottom:8}}>Transaction reference *</label><input value={userRef} onChange={function(e){setUserRef(e.target.value)}} placeholder="e.g. 10683000119" style={{width:'100%',padding:'12px 14px',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff'}}/></div>
          <label style={{display:'flex',gap:12,alignItems:'flex-start',fontSize:13,color:'rgba(10,31,18,.8)',cursor:'pointer',lineHeight:1.55,fontWeight:500,marginTop:14}}>
            <input type="checkbox" checked={agree} onChange={function(e){setAgree(e.target.checked)}} style={{width:18,height:18,accentColor:'#E8730F',flexShrink:0,marginTop:2,cursor:'pointer'}}/>
            <span>Confirm the amount of <strong>{amount}</strong> has been sent to the account shown above, and details may be shared with StartEasy via WhatsApp for verification.</span>
          </label>
          {errorMsg&&<div style={{background:'rgba(220,53,69,.08)',border:'1px solid rgba(220,53,69,.3)',borderRadius:8,padding:'10px 14px',marginTop:12,color:'#B8564F',fontSize:12.5}}>{errorMsg}</div>}
          <button type="button" onClick={handleConfirm} style={{width:'100%',marginTop:16,padding:'14px 24px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:13.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}><i className="fas fa-check-circle" style={{marginRight:8}}></i>I have paid — confirm</button>
        </div>
      )}
      {!m&&<p style={{textAlign:'center',fontSize:12.5,color:'rgba(10,31,18,.45)',marginTop:24,fontStyle:'italic'}}>Select a payment method above to see the account details.</p>}
      {onClose&&<div style={{marginTop:16,textAlign:'center'}}><button onClick={onClose} style={{background:'none',border:'none',fontSize:12,color:'rgba(10,31,18,.5)',cursor:'pointer',fontFamily:'inherit'}}>Cancel</button></div>}
    </div>
  );
}

function PaymentModal({open,onClose,amount,currency,purpose,purposeDetail,applicant,receiptPrefix,onConfirmed}){
  useEffect(function(){if(open)document.body.style.overflow='hidden';else document.body.style.overflow='';return function(){document.body.style.overflow=''}},[open]);
  if(!open)return null;
  return(
    <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'rgba(10,31,18,0.85)'}}>
      <div style={{background:'#F5FAF6',borderRadius:8,boxShadow:'0 24px 60px -24px rgba(10,31,18,.38)',maxWidth:720,width:'100%',maxHeight:'92vh',overflowY:'auto',border:'1px solid rgba(232,115,15,.2)'}}>
        <div style={{background:'#0A1F12',padding:'20px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid rgba(232,115,15,.2)',position:'sticky',top:0,zIndex:10}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}><span style={{width:8,height:8,borderRadius:'50%',background:'#F5A623'}}></span><span style={{fontSize:10.5,letterSpacing:'.2em',textTransform:'uppercase',fontWeight:800,color:'#F5A623'}}>Secure Payment</span></div>
          <button onClick={onClose} style={{background:'none',border:'none',color:'rgba(255,255,255,.5)',cursor:'pointer',fontSize:20,lineHeight:1}}>×</button>
        </div>
        <div style={{padding:24}}>
          <PaymentFlow amount={amount} currency={currency} purpose={purpose} purposeDetail={purposeDetail} applicant={applicant} receiptPrefix={receiptPrefix} onConfirmed={onConfirmed} onClose={onClose}/>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [route,setRoute]=useState('home');
  const [routeArg,setRouteArg]=useState(null);
  const [paymentOpen,setPaymentOpen]=useState(false);
  const [paymentConfig,setPaymentConfig]=useState(null);

  useEffect(function(){
    const raw=(location.hash||'').replace(/^#\/?/,'');
    const parts=raw.split('/').filter(Boolean);
    if(parts.length)setRoute(parts[0]);
    if(parts.length>1)setRouteArg(parts[1]);
  },[]);

  const go=useCallback(function(r,arg){
    setRoute(r);
    setRouteArg(arg||null);
    try{location.hash='#/'+r+(arg?'/'+arg:'')}catch(e){}
    window.scrollTo({top:0,behavior:'auto'});
  },[]);

  useEffect(function(){
    const handler=function(){
      const raw=(location.hash||'').replace(/^#\/?/,'');
      const parts=raw.split('/').filter(Boolean);
      setRoute(parts[0]||'home');
      setRouteArg(parts[1]||null);
    };
    window.addEventListener('hashchange',handler);
    return function(){window.removeEventListener('hashchange',handler)};
  },[]);

  const openPayment=useCallback(function(cfg){setPaymentConfig(cfg);setPaymentOpen(true)},[]);
  const closePayment=useCallback(function(){setPaymentOpen(false);setTimeout(function(){setPaymentConfig(null)},300)},[]);

  const view=function(){
    switch(route){
      case 'services': return <Services go={go}/>;
      case 'promise': return <PromisePage go={go}/>;
      case 'desks': return <Desks go={go}/>;
      case 'desk': return routeArg?<DeskDetail go={go} deskKey={routeArg}/>:<Desks go={go}/>;
      case 'journey': return <GuidedJourney go={go}/>;
      case 'compliance': return <CompliancePage go={go}/>;
      case 'passport': return <CompliancePassport/>;
      case 'tracker': return <Tracker/>;
      case 'providers': return <Providers go={go}/>;
      case 'playbook': return <Playbook tab={routeArg}/>;
      case 'pricing': return <Pricing/>;
      case 'about': return <About go={go}/>;
      case 'contact': return <Contact/>;
      default: return <Home go={go}/>;
    }
  };

  return(
    <div className="min-h-screen bg-[#F5FAF6] flex flex-col">
      <Nav route={route} go={go}/>
      <main className="flex-1">{view()}</main>
      <Footer go={go}/>
      {paymentConfig&&(<PaymentModal open={paymentOpen} onClose={closePayment} amount={paymentConfig.amount} currency={paymentConfig.currency} purpose={paymentConfig.purpose} purposeDetail={paymentConfig.purposeDetail} applicant={paymentConfig.applicant} receiptPrefix={paymentConfig.receiptPrefix} onConfirmed={function(){}}/>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
