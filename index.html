const ADMIN_WHATSAPP = '260768526191';
const CONTACT_EMAIL  = 'engagements@starteasy.zm';
const VERIFY_BASE_URL = 'https://starteasy.zm/verify';

function isMobileDevice(){ if(typeof navigator==='undefined') return false; const ua=(navigator.userAgent||navigator.vendor||'').toLowerCase(); return /android|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile/i.test(ua); }
function buildWhatsappUrl(message, phone){ const p=phone||ADMIN_WHATSAPP; const e=encodeURIComponent(message); if(isMobileDevice()) return 'whatsapp://send?phone='+p+'&text='+e; return 'https://wa.me/'+p+'?text='+e; }
function launchWhatsapp(message, phone){ const url=buildWhatsappUrl(message, phone); if(isMobileDevice()){ try{ const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener noreferrer'; a.style.display='none'; document.body.appendChild(a); a.click(); document.body.removeChild(a); return {opened:true,url}; }catch(e){ return {opened:false,url}; } } return {opened:false,url}; }

function numberToWords(num){const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];if(num===0)return'Zero';function chunk(n){if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');if(n<1000)return ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+chunk(n%100):'');if(n<1000000)return chunk(Math.floor(n/1000))+' Thousand'+(n%1000?' '+chunk(n%1000):'');return chunk(Math.floor(n/1000000))+' Million'+(n%1000000?' '+chunk(n%1000000):'')}return chunk(num)}
function amountInWords(amountStr,currency){const num=parseFloat(String(amountStr).replace(/[^\d.]/g,''))||0;const words=numberToWords(Math.round(num));if(currency==='USD')return'US Dollars '+words+' Only';if(currency==='ZMW')return words+' Kwacha Only';return words+' Only'}

/* =========================================================
   PAYMENT FLOW
   ========================================================= */
function PaymentFlow({amount,currency,purpose,purposeDetail,receiptPrefix,serviceKey,onConfirmed,onClose,onGoToDesk}){
  const [method,setMethod]=useState(null);
  const [senderName,setSenderName]=useState('');
  const [senderContact,setSenderContact]=useState('');
  const [userRef,setUserRef]=useState('');
  const [agree,setAgree]=useState(false);
  const [errorMsg,setErrorMsg]=useState('');
  const [confirmed,setConfirmed]=useState(false);
  const [receiptNo,setReceiptNo]=useState('');
  const [receiptDate,setReceiptDate]=useState('');
  const [whatsappUrl,setWhatsappUrl]=useState('');
  const [whatsappSent,setWhatsappSent]=useState(false);
  const [whatsappOpened,setWhatsappOpened]=useState(false);
  const [copied,setCopied]=useState('');
  const [generatingPDF,setGeneratingPDF]=useState(false);
  const [checkRef,setCheckRef]=useState('');
  const [checkResult,setCheckResult]=useState('');
  const [copiedMessage,setCopiedMessage]=useState(false);

  const copyText=(text,key)=>{const done=()=>{setCopied(key);setTimeout(()=>setCopied(''),1500)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));else fallbackCopy(text,done)};
  const fallbackCopy=(text,done)=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)};

  const buildWhatsappMessage=(rcpt,dateOverride)=>{
    const dateStr=dateOverride||receiptDate;
    return ['*STARTEASY — PAYMENT PROOF*','','*Receipt No:* '+rcpt,'*Date & Time:* '+dateStr,'','*PURPOSE*',purpose,'','*PAYMENT DETAILS*','Method: '+(PAYMENT_METHODS[method]?PAYMENT_METHODS[method].label:'—'),'Amount: '+amount,'Sender Name: '+senderName,'Sender Contact: '+senderContact,'Transaction ID / Ref: '+(userRef||'(not provided)'),'','_Please verify this payment against our records._'].join('\n');
  };

  const handleConfirm=async()=>{
    setErrorMsg('');
    if(!method){setErrorMsg('Please select a payment method first.');return}
    if(!senderName.trim()){setErrorMsg('Please enter the name on the payment.');return}
    if(!senderContact.trim()){setErrorMsg('Please enter the phone or email used to pay.');return}
    if(!userRef.trim()){setErrorMsg('Please enter your transaction reference.');return}
    if(!agree){setErrorMsg('Please tick the confirmation checkbox.');return}
    let waWindow=null;
    if(!isMobileDevice()){try{waWindow=window.open('about:blank','_blank');if(waWindow){try{waWindow.document.write('<title>Opening WhatsApp…</title><body style="font-family:system-ui;padding:24px;color:#0A1F12">Opening WhatsApp…</body>')}catch(e){}}}catch(e){}}
    const rcpt=receiptPrefix+'-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*90000)+10000);
    const now=new Date();const dt=now.toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    setReceiptNo(rcpt);setReceiptDate(dt);
    const msg=buildWhatsappMessage(rcpt,dt);
    if(isMobileDevice()){const result=launchWhatsapp(msg);setWhatsappUrl(result.url);setWhatsappOpened(result.opened)}else{const url=buildWhatsappUrl(msg);setWhatsappUrl(url);if(waWindow&&!waWindow.closed){try{waWindow.location.href=url;setWhatsappOpened(true)}catch(e){}}}
    setConfirmed(true);
    const m=PAYMENT_METHODS[method];
    const data={receiptNo:rcpt,receiptDate:dt,amount,currency,purpose,method:m.label,transactionRef:userRef,senderName,senderContact,recipientAccount:m.recipientAccount,serviceKey:serviceKey||'generic',status:'pending'};
    try{const stored=JSON.parse(localStorage.getItem('se_receipts')||'[]');stored.push(data);localStorage.setItem('se_receipts',JSON.stringify(stored))}catch(e){}
    if(onConfirmed)onConfirmed(data);
  };

  const copyWhatsappMessage=()=>{const text=buildWhatsappMessage(receiptNo,receiptDate);const done=()=>{setCopiedMessage(true);setTimeout(()=>setCopiedMessage(false),2500)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)})}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)}};

  const downloadReceiptPDF=async()=>{const el=document.getElementById('seReceipt');if(!el)return;if(typeof html2canvas==='undefined'||typeof window.jspdf==='undefined'){setErrorMsg('PDF generator not ready. Use Print instead.');return}setGeneratingPDF(true);try{const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});const imgData=canvas.toDataURL('image/png');const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});const pdfW=pdf.internal.pageSize.getWidth();const pdfH=pdf.internal.pageSize.getHeight();const margin=10;const usableW=pdfW-margin*2;const ratio=canvas.height/canvas.width;let dispW=usableW;let dispH=dispW*ratio;if(dispH>pdfH-margin*2){dispH=pdfH-margin*2;dispW=dispH/ratio}const xOffset=(pdfW-dispW)/2;pdf.addImage(imgData,'PNG',xOffset,margin,dispW,dispH);pdf.save('StartEasy-Receipt-'+receiptNo+'.pdf')}catch(err){console.error(err);setErrorMsg('Could not generate PDF. Try Print instead.')}finally{setGeneratingPDF(false)}};

  const printReceipt=()=>{document.body.classList.add('print-receipt-mode');setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('print-receipt-mode'),200)},100)};

  const lookupReceipt=()=>{if(!checkRef.trim()){setCheckResult('Please enter a receipt number.');return}try{const stored=JSON.parse(localStorage.getItem('se_receipts')||'[]');const found=stored.find(r=>r.receiptNo===checkRef.trim().toUpperCase());if(found){setCheckResult('PENDING — awaiting verification by our team.')}else{setCheckResult('Receipt not found on this device. Contact '+CONTACT_EMAIL+' with your receipt number.')}}catch(e){setCheckResult('Could not check right now. Please try again later.')}};

  if(confirmed){
    const m=PAYMENT_METHODS[method];
    const receiptData={receiptNo,receiptDate,amount,currency,purpose,method:m.label,transactionRef:userRef,senderName,senderContact,recipientAccount:m.recipientAccount,serviceKey:serviceKey||'generic'};
    return(
      <div className="fadein">
        <div className="payment-success">
          <i className="fas fa-check-circle ps-icon" aria-hidden="true"></i>
          <h4>Payment Recorded</h4>
          <p>Receipt Reference: <strong>{receiptNo}</strong></p>
          <p style={{fontSize:12.5,color:'rgba(10,31,18,.6)',marginTop:6}}>Your receipt has been generated below. Download it for your records.</p>
          <div className="ps-whatsapp-block">
            <div className="psw-title"><i className="fab fa-whatsapp" aria-hidden="true"></i> Step 1 — Send proof to StartEasy</div>
            <p>To confirm your payment, send the confirmation below to our team on WhatsApp <strong>+260 768 526 191</strong>.</p>
            <a href={whatsappUrl} className="btn-whatsapp" target="_blank" rel="noopener noreferrer" onClick={()=>setWhatsappSent(true)}><i className="fab fa-whatsapp" aria-hidden="true"></i><span>{whatsappOpened?'Open WhatsApp again':'Send proof to WhatsApp'}</span></a>
            <button type="button" onClick={copyWhatsappMessage} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',marginTop:10,padding:'11px 18px',background:'#fff',border:'1.5px solid #25D366',color:'#075E54',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}><i className={`fas ${copiedMessage?'fa-check':'fa-copy'}`} aria-hidden="true"></i>{copiedMessage?'Message copied to clipboard':'Copy message (if WhatsApp is blocked)'}</button>
            <div className="psw-note">If WhatsApp does not open automatically, use the green button above. If it is still blocked, copy the message and send it manually to <strong>+260 768 526 191</strong>.</div>
            {whatsappSent&&<div className="psw-sent show"><i className="fas fa-check-circle"></i> Confirmation ready — please tap <strong>Send</strong> in WhatsApp.</div>}
          </div>
          <ServiceFulfilment serviceKey={serviceKey||'generic'} receiptData={receiptData} onGoToDesk={onGoToDesk}/>
          <div className="receipt-section">
            <div className="receipt-section-head"><div><h5><i className="fas fa-file-invoice" style={{color:'#8A6828',marginRight:6}}></i> Your receipt</h5><div className="rsh-sub">Download or print for your records</div></div><div className="receipt-buttons"><button type="button" className="receipt-btn receipt-btn-gold" onClick={downloadReceiptPDF} disabled={generatingPDF}><i className={`fas ${generatingPDF?'fa-spinner fa-spin':'fa-download'}`}></i> {generatingPDF?'Generating…':'Download PDF'}</button><button type="button" className="receipt-btn" onClick={printReceipt}><i className="fas fa-print"></i> Print</button></div></div>
            <Receipt data={receiptData} id="seReceipt"/>
            <div className="receipt-check">
              <h6><i className="fas fa-search"></i> Check receipt status later</h6>
              <div className="receipt-check-row"><input type="text" value={checkRef} onChange={e=>setCheckRef(e.target.value)} placeholder="Enter your Receipt No (e.g. SE-A4-2026-00001)"/><button type="button" onClick={lookupReceipt} style={{padding:'10px 18px',background:'#1E7B3C',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Check</button></div>
              {checkResult&&<div className="receipt-check-result show">{checkResult}</div>}
            </div>
          </div>
          {errorMsg&&<p style={{color:'#DC3545',fontSize:12.5,marginTop:12}}>{errorMsg}</p>}
          {onClose&&<button type="button" onClick={onClose} style={{marginTop:18,padding:'10px 20px',border:'1px solid rgba(10,31,18,.2)',background:'#fff',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'#0A1F12'}}>Close</button>}
        </div>
      </div>
    );
  }

  const m=method?PAYMENT_METHODS[method]:null;
  return(
    <div>

display:'flex',gap:12,alignItems:'flex-start',fontSize:13,color:'rgba(10,31,18,.8)',cursor:'pointer',lineHeight:1.55,fontWeight:500,marginTop:14}}><input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)} style={{width:18,height:18,accentColor:'#E8730F',flexShrink:0,marginTop:2,cursor:'pointer'}}/><span>I confirm I have sent <strong>{amount}</strong> to the account shown above, and I agree my details will be shared with the StartEasy team via WhatsApp for verification.</span></label>{errorMsg&&<div style={{background:'rgba(220,53,69,.08)',border:'1px solid rgba(220,53,69,.3)',borderRadius:8,padding:'10px 14px',marginTop:12,color:'#B8564F',fontSize:12.5,display:'flex',alignItems:'center',gap:8}}><i className="fas fa-exclamation-circle"></i> {errorMsg}</div>}<button type="button" onClick={handleConfirm} style={{width:'100%',marginTop:16,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:10,background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,padding:'14px 20px',fontSize:13.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}><i className="fas fa-check-circle"></i> I have paid — generate my receipt</button></div>)}

function Btn({children,onClick,variant='primary',size='md',className='',type='button',disabled}){
  const base='inline-flex items-center justify-center gap-2.5 transition-all duration-300 tracking-wide disabled:opacity-30 disabled:cursor-not-allowed rounded-sm font-semibold';
  const sizes={sm:'text-[12px] px-4 py-2.5',md:'text-[13px] px-6 py-3.5',lg:'text-[13.5px] px-8 py-4'};
  const variants={primary:'bg-gradient-to-br from-[#E8730F] to-[#F5A623] text-white hover:shadow-[0_0_25px_rgba(232,115,15,0.4)]',green:'bg-gradient-to-br from-[#1E7B3C] to-[#2E9C4A] text-white hover:shadow-[0_0_25px_rgba(46,156,74,0.4)]',ghost:'border border-[#0A1F12]/20 text-[#0A1F12] hover:border-[#E8730F] hover:bg-[#E8730F]/5',ghostLight:'border border-white/20 text-white hover:bg-[#F5A623] hover:text-[#0A1F12] hover:border-[#F5A623]',forest:'bg-[#0A1F12] text-white hover:bg-[#123A1F]'};
  return(<button type={type} onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>{children}</button>);
}
function Arrow({className=''}){return(<svg className={className} width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M9 1L13 5L9 9M13 5H1" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>)}
function SectionHead({eyebrow,title,sub,light,className=''}){

}

  const [newDoc,setNewDoc]=useState({name:'',type:'Registration certificate'});
  const [tab,setTab]=useState('renewals');

  const saveRenewals=(l)=>{setRenewals(l);try{localStorage.setItem('se_renewals',JSON.stringify(l))}catch(e){}};

    const tk={id:uid('tk'),service:form.service,subject:form.subject,detail:form.detail,status:'Logged',ref:'SE-'+Math.random().toString(36).slice(2,7).toUpperCase(),createdAt:new Date().toISOString()};

            <ul className="space-y-2.5">{ABOUT.model.primary.map((c,i)=>(<li key={i} className="flex items-start gap-2.5 text-[13.5px] text-[#0A1F12]/70 leading-relaxed"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1E7B3C" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="mt-1 shrink-0"><path d="M20 6L9 17l-5-5"/></svg>{c}</li>))}</ul>
          </div>
          <div className="bg-white rounded-sm border border-[#0A1F12]/8 p-7 lg:p-9" style={{borderTopWidth:4,borderTopColor:'#E8730F'}}>
            <span className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#8A6828] bg-[#F5A623]/20 px-2.5 py-1 rounded-full inline-block mb-5">Secondary customers</span>
            <ul className="space-y-2.5">{ABOUT.model.secondary.map((c,i)=>(<li key={i} className="flex items-start gap-2.5 text-[13.5px] text-[#0A1F12]/70 leading-relaxed"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E8730F" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="mt-1 shrink-0"><path d="M20 6L9 17l-5-5"/></svg>{c}</li>))}</ul>
          </div>
        </div>
      </section>

      {/* 5. Value proposition */}
      <section className="bg-white">
        <div className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
          <SectionHead eyebrow="5 · Value proposition" title="What StartEasy provides." className="mb-12 max-w-3xl"/>
          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-px bg-[#0A1F12]/8 rounded-sm overflow-hidden border border-[#0A1F12]/8">
            {ABOUT.value.map((v,i)=>(<div key={i} className="bg-white p-7 lg:p-9"><span className="serif text-[14px] text-[#E8730F] font-bold block mb-5">{String(i+1).padStart(2,'0')}</span><h3 className="serif text-[22px] text-[#0A1F12] mb-3">{v.t}</h3><p className="text-[13.5px] leading-relaxed text-[#0A1F12]/55">{v.d}</p></div>))}
          </div>
        </div>
      </section>

      {/* 6. Service catalogue reference */}
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
        <SectionHead eyebrow="6 · Service catalogue" title="The full service structure." sub="Six service categories across four desks. Every service line is scoped and priced — see the Services page for details and to request any of them." className="mb-12 max-w-3xl"/>
        <div className="space-y-8">
          {SERVICE_GROUPS.map(g=>(<div key={g.id} className="bg-white rounded-sm border border-[#0A1F12]/8 p-7 lg:p-9" style={{borderLeftWidth:4,borderLeftColor:g.color}}>
            <div className="flex items-center gap-4 mb-6">
              <span className="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:g.color+'18',color:g.color}}><i className={'fas '+g.icon} style={{fontSize:19}}></i></span>
              <div><span className="text-[10.5px] tracking-[0.14em] uppercase font-bold block mb-0.5" style={{color:g.color}}>Desk {g.code}</span><h3 className="serif text-[20px] text-[#0A1F12] leading-tight">{g.title}</h3></div>
            </div>
            <ul className="space-y-3">{g.services.map(s=>(<li key={s.code} className="flex items-start gap-3 pb-3 border-b border-[#0A1F12]/6 last:border-0 last:pb-0"><span className="text-[11px] font-mono text-[#0A1F12]/40 shrink-0 mt-0.5">{s.code}</span><div><span className="block text-[13.5px] font-semibold text-[#0A1F12]">{s.title}</span><span className="block text-[12.5px] text-[#0A1F12]/55 leading-relaxed mt-0.5">{s.tagline}</span></div></li>))}</ul>
          </div>))}
        </div>
        <div className="mt-8 flex flex-wrap gap-3"><Btn size="lg" variant="primary" onClick={()=>go('solutions')}>See all services with pricing <Arrow/></Btn></div>
      </section>

      {/* 7. Institutions */}
      <section className="bg-white">
        <div className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
          <SectionHead eyebrow="7 · Coordination" title="Who StartEasy coordinates with." sub="Where applicable, StartEasy coordinates administrative processes involving the relevant institutions. The exact obligations should always be determined based on the client's business, legal structure, activities, employees and location." className="mb-10 max-w-3xl"/>
          <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
            {ABOUT.institutions.map((x,i)=>(<div key={i} className="bg-[#F5FAF6] rounded-sm border border-[#0A1F12]/8 p-4 text-center"><span className="text-[12.5px] font-semibold text-[#0A1F12] leading-snug block">{x}</span></div>))}
          </div>
        </div>
      </section>

      {/* 8. Roles & boundaries */}
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
        <SectionHead eyebrow="8 · Boundaries" title="How the roles divide." sub="StartEasy assists clients in navigating administrative and regulatory processes. It does not guarantee regulatory approval and does not represent itself as a government authority." className="mb-10 max-w-3xl"/>
        <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden mb-8">
          <div className="overflow-x-auto"><table className="w-full border-collapse" style={{minWidth:520}}><thead><tr><th className="text-left py-3 px-5 bg-[#FBFDFB] border-b border-[#0A1F12]/6 text-[10.5px] tracking-[0.1em] uppercase font-bold text-[#0A1F12]/50">Who</th><th className="text-left py-3 px-5 bg-[#FBFDFB] border-b border-[#0A1F12]/6 text-[10.5px] tracking-[0.1em] uppercase font-bold text-[#0A1F12]/50">Responsibility</th></tr></thead><tbody>{ABOUT.roles.map((r,i)=>(<tr key={i} className="border-b border-[#0A1F12]/6 last:border-0"><td className="py-3.5 px-5 text-[13px] font-semibold text-[#0A1F12] align-top">{r[0]}</td><td className="py-3.5 px-5 text-[12.5px] text-[#0A1F12]/60 leading-relaxed">{r[1]}</td></tr>))}</tbody></table></div>
        </div>
        <div className="grid md:grid-cols-2 gap-6">
          <div className="bg-white p-7 rounded-sm border border-[#0A1F12]/8"><h3 className="serif text-[20px] text-[#0A1F12] mb-4">What StartEasy is</h3><ul className="space-y-3">{['An administrative support and process-management service.','A navigation and preparation layer between you and official regulatory systems.','A quality-control step before submission.','A keeper of your compliance calendar and records.','A referral route to qualified professionals when a matter requires it.'].map((x,i)=>(<li key={i} className="text-[13px] text-[#0A1F12]/65 leading-relaxed flex items-start gap-2.5"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1E7B3C" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="mt-1 shrink-0"><path d="M20 6L9 17l-5-5"/></svg>{x}</li>))}</ul></div>
          <div className="bg-white p-7 rounded-sm border border-[#0A1F12]/8"><h3 className="serif text-[20px] text-[#0A1F12] mb-4">What StartEasy is not</h3><ul className="space-y-3">{['Not a government authority or a regulator.','Not a guarantor of regulatory approval.','Not a law firm or legal adviser.','Not an accounting or tax advisory practice.','Not an informal agent operating outside official channels.'].map((x,i)=>(<li key={i} className="text-[13px] text-[#0A1F12]/65 leading-relaxed flex items-start gap-2.5"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B8564F" strokeWidth="3" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>{x}</li>))}</ul></div>
        </div>
      </section>

      {/* Final CTA */}
      <section className="bg-[#0A1F12]">
        <div className="max-w-[1320px] mx-auto px-6 lg:px-10 py-20 lg:py-28">
          <div className="max-w-3xl">
            <h2 className="serif text-[clamp(2rem,5vw,3.2rem)] leading-[1.1] text-white mb-6">Ready when you are.</h2>
            <p className="text-[16px] leading-relaxed text-white/55 mb-10 max-w-2xl">Pick the service that matches your objective, or tell us what you are trying to achieve and we will route it to the right desk.</p>
            <div className="flex flex-wrap gap-4">
              <Btn size="lg" variant="primary" onClick={()=>go('solutions')}>Browse all services <Arrow/></Btn>
              <Btn size="lg" variant="ghostLight" onClick={()=>go('compliance')}>Compliance Desk</Btn>
            </div>
          </div>
        </div>
      </section>
    </div>
  );
}

/* =========================================================
   FLOATING ASSISTANT
   ========================================================= */
function FloatingAssistant(){
  const [open,setOpen]=useState(false);
  return(
    <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end" style={{paddingBottom:'env(safe-area-inset-bottom)'}}>
      {open&&(
        <div className="mb-4 w-[19rem] max-w-[calc(100vw-48px)] bg-white rounded-lg shadow-2xl border border-[#0A1F12]/10 overflow-hidden fadein-s">
          <div className="bg-[#0A1F12] px-5 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3"><span className="w-2 h-2 rounded-full bg-[#F5A623] pulse-soft"/><span className="text-[12px] font-semibold text-white tracking-wide">Need help choosing?</span></div>
            <button onClick={()=>setOpen(false)} className="text-white/50 hover:text-white transition-colors" style={{background:'none',border:'none',cursor:'pointer'}} aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg></button>
          </div>
          <div className="p-5">
            <p className="text-[12.5px] text-[#0A1F12]/65 leading-relaxed mb-4">Tell us what you are trying to do and we will point you to the right service — or you can message us directly.</p>
            <a href={'https://wa.me/'+ADMIN_WHATSAPP+'?text='+encodeURIComponent('Hello StartEasy — I need help choosing the right service.')} target="_blank" rel="noopener noreferrer" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:9,background:'#25D366',color:'#fff',padding:'12px 18px',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp" style={{fontSize:16}}></i> Chat on WhatsApp</a>
            <a href={'mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent('I need help choosing a StartEasy service')} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:9,background:'#fff',color:'#0A1F12',padding:'12px 18px',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none',marginTop:8,border:'1px solid rgba(10,31,18,.15)'}}><i className="fas fa-envelope" style={{fontSize:14}}></i> Email us</a>
            <p className="text-[11px] text-[#0A1F12]/40 leading-relaxed mt-4 text-center">Typical response within 4 working hours.</p>
          </div>
        </div>
      )}
      <button onClick={()=>setOpen(!open)} className="w-14 h-14 rounded-full bg-gradient-to-br from-[#E8730F] to-[#F5A623] shadow-[0_4px_20px_rgba(232,115,15,0.45)] flex items-center justify-center hover:scale-105 transition-transform duration-300" style={{border:'none',cursor:'pointer'}} aria-label="Help">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */
function App(){
  const [route,setRoute]=useState('home');
  const [serviceModal,setServiceModal]=useState(null);
  const [paymentOpen,setPaymentOpen]=useState(false);
  const [paymentConfig,setPaymentConfig]=useState(null);

  useEffect(()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);if(parts.length)setRoute(parts[0])},[]);
  const go=useCallback((r)=>{setRoute(r);try{location.hash='#/'+r}catch(e){}window.scrollTo({top:0,behavior:'auto'})},[]);
  useEffect(()=>{const handler=()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);setRoute(parts[0]||'home')};window.addEventListener('hashchange',handler);return()=>window.removeEventListener('hashchange',handler)},[]);

  const openPayment=useCallback((cfg)=>{setPaymentConfig(cfg);setPaymentOpen(true)},[]);
  const closePayment=useCallback(()=>{setPaymentOpen(false);setTimeout(()=>setPaymentConfig(null),300)},[]);

  const requestService=useCallback((service)=>{
    setServiceModal(null);
    setTimeout(()=>{
      openPayment({
        amount:service.priceZm,
        currency:'ZMW',
        purpose:service.code+' — '+service.title,
        purposeDetail:service.desc,
        receiptPrefix:'SE-'+service.code,
        serviceKey:service.serviceKey||'generic'
      });
    },260);
  },[]);

  const handlePaymentConfirmed=useCallback(()=>{},[]);

  const view=()=>{
    switch(route){
      case 'solutions': return <SolutionsPage onOpenService={setServiceModal}/>;
      case 'compliance': return <CompliancePage openServiceModal={setServiceModal} openPayment={openPayment}/>;
      case 'pricing': return <PricingPage openServiceModal={setServiceModal} openPayment={openPayment}/>;
      case 'about': return <AboutPage go={go}/>;
      default: return <Home go={go} onOpenService={setServiceModal}/>;
    }
  };

  return(
    <div className="min-h-screen bg-[#F5FAF6] flex flex-col">
      <Nav route={route} go={go}/>
      <main className="flex-1">{view()}</main>
      <Footer go={go}/>
      <FloatingAssistant/>

      {serviceModal&&(<ServiceDetailModal service={serviceModal} onClose={()=>setServiceModal(null)} onRequest={requestService}/>)}

      {paymentConfig&&(
        <ModalShell open={paymentOpen} onClose={closePayment} eyebrow="Secure payment" title={paymentConfig.purpose} maxWidth="48rem">
          <PaymentFlow
            amount={paymentConfig.amount}
            currency={paymentConfig.currency}
            purpose={paymentConfig.purpose}
            purposeDetail={paymentConfig.purposeDetail}
            receiptPrefix={paymentConfig.receiptPrefix}
            serviceKey={paymentConfig.serviceKey}
            onConfirmed={handlePaymentConfirmed}
            onClose={closePayment}
            onGoToDesk={()=>{closePayment();setTimeout(()=>go('compliance'),320)}}
          />
        </ModalShell>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
