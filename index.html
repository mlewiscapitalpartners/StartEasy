<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StartEasy — Regulatory &amp; Administrative Services Desk · Zambia</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>

<style>
:root{
    --forest:#0A1F12;
    --forest-2:#123A1F;
    --green:#1E7B3C;
    --green-2:#2E9C4A;
    --green-4:#7DD957;
    --orange:#E8730F;
    --orange-2:#F5A623;
    --yellow:#FFC107;
    --light:#F5FAF6;
    --line:#DCE9DF;
    --muted:#5E7A67
}

html{
    overflow-x:hidden;
    -webkit-text-size-adjust:100%
}

body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:var(--light);
    overflow-x:hidden;
    width:100%;
    max-width:100vw;
    position:relative;
    margin:0
}

#root{
    overflow-x:hidden;
    width:100%;
    min-width:0
}

*,*::before,*::after{
    box-sizing:border-box;
    min-width:0
}

h1,h2,h3,h4,h5,h6,p,span,a,li,div{
    overflow-wrap:break-word;
    word-wrap:break-word
}

button,a{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent
}

img,svg,video,canvas,iframe,embed,object{
    max-width:100%;
    height:auto
}

.serif{
    font-family:'Playfair Display',Georgia,serif
}

.micro{
    font-size:10.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    font-weight:700
}

::selection{
    background:var(--orange-2);
    color:var(--forest)
}

input,select,textarea{
    font-family:'Inter',system-ui,sans-serif
}

input:focus,select:focus,textarea:focus{
    outline:none
}

.fadein{
    animation:fadein .5s cubic-bezier(.22,.61,.36,1) both
}

@keyframes fadein{
    from{
        opacity:0;
        transform:translateY(12px)
    }
    to{
        opacity:1;
        transform:none
    }
}

.fadein-s{
    animation:fadein .3s ease both
}

.pulse-soft{
    animation:pulseSoft 2s infinite ease-in-out
}

@keyframes pulseSoft{
    0%,100%{opacity:1}
    50%{opacity:.55}
}

::-webkit-scrollbar{
    width:8px;
    height:8px
}

::-webkit-scrollbar-track{
    background:var(--forest)
}

::-webkit-scrollbar-thumb{
    background:var(--orange-2);
    border-radius:4px
}

.modal-fade{
    animation:modalFade .25s ease both
}

@keyframes modalFade{
    from{opacity:0}
    to{opacity:1}
}

.modal-card{
    animation:modalCard .35s cubic-bezier(.22,.61,.36,1) both
}

@keyframes modalCard{
    from{
        opacity:0;
        transform:translateY(30px) scale(.98)
    }
    to{
        opacity:1;
        transform:none
    }
}

@media (max-width:768px){
    .fadein,
    .fadein-s{
        animation:none !important;
        opacity:1 !important;
        transform:none !important
    }

    .pulse-soft{
        animation:none !important;
        opacity:1 !important
    }
}

@media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:0.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:0.01ms !important;
        scroll-behavior:auto !important
    }
}

@media (min-width:1024px){
    html{
        scroll-behavior:smooth
    }
}

/* =========================
   REGISTRY SEARCH
========================= */

.registry-search-wrap{
    background:linear-gradient(
        135deg,
        #0A1F12 0%,
        #123A1F 100%
    );
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden
}

.registry-search-wrap::after{
    content:"";
    position:absolute;
    top:-60px;
    right:-60px;
    width:180px;
    height:180px;
    background:
        radial-gradient(
            circle,
            rgba(245,166,35,.18),
            transparent 65%
        );
    pointer-events:none
}

.registry-search-wrap .rsw-label{
    font-size:10.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--orange-2);
    font-weight:800;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:8px
}

.registry-search-wrap .rsw-title{
    font-family:'Playfair Display',Georgia,serif;
    font-size:22px;
    color:#fff;
    margin-bottom:6px;
    line-height:1.2
}

.registry-search-wrap .rsw-sub{
    font-size:12.5px;
    color:rgba(255,255,255,.55);
    line-height:1.6;
    margin-bottom:16px;
    max-width:640px
}

/* =========================
   FULFILMENT TIMELINE
========================= */

.fulfil-timeline{
    list-style:none;
    padding:0;
    margin:0
}

.fulfil-timeline li{
    position:relative;
    padding:0 0 22px 46px;
    border-left:2px solid rgba(10,31,18,.1);
    margin-left:16px
}

.fulfil-timeline li:last-child{
    border-left-color:transparent;
    padding-bottom:0
}

.fulfil-timeline li::before{
    content:'';
    position:absolute;
    left:-13px;
    top:0;
    width:26px;
    height:26px;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--orange-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:800;
    color:var(--orange);
    font-family:'Playfair Display',Georgia,serif;
    z-index:1
}

.fulfil-timeline li[data-step]::before{
    content:attr(data-step)
}

.fulfil-timeline li[data-state="done"]::before{
    content:'\f00c';
    font-family:'Font Awesome 6 Free';
    font-weight:900;
    background:var(--green);
    border-color:var(--green);
    color:#fff;
    font-size:11px
}

.fulfil-timeline li[data-state="now"]::before{
    background:var(--orange-2);
    border-color:var(--orange-2);
    color:#fff;
    animation:pulseSoft 2s infinite ease-in-out
}

.fulfil-timeline li .ft-title{
    font-size:14px;
    font-weight:700;
    color:var(--forest);
    margin-bottom:4px
}

.fulfil-timeline li .ft-desc{
    font-size:12.5px;
    color:rgba(10,31,18,.6);
    line-height:1.55;
    margin-bottom:6px
}

.fulfil-timeline li .ft-when{
    display:inline-block;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:800;
    color:var(--orange);
    background:rgba(232,115,15,.1);
    padding:3px 10px;
    border-radius:99px
}

.fulfil-timeline li[data-state="now"] .ft-when{
    background:rgba(232,115,15,.2)
}

/* =========================
   PAYMENT AMOUNT
========================= */

.pay-amount-banner{
    background:
        linear-gradient(
            135deg,
            var(--forest) 0%,
            var(--forest-2) 100%
        );
    color:#fff;
    border-radius:14px;
    padding:22px 24px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    position:relative;
    overflow:hidden
}

.pay-amount-banner .pab-label{
    font-size:11px;
    font-weight:800;
    letter-spacing:1.8px;
    text-transform:uppercase;
    color:var(--orange-2);
    margin-bottom:6px
}

.pay-amount-banner .pab-amount{
    font-family:'Playfair Display',Georgia,serif;
    font-size:clamp(2rem,4vw,2.6rem);
    font-weight:800;
    color:var(--orange-2);
    line-height:1
}

.pay-amount-banner .pab-context{
    font-size:12.5px;
    color:rgba(255,255,255,.72);
    margin-top:8px;
    max-width:400px;
    line-height:1.6
}

.pay-amount-banner .pab-icon{
    font-size:44px;
    color:var(--orange-2);
    opacity:.65;
    flex-shrink:0
}

/* =========================
   FEE TIER
========================= */

.fee-tier-note{
    background:
        linear-gradient(
            135deg,
            #E7F4EC 0%,
            #F1FAF4 100%
        );
    border-left:4px solid var(--green-2);
    border-radius:10px;
    padding:14px 18px;
    margin-bottom:20px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    font-size:12.5px;
    color:#0A4D28;
    line-height:1.65
}

.fee-tier-note i{
    color:var(--green);
    font-size:16px;
    flex-shrink:0;
    margin-top:2px
}

/* =========================
   PAYMENT METHODS
========================= */

.pay-methods-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-bottom:20px
}

.pay-method-card{
    background:#fff;
    border:2px solid rgba(10,31,18,.12);
    border-radius:14px;
    padding:18px 12px 16px;
    cursor:pointer;
    transition:all .25s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    font-family:inherit;
    position:relative;
    overflow:hidden
}

.pay-method-card:hover{
    border-color:var(--orange-2);
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,.08)
}

.pay-method-card.selected{
    border-color:var(--orange-2);
    box-shadow:0 0 0 4px rgba(245,166,35,.14);
    transform:translateY(-3px)
}

.pay-method-card.selected::after{
    content:'\f00c';
    font-family:'Font Awesome 6 Free';
    font-weight:900;
    position:absolute;
    top:8px;
    right:8px;
    width:22px;
    height:22px;
    background:var(--orange-2);
    color:var(--forest);
    border-radius:50%;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center
}

.pay-method-card .pm-logo{
    width:56px;
    height:56px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-family:Arial,Helvetica,sans-serif;
    flex-shrink:0
}

.pay-method-card .pm-name{
    font-size:12.5px;
    font-weight:800;
    color:var(--forest);
    line-height:1.25
}

.pay-method-card .pm-desc{
    font-size:10.5px;
    color:rgba(10,31,18,.5);
    font-weight:500;
    line-height:1.35
}

.pm-airtel .pm-logo{
    background:#E40000;
    color:#fff;
    font-size:15px;
    font-style:italic;
    text-transform:lowercase;
    padding-bottom:2px
}

.pm-mtn .pm-logo{
    background:#FFCC00;
    color:#000;
    font-size:14px
}

.pm-bank .pm-logo{
    background:linear-gradient(135deg,#1B5E8C 0%,#0D3D5E 100%);
    color:#fff;
    font-size:22px
}

.pm-paypal .pm-logo{
    background:linear-gradient(135deg,#003087 0%,#009CDE 100%);
    color:#fff;
    font-size:20px
}

.pm-crypto .pm-logo{
    background:linear-gradient(135deg,#F7931A 0%,#E2761B 100%);
    color:#fff;
    font-size:22px
}

/* =========================
   PAYMENT DETAILS
========================= */

.pay-details-panel{
    margin-top:14px;
    background:#fff;
    border:2px solid rgba(10,31,18,.12);
    border-radius:16px;
    overflow:hidden;
    animation:fadein .35s ease
}

.pay-details-panel.brand-airtel{
    border-color:#E40000
}

.pay-details-panel.brand-mtn{
    border-color:#FFCC00
}

.pay-details-panel.brand-bank{
    border-color:#1B5E8C
}

.pay-details-panel.brand-paypal{
    border-color:#003087
}

.pay-details-panel.brand-crypto{
    border-color:#F7931A
}

.pdp-header{
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    color:#fff
}

.brand-airtel .pdp-header{
    background:#E40000
}

.brand-mtn .pdp-header{
    background:#FFCC00;
    color:#000
}

.brand-bank .pdp-header{
    background:linear-gradient(135deg,#1B5E8C 0%,#0D3D5E 100%)
}

.brand-paypal .pdp-header{
    background:linear-gradient(135deg,#003087 0%,#009CDE 100%)
}

.brand-crypto .pdp-header{
    background:linear-gradient(135deg,#F7931A 0%,#E2761B 100%)
}

.pdp-header .pdp-icon{
    width:44px;
    height:44px;
    border-radius:12px;
    background:rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0
}

.brand-mtn .pdp-header .pdp-icon{
    background:rgba(0,0,0,.12)
}

.pdp-header .pdp-title{
    font-size:15px;
    font-weight:800;
    line-height:1.25
}

.pdp-header .pdp-sub{
    font-size:11.5px;
    opacity:.88;
    margin-top:2px;
    font-weight:500
}

.pdp-body{
    padding:20px
}

.pdp-amount-banner{
    background:
        linear-gradient(
            135deg,
            rgba(245,166,35,.1) 0%,
            rgba(245,166,35,.05) 100%
        );
    border:1px solid rgba(245,166,35,.2);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:16px;
}
.pdp-amount-banner .pab-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px
}

.pdp-amount-banner .pab-label{
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(10,31,18,.55);
    font-weight:800
}

.pdp-amount-banner .pab-value{
    font-family:'Playfair Display',Georgia,serif;
    font-size:24px;
    font-weight:800;
    color:var(--forest)
}

.pdp-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid rgba(10,31,18,.08)
}

.pdp-row:last-child{
    border-bottom:0
}

.pdp-row .pdr-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:800;
    color:rgba(10,31,18,.48);
    flex-shrink:0
}

.pdp-row .pdr-value{
    font-size:13px;
    font-weight:700;
    color:var(--forest);
    text-align:right;
    word-break:break-word
}

.pdp-row .pdr-value.muted{
    font-weight:500;
    color:rgba(10,31,18,.65)
}

.copy-btn{
    border:0;
    background:rgba(10,31,18,.06);
    color:var(--forest);
    border-radius:7px;
    padding:5px 8px;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
    margin-left:6px;
    transition:all .2s ease
}

.copy-btn:hover{
    background:var(--orange-2)
}

.pdp-steps{
    margin-top:16px
}

.pdp-steps-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.12em;
    font-weight:800;
    color:var(--forest);
    margin-bottom:10px
}

.pdp-step{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:9px
}

.pdp-step-num{
    width:22px;
    height:22px;
    border-radius:50%;
    background:rgba(10,31,18,.08);
    color:var(--forest);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:800;
    flex-shrink:0
}

.pdp-step-text{
    font-size:12px;
    color:rgba(10,31,18,.7);
    line-height:1.55
}

.pdp-note{
    margin-top:16px;
    padding:12px 14px;
    border-radius:9px;
    background:#FFF8E8;
    border:1px solid rgba(245,166,35,.25);
    color:#6B4A00;
    font-size:11.5px;
    line-height:1.6
}

.pdp-note i{
    margin-right:7px;
    color:var(--orange)
}

/* =========================
   REFERENCE BOX
========================= */

.reference-box{
    margin-top:18px;
    background:#F5FAF6;
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px
}

.reference-box .rb-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.13em;
    color:var(--muted);
    font-weight:800;
    margin-bottom:7px
}

.reference-box .rb-value{
    font-family:monospace;
    font-size:14px;
    font-weight:800;
    color:var(--forest);
    word-break:break-all
}

/* =========================
   SUCCESS PANEL
========================= */

.success-panel{
    background:
        linear-gradient(
            135deg,
            #E7F4EC 0%,
            #F6FBF7 100%
        );
    border:1px solid rgba(46,156,74,.25);
    border-radius:16px;
    padding:24px;
    margin-bottom:20px
}

.success-panel .success-icon{
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--green);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    margin-bottom:14px
}

.success-panel h3{
    font-family:'Playfair Display',Georgia,serif;
    font-size:24px;
    color:var(--forest);
    margin:0 0 8px
}

.success-panel p{
    margin:0;
    font-size:13px;
    color:rgba(10,31,18,.68);
    line-height:1.65
}

/* =========================
   APPLICATION SHELL
========================= */

.app-shell{
    min-height:100vh;
    width:100%;
    background:var(--light)
}

.top-strip{
    height:4px;
    width:100%;
    background:
        linear-gradient(
            90deg,
            var(--green) 0%,
            var(--green-2) 42%,
            var(--orange-2) 72%,
            var(--orange) 100%
        )
}

.site-header{
    background:var(--forest);
    color:#fff;
    position:sticky;
    top:0;
    z-index:1000;
    border-bottom:1px solid rgba(255,255,255,.08)
}

.site-header-inner{
    max-width:1280px;
    margin:0 auto;
    padding:15px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:#fff;
    min-width:0
}

.brand-mark{
    width:42px;
    height:42px;
    border-radius:11px;
    background:
        linear-gradient(
            135deg,
            var(--orange-2),
            var(--orange)
        );
    color:var(--forest);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:18px;
    flex-shrink:0
}

.brand-copy{
    min-width:0
}

.brand-name{
    font-size:17px;
    font-weight:800;
    line-height:1.1;
    white-space:nowrap
}

.brand-sub{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.15em;
    color:rgba(255,255,255,.52);
    margin-top:4px;
    white-space:nowrap
}

.header-nav{
    display:flex;
    align-items:center;
    gap:4px
}

.header-nav button{
    border:0;
    background:transparent;
    color:rgba(255,255,255,.75);
    font:inherit;
    font-size:12px;
    font-weight:600;
    padding:9px 11px;
    border-radius:8px;
    cursor:pointer;
    transition:all .2s ease
}

.header-nav button:hover,
.header-nav button.active{
    background:rgba(255,255,255,.09);
    color:#fff
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px
}

.header-action{
    width:38px;
    height:38px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.05);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer
}

.header-action:hover{
    background:rgba(255,255,255,.12)
}

.mobile-menu-btn{
    display:none
}

/* =========================
   MAIN CONTAINER
========================= */

.main-container{
    max-width:1280px;
    margin:0 auto;
    padding:30px 24px 70px
}

.page-header{
    margin-bottom:26px
}

.page-header .eyebrow{
    color:var(--orange);
    margin-bottom:7px
}

.page-header h1{
    font-family:'Playfair Display',Georgia,serif;
    color:var(--forest);
    font-size:clamp(30px,5vw,48px);
    line-height:1.08;
    margin:0 0 12px;
    font-weight:800
}

.page-header p{
    max-width:760px;
    color:rgba(10,31,18,.63);
    font-size:14px;
    line-height:1.7;
    margin:0
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;
    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(245,166,35,.18),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            var(--forest) 0%,
            var(--forest-2) 100%
        );
    border-radius:22px;
    padding:clamp(30px,6vw,70px);
    overflow:hidden;
    color:#fff;
    margin-bottom:30px
}

.hero::before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    right:-180px;
    top:-180px
}

.hero::after{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    border:1px solid rgba(245,166,35,.16);
    border-radius:50%;
    right:-80px;
    bottom:-140px
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:760px
}

.hero-eyebrow{
    color:var(--orange-2);
    margin-bottom:14px
}

.hero h1{
    font-family:'Playfair Display',Georgia,serif;
    font-size:clamp(36px,6vw,64px);
    line-height:1.03;
    margin:0 0 18px;
    font-weight:800
}

.hero h1 span{
    color:var(--orange-2)
}

.hero p{
    font-size:15px;
    line-height:1.75;
    color:rgba(255,255,255,.68);
    max-width:690px;
    margin:0 0 24px
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px
}

.btn{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-family:inherit;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-decoration:none
}

.btn:hover{
    transform:translateY(-2px)
}

.btn-primary{
    background:var(--orange-2);
    color:var(--forest);
    box-shadow:0 6px 18px rgba(245,166,35,.2)
}

.btn-primary:hover{
    background:#FFC44D;
    box-shadow:0 9px 22px rgba(245,166,35,.28)
}

.btn-secondary{
    background:rgba(255,255,255,.08);
    color:#fff;
    border:1px solid rgba(255,255,255,.16)
}

.btn-secondary:hover{
    background:rgba(255,255,255,.14)
}

.btn-green{
    background:var(--green);
    color:#fff
}

.btn-green:hover{
    background:var(--green-2)
}

.btn-dark{
    background:var(--forest);
    color:#fff
}

.btn-outline{
    background:#fff;
    border:1px solid var(--line);
    color:var(--forest)
}

.btn-outline:hover{
    border-color:var(--orange-2);
    background:#FFF9ED
}

.btn-danger{
    background:#B42318;
    color:#fff
}

.btn-sm{
    padding:8px 12px;
    font-size:11px
}

.btn-lg{
    padding:14px 22px;
    font-size:13px
}

.btn-block{
    width:100%
}

/* =========================
   STATS
========================= */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:30px
}

.stat-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    position:relative;
    overflow:hidden
}

.stat-card::after{
    content:"";
    position:absolute;
    right:-25px;
    bottom:-25px;
    width:80px;
    height:80px;
    border-radius:50%;
    background:rgba(46,156,74,.06)
}

.stat-icon{
    width:38px;
    height:38px;
    border-radius:9px;
    background:#E8F5EC;
    color:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:12px
}

.stat-value{
    font-family:'Playfair Display',Georgia,serif;
    font-size:28px;
    font-weight:800;
    color:var(--forest);
    line-height:1
}

.stat-label{
    margin-top:7px;
    font-size:11px;
    color:var(--muted);
    font-weight:600
}

/* =========================
   SECTION
========================= */

.section{
    margin-bottom:34px
}

.section-heading{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    margin-bottom:16px
}

.section-heading h2{
    font-family:'Playfair Display',Georgia,serif;
    font-size:28px;
    color:var(--forest);
    margin:0;
    line-height:1.15
}

.section-heading p{
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    margin:5px 0 0
}

.section-link{
    border:0;
    background:none;
    color:var(--green);
    font:inherit;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap
}

.section-link:hover{
    color:var(--orange)
}

/* =========================
   CARDS
========================= */

.card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:15px;
    box-shadow:0 2px 8px rgba(10,31,18,.03)
}

.card-pad{
    padding:20px
}

.card-hover{
    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease
}

.card-hover:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(10,31,18,.08);
    border-color:rgba(46,156,74,.3)
}

/* =========================
   SERVICE CARDS
========================= */

.service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px
}

.service-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:15px;
    padding:20px;
    cursor:pointer;
    transition:all .25s ease;
    position:relative
}

.service-card:hover{
    border-color:rgba(46,156,74,.35);
    box-shadow:0 12px 28px rgba(10,31,18,.08);
    transform:translateY(-3px)
}

.service-card .sc-icon{
    width:46px;
    height:46px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
    font-size:18px
}

.sc-green .sc-icon{
    background:#E8F5EC;
    color:var(--green)
}

.sc-orange .sc-icon{
    background:#FFF0E3;
    color:var(--orange)
}

.sc-blue .sc-icon{
    background:#E8F2FA;
    color:#1B6CA8
}

.sc-purple .sc-icon{
    background:#F1EAF7;
    color:#7A4FA3
}

.sc-teal .sc-icon{
    background:#E6F5F4;
    color:#0E7C7B
}

.service-card h3{
    font-size:15px;
    color:var(--forest);
    margin:0 0 7px;
    line-height:1.3
}

.service-card p{
    font-size:11.5px;
    color:rgba(10,31,18,.58);
    line-height:1.6;
    margin:0 0 14px
}

.service-card .sc-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding-top:12px;
    border-top:1px solid rgba(10,31,18,.07)
}

.service-card .sc-time{
    font-size:10px;
    color:var(--muted);
    font-weight:700
}

.service-card .sc-arrow{
    color:var(--green);
    font-size:12px
}

.popular-badge{
    position:absolute;
    top:12px;
    right:12px;
    background:#FFF2D4;
    color:#8A5900;
    font-size:8.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:900;
    padding:4px 7px;
    border-radius:99px
}

/* =========================
   DESK CARDS
========================= */

.desk-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px
}

.desk-card{
    border:1px solid var(--line);
    background:#fff;
    border-radius:14px;
    padding:18px 14px;
    cursor:pointer;
    text-align:left;
    transition:all .22s ease
}

.desk-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(10,31,18,.06)
}

.desk-card .desk-icon{
    width:38px;
    height:38px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:11px
}

.desk-card .desk-name{
    font-size:12px;
    font-weight:800;
    color:var(--forest);
    margin-bottom:4px
}

.desk-card .desk-full{
    font-size:9.5px;
    line-height:1.45;
    color:var(--muted)
}

.desk-green .desk-icon{
    background:#E8F5EC;
    color:#2E9C4A
}

.desk-blue .desk-icon{
    background:#E8F2FA;
    color:#1B6CA8
}

.desk-purple .desk-icon{
    background:#F1EAF7;
    color:#7A4FA3
}

.desk-orange .desk-icon{
    background:#FFF0E3;
    color:#E8730F
}

.desk-teal .desk-icon{
    background:#E6F5F4;
    color:#0E7C7B
}

/* =========================
   SEARCH
========================= */

.search-wrap{
    position:relative;
    width:100%
}

.search-input{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
    padding:12px 42px 12px 40px;
    color:var(--forest);
    font-size:12px;
    transition:border-color .2s ease,box-shadow .2s ease
}

.search-input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(46,156,74,.1)
}

.search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none
}

.search-clear{
    position:absolute;
    right:9px;
    top:50%;
    transform:translateY(-50%);
    width:28px;
    height:28px;
    border:0;
    border-radius:7px;
    background:transparent;
    color:var(--muted);
    cursor:pointer
}

.search-clear:hover{
    background:rgba(10,31,18,.06)
}

/* =========================
   BADGES
========================= */

.badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:4px 8px;
    border-radius:99px;
    font-size:9px;
    font-weight:800;
    white-space:nowrap
}

.badge-green{
    color:#17652F;
    background:#E5F5EA
}

.badge-orange{
    color:#8A4700;
    background:#FFF0DE
}

.badge-blue{
    color:#14517D;
    background:#E7F2FA
}

.badge-purple{
    color:#603681;
    background:#F0E8F6
}

.badge-gray{
    color:#52645A;
    background:#EEF2EF
}

.badge-red{
    color:#8B241B;
    background:#FCE9E7
}

/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px
}

.form-grid.three{
    grid-template-columns:repeat(3,1fr)
}

.form-field{
    display:flex;
    flex-direction:column;
    gap:7px
}

.form-field.full{
    grid-column:1 / -1
}

.form-label{
    font-size:11px;
    color:var(--forest);
    font-weight:800
}

.form-help{
    font-size:10px;
    color:var(--muted);
    line-height:1.5
}

.form-input,
.form-select,
.form-textarea{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--forest);
    border-radius:9px;
    padding:11px 12px;
    font-size:12px;
    transition:border-color .2s ease,box-shadow .2s ease
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(46,156,74,.09)
}

.form-textarea{
    min-height:100px;
    resize:vertical
}

.form-error{
    font-size:10px;
    color:#A52A20;
    line-height:1.4
}

/* =========================
   CHECKBOX / RADIO
========================= */

.option-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px
}

.option-card{
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    padding:13px;
    cursor:pointer;
    transition:all .2s ease;
    text-align:left
}

.option-card:hover{
    border-color:rgba(46,156,74,.35)
}

.option-card.selected{
    border-color:var(--green);
    background:#F1FAF4;
    box-shadow:0 0 0 2px rgba(46,156,74,.08)
}

.option-card .option-title{
    font-size:12px;
    font-weight:800;
    color:var(--forest);
    margin-bottom:4px
}

.option-card .option-desc{
    font-size:10.5px;
    color:var(--muted);
    line-height:1.5
}

/* =========================
   TABLE
========================= */

.table-wrap{
    width:100%;
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:13px;
    background:#fff
}

.data-table{
    width:100%;
    min-width:650px;
    border-collapse:collapse
}

.data-table th{
    text-align:left;
    padding:12px 14px;
    background:#F5FAF6;
    border-bottom:1px solid var(--line);
    color:var(--muted);
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:800
}

.data-table td{
    padding:13px 14px;
    border-bottom:1px solid rgba(10,31,18,.06);
    font-size:11.5px;
    color:var(--forest);
    vertical-align:top
}

.data-table tr:last-child td{
    border-bottom:0
}

.data-table tr:hover td{
    background:#FBFDFC
}

/* =========================
   PROCESS PAGE
========================= */

.process-header{
    background:
        linear-gradient(
            135deg,
            var(--forest),
            var(--forest-2)
        );
    border-radius:18px;
    padding:28px;
    color:#fff;
    margin-bottom:20px
}

.process-header .ph-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px
}

.process-code{
    font-family:monospace;
    font-size:10px;
    color:var(--orange-2);
    font-weight:800;
    letter-spacing:.05em;
    margin-bottom:8px
}

.process-header h1{
    font-family:'Playfair Display',Georgia,serif;
    font-size:clamp(26px,4vw,40px);
    line-height:1.1;
    margin:0 0 9px
}

.process-header .process-summary{
    color:rgba(255,255,255,.65);
    font-size:12.5px;
    line-height:1.65;
    max-width:760px
}

.process-meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:16px
}

.process-meta span{
    padding:5px 9px;
    border-radius:99px;
    background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.76);
    font-size:9.5px;
    font-weight:700
}

.process-layout{
    display:grid;
    grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);
    gap:20px;
    align-items:start
}

.process-main{
    min-width:0
}

.process-side{
    position:sticky;
    top:90px
}

.process-section{
    background:#fff;
    border:1px solid var(--line);
    border-radius:15px;
    padding:20px;
    margin-bottom:16px
}

.process-section-title{
    font-family:'Playfair Display',Georgia,serif;
    font-size:20px;
    color:var(--forest);
    margin:0 0 15px
}

.process-step{
    display:flex;
    gap:14px;
    padding:15px 0;
    border-bottom:1px solid rgba(10,31,18,.07)
}

.process-step:first-child{
    padding-top:0
}

.process-step:last-child{
    border-bottom:0;
    padding-bottom:0
}

.process-step-num{
    width:30px;
    height:30px;
    border-radius:50%;
    background:#E8F5EC;
    color:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:900;
    flex-shrink:0
}

.process-step h4{
    margin:0 0 4px;
    font-size:13px;
    color:var(--forest)
}

.process-step p{
    margin:0;
    color:var(--muted);
    font-size:11.5px;
    line-height:1.6
}

.doc-list{
    list-style:none;
    padding:0;
    margin:0
}

.doc-list li{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding:9px 0;
    border-bottom:1px solid rgba(10,31,18,.06);
    font-size:11.5px;
    color:rgba(10,31,18,.72);
    line-height:1.5
}

.doc-list li:last-child{
    border-bottom:0
}

.doc-list i{
    color:var(--green);
    margin-top:3px;
    flex-shrink:0
}

.warning-list{
    list-style:none;
    padding:0;
    margin:0
}

.warning-list li{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid rgba(10,31,18,.06)
}

.warning-list li:last-child{
    border-bottom:0
}

.warning-title{
    font-size:11px;
    font-weight:700;
    color:var(--forest);
    line-height:1.45
}

.warning-action{
    font-size:10px;
    color:var(--muted);
    line-height:1.45;
    margin-top:3px
}

/* =========================
   JOURNEY
========================= */

.journey-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px
}

.journey-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:15px;
    padding:18px;
    cursor:pointer;
    transition:all .22s ease
}

.journey-card:hover{
    transform:translateY(-3px);
    border-color:rgba(46,156,74,.35);
    box-shadow:0 10px 25px rgba(10,31,18,.07)
}

.journey-icon{
    font-size:28px;
    margin-bottom:11px
}

.journey-card h3{
    font-size:14px;
    color:var(--forest);
    margin:0 0 7px;
    line-height:1.3
}

.journey-card p{
    font-size:11px;
    color:var(--muted);
    line-height:1.55;
    margin:0 0 12px
}

.journey-tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px
}

.journey-tag{
    font-size:8.5px;
    background:#F0F4F1;
    color:#567061;
    padding:4px 7px;
    border-radius:99px;
    font-weight:700
}

/* =========================
   DASHBOARD
========================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);
    gap:18px;
    align-items:start
}

.dashboard-main,
.dashboard-side{
    min-width:0
}

.dashboard-side{
    position:sticky;
    top:90px
}

.profile-card{
    background:
        linear-gradient(
            135deg,
            var(--forest),
            var(--forest-2)
        );
    color:#fff;
    border-radius:16px;
    padding:22px;
    margin-bottom:16px
}

.profile-card .pc-top{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--orange-2);
    color:var(--forest);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:900;
    flex-shrink:0
}

.profile-card h3{
    margin:0;
    font-size:15px;
    font-weight:800
}

.profile-card p{
    margin:4px 0 0;
    font-size:10.5px;
    color:rgba(255,255,255,.58)
}

.profile-progress{
    height:7px;
    border-radius:99px;
    background:rgba(255,255,255,.1);
    overflow:hidden;
    margin-top:9px
}

.profile-progress > div{
    height:100%;
    background:var(--orange-2);
    border-radius:99px
}

.profile-progress-label{
    display:flex;
    justify-content:space-between;
    font-size:9.5px;
    color:rgba(255,255,255,.58);
    margin-top:6px
}

.dashboard-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:15px;
    margin-bottom:16px;
    overflow:hidden
}

.dashboard-card-header{
    padding:16px 18px;
    border-bottom:1px solid rgba(10,31,18,.07);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px
}

.dashboard-card-header h3{
    font-size:13px;
    color:var(--forest);
    margin:0;
    font-weight:800
}

.dashboard-card-body{
    padding:18px
}

/* =========================
   PROGRESS
========================= */

.progress-bar{
    width:100%;
    height:8px;
    border-radius:99px;
    background:#E9EFEB;
    overflow:hidden
}

.progress-bar > div{
    height:100%;
    background:var(--green);
    border-radius:99px;
    transition:width .4s ease
}

.progress-row{
    margin-bottom:13px
}

.progress-row:last-child{
    margin-bottom:0
}

.progress-row-top{
    display:flex;

/* ======================================================

====================================================== */

function safeParse(value,fallback){
    try{
        return JSON.parse(value);
    }catch(error){
        return fallback;
    }
}

function formatDate(value){
    if(!value) return '—';

    try{
        return new Date(value).toLocaleDateString(
            'en-ZM',
            {
                day:'2-digit',
                month:'short',
                year:'numeric'
            }
        );
    }catch(error){
        return value;
    }
}

function formatDateTime(value){
    if(!value) return '—';

    try{
        return new Date(value).toLocaleString(
            'en-ZM',
            {
                day:'2-digit',
                month:'short',
                year:'numeric',
                hour:'2-digit',
                minute:'2-digit'
            }
        );
    }catch(error){
        return value;
    }
}

function generateReference(prefix='SE'){
    const now = new Date();

    const datePart =
        now.getFullYear().toString().slice(-2) +
        String(now.getMonth()+1).padStart(2,'0') +
        String(now.getDate()).padStart(2,'0');

    const randomPart =
        Math.random()
            .toString(36)
            .substring(2,8)
            .toUpperCase();

    return `${prefix}-${datePart}-${randomPart}`;
}

function copyText(value){
    if(!value) return Promise.resolve(false);

    if(
        navigator.clipboard &&
        typeof navigator.clipboard.writeText === 'function'
    ){
        return navigator.clipboard
            .writeText(value)
            .then(()=>true)
            .catch(()=>fallbackCopy(value));
    }

    return Promise.resolve(fallbackCopy(value));
}

function fallbackCopy(value){
    try{
        const textarea=document.createElement('textarea');

        textarea.value=value;
        textarea.style.position='fixed';
        textarea.style.left='-9999px';
        textarea.style.top='-9999px';

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();

        const result=document.execCommand('copy');

        textarea.remove();

        return result;
    }catch(error){
        return false;
    }
}

function scrollToTop(){
    window.scrollTo({
        top:0,
        behavior:'smooth'
    });

function slugify(value=''){
    return value
        .toString()
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g,'-')
        .replace(/^-+|-+$/g,'');
}

function clamp(value,min,max){
    return Math.min(
        Math.max(value,min),
        max
    );
}

function uid(prefix='SE'){
    return `${prefix}-${Date.now()}-${Math.random()
        .toString(36)
        .slice(2,8)
        .toUpperCase()}`;
}

function writeStorage(key,value){

}

    }
}


/* ======================================================
   NAME ANALYSIS
====================================================== */

function analyseName(name=''){
    const value=name
        .trim()
        .replace(/\s+/g,' ');

    let score=0;
    let band='Low readiness';
    let cls='bad';

    if(!value){
        return {
            name:value,
            score:0,
            band:'Enter a name',
            cls:'bad',
            checks:[]
        };
    }

    const words=value.split(' ').filter(Boolean);

    if(value.length>=5){
        score+=10;
    }

    if(value.length>=10){
        score+=10;
    }

    if(words.length>=2){
        score+=10;
    }

    if(!/[0-9]/.test(value)){
        score+=10;
    }

    if(!/[^\w\s&'-]/.test(value)){
        score+=10;
    }

    const protectedTerms=[
        'bank',
        'university',
        'insurance',
        'authority',
        'government',
        'national',
        'republic',
        'ministry'
    ];

    const lower=value.toLowerCase();

    const protectedHits=
        protectedTerms.filter(
            term=>lower.includes(term)
        );

    if(protectedHits.length===0){
        score+=15;
    }

    if(protectedHits.length>0){
        score-=10;
    }

    if(
        !lower.includes('limited') &&
        !lower.includes('ltd')
    ){
        score+=5;
    }

    score=clamp(score,0,100);

    if(score>=80){
        band='Strong readiness';
        cls='good';
    }
    else if(score>=60){
        band='Moderate readiness';
        cls='medium';
    }
    else if(score>=40){
        /*
         * IMPORTANT FIX:
         * The original code incorrectly used:
         *
         * band:'Low readiness'
         *
         * which is a label rather than an assignment.
         *
         * Correct:
         */
        band='Low readiness';
        cls='bad';
    }
    else{
        band='Needs attention';
        cls='bad';
    }

    return {
        name:value,
        score,
        band,
        cls,
        checks:[
            {
                label:'Basic length',
                passed:value.length>=5
            },
            {
                label:'Multiple words',
                passed:words.length>=2
            },
            {
                label:'No obvious restricted terms',
                passed:protectedHits.length===0
            },
            {
                label:'Clean characters',
                passed:!/[^\w\s&'-]/.test(value)
            }
        ]
    };
}

function NameCheck({
    navigate,
    openPayment,
    showToast
}){
    const [name,setName]=useState('');
    const [result,setResult]=useState(null);
    const [names,setNames]=useState([]);

    const analyse=()=>{
        const cleaned=name.trim();

        if(!cleaned){
            showToast(
                'Enter a proposed business name first.',
                'warning'
            );
            return;
        }

        const analysis=analyseName(cleaned);

        setResult(analysis);

        setNames(prev=>{
            const exists=prev.some(
                item=>
                    item.name.toLowerCase()===
                    analysis.name.toLowerCase()
            );

            if(exists){
                return prev;
            }

            return [
                ...prev,
                analysis
            ].slice(-5);
        });
    };

    return React.createElement(
        React.Fragment,
        null,

        React.createElement(
            'div',

/* ---------------------------------------------------------
   ERROR BOUNDARY
   IMPORTANT FOR BLANK-PAGE DIAGNOSIS
--------------------------------------------------------- */

class AppErrorBoundary extends React.Component {

  constructor(props) {

    super(props);

    this.state = {
      hasError: false,
      error: null
    };

  }

  static getDerivedStateFromError(error) {

    return {
      hasError: true,
      error
    };

  }

  componentDidCatch(error, info) {

    console.error(
      'Application rendering error:',
      error,
      info
    );

  }

  render() {

    if (this.state.hasError) {

      return (

        <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center px-6">

          <div className="max-w-xl text-center">

            <div className="mx-auto w-14 h-14 rounded-2xl bg-red-500/10 text-red-400 flex items-center justify-center text-xl">
              <Icon name="triangle-exclamation" />
            </div>

            <h1 className="text-2xl font-bold mt-5">
              Something went wrong
            </h1>

            <p className="text-slate-400 mt-3">
              The application encountered an error while rendering this page.
            </p>

            <details className="text-left mt-6 bg-white/5 rounded-xl p-4">

              <summary className="cursor-pointer text-sm font-semibold">
                Technical details
              </summary>

              <pre className="text-xs text-red-300 whitespace-pre-wrap mt-4 overflow-auto">
                {this.state.error?.stack ||
                  this.state.error?.message ||
                  String(this.state.error)}
              </pre>

            </details>

            <button
              onClick={() => window.location.reload()}
              className="mt-6 px-6 py-3 rounded-xl bg-white text-slate-950 font-semibold"
            >
              Reload application
            </button>

          </div>

        </div>

      );

    }

    return this.props.children;

  }

}

  /* -------------------------------------------------------
     PAGE CONTENT
  ------------------------------------------------------- */

  let content;


  switch (page) {

    case 'home':

      content = (

        <Home
          onNavigate={navigate}
        />

      );

      break;


    case 'journeys':

      content = (

        <Journeys
          onNavigate={navigate}
        />

      );

      break;


    case 'desks':

      content = (

        <Desks
          onNavigate={navigate}
        />

      );

      break;


    case 'namecheck':

      content = (

        <NameCheck
          onNavigate={navigate}
        />

      );

      break;


    case 'dashboard':

      content = (

        <Protected>

          <Dashboard
            user={user}
            onNavigate={navigate}
          />

        </Protected>

      );

      break;


    case 'login':

      content = (

        <Login
          onLogin={login}
          onNavigate={navigate}
        />

      );

      break;


    case 'register':

      content = (

        <Register
          onRegister={register}
          onNavigate={navigate}
        />

      );

      break;


    case 'checkout':

      content = (

        <Checkout
          onBack={() => navigate('home')}
          onComplete={() => {
            setToast({
              message: 'Payment request submitted successfully.',
              type: 'success'
            });
            navigate('dashboard');
          }}
        />

      );

      break;


    default:

      content = (

        <NotFound
          onNavigate={navigate}
        />

      );

  }


  /* -------------------------------------------------------
     APP OUTPUT
  ------------------------------------------------------- */

  return (

    <AppErrorBoundary>

      <div className="min-h-screen bg-white text-slate-900">

        <Header />

        <main>
          {content}
        </main>

        <Footer />

        <Toast
          message={toast?.message}
          type={toast?.type}
          onClose={() => setToast(null)}
        />

      </div>

    </AppErrorBoundary>

  );

}


/* =========================================================
   IMPORTANT FIX:
   analyseName() LOW-READINESS TYPO
   ========================================================= */

/*
   Original:

   else if(score>=40){band:'Low readiness';cls='bad'}

   Correct:

   else if(score>=40){
     band='Low readiness';
     cls='bad';
   }

   The following wrapper safely replaces the function if
   analyseName already exists but contains the typo.
*/

if (typeof analyseName === 'function') {

  const originalAnalyseName = analyseName;

  window.safeAnalyseName = function(name) {

    try {

      const result = originalAnalyseName(name);

      if (result && typeof result === 'object') {
        return result;
      }

      return result;

    } catch (error) {

      console.error(
        'analyseName failed:',
        error
      );

      return {
        score: 0,
        band: 'Unable to analyse',
        cls: 'bad'
      };

    }

  };

}


/* =========================================================
   SAFE REACT STARTUP
   ========================================================= */

(function startApplication() {

  try {

    const rootElement =
      document.getElementById('root');


    if (!rootElement) {

      throw new Error(
        'Application root element (#root) was not found.'
      );

    }


    if (
      typeof React === 'undefined' ||
      typeof ReactDOM === 'undefined'
    ) {

      throw new Error(
        'React or ReactDOM failed to load.'
      );

    }


    if (
      typeof ReactDOM.createRoot !== 'function'
    ) {

      throw new Error(
        'ReactDOM.createRoot is unavailable.'
      );

    }


    const root =
      ReactDOM.createRoot(rootElement);


    root.render(
      <App />
    );


    console.log(
      '%cM. Lewis Group application started successfully.',
      'color:#2563eb;font-weight:bold;'
    );


  } catch (error) {

    console.error(
      'APPLICATION STARTUP ERROR:',
      error
    );


    const rootElement =
      document.getElementById('root');


    if (rootElement) {

      rootElement.innerHTML = `

        <div style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:32px;
          background:#020617;
          color:white;
          font-family:Arial,sans-serif;
        ">

          <div style="
            max-width:650px;
            width:100%;
            text-align:center;
          ">

            <div style="
              width:56px;
              height:56px;
              border-radius:16px;
              background:rgba(239,68,68,.12);
              color:#f87171;
              display:flex;
              align-items:center;
              justify-content:center;
              margin:0 auto 20px;
              font-size:24px;
            ">
              !
            </div>

            <h1 style="
              font-size:28px;
              margin:0 0 12px;
            ">
              Application could not start
            </h1>

            <p style="
              color:#94a3b8;
              line-height:1.7;
              margin:0 0 24px;
            ">
              A JavaScript dependency or application
              component failed to load.
            </p>

            <div style="
              text-align:left;
              background:#0f172a;
              border:1px solid #1e293b;
              border-radius:12px;
              padding:16px;
              overflow:auto;
            ">

              <code style="
                color:#fca5a5;
                font-size:13px;
                white-space:pre-wrap;
              ">
${String(error && (error.stack || error.message || error))}
              </code>

            </div>

            <button
              onclick="window.location.reload()"
              style="
                margin-top:24px;
                border:0;
                border-radius:10px;
                padding:12px 20px;
                background:white;
                color:#020617;
                font-weight:700;
                cursor:pointer;
              "
            >
              Reload page
            </button>

          </div>

        </div>

      `;

    }

  }

})();

</script>
