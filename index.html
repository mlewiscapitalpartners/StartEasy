/* ============================================================
   NAME ANALYSIS (local, honest)
   ============================================================ */
const PROTECTED_WORDS=['bank','insurance','trust','microfinance','pension','securities','lottery','gaming','casino','university','national','government','ministry','municipal','council','chartered','royal','sacco','cooperative','revenue','customs'];
const CAUTION_WORDS=['zambia','africa','international','group','holdings','fund','agency','commission','authority','bureau','institute','college','academy','hospital','clinic','pharmacy','capital','finance','financial','global'];
const GENERIC_WORDS=['business','enterprise','enterprises','company','services','service','trading','traders','investments','investment','holdings','group','general','dealers','suppliers','ventures','solutions','consultants','consulting'];
const COMMON_PATTERNS=['zambia','lusaka','ndola','kitwe','livingstone','kabwe','solwezi','chipata','kasama','mongu','choma','mansa','kafue','zambezi','luangwa','copperbelt','trading','investments','holdings','enterprises','services','supplies','general dealers','logistics','agro','mining','construction','properties','consultants','solutions','ventures','group'];
function commonPatternRisk(name){const l=String(name||'').toLowerCase();if(!l.trim())return{level:'unknown',matched:[]};const m=[];COMMON_PATTERNS.forEach(p=>{if(l.includes(p))m.push(p)});return{level:m.length>=2?'high':m.length===1?'medium':'low',matched:m}}
function analyseName(raw){
  const name=String(raw||'').trim();
  if(!name)return{name,score:0,band:'Not assessed',issues:[['critical','No name entered.']],notes:[]};
  const lower=name.toLowerCase();const tokens=lower.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  const issues=[],notes=[];let score=100;
  if(name.length<3){score-=40;issues.push(['critical','The name is too short to be distinctive.'])}
  if(name.length>60){score-=14;issues.push(['warn','Unusually long — shorter names are easier to clear.'])}
  if(/^\d+$/.test(name)){score-=32;issues.push(['critical','A name made up only of numbers is unlikely to be accepted.'])}
  if(/[^A-Za-z0-9 &.,'()\-]/.test(name)){score-=10;issues.push(['warn','Contains unusual characters or symbols.'])}
  if(/\b(\w+)\s+\1\b/.test(lower)){score-=12;issues.push(['warn','A word is repeated.'])}
  PROTECTED_WORDS.forEach(w=>{if(lower.includes(w)){score-=20;issues.push(['critical','Contains the protected or regulated term "'+w+'". Normally requires written consent.'])}});
  CAUTION_WORDS.forEach(w=>{if(lower.includes(w)){score-=6;issues.push(['warn','Contains the commonly used term "'+w+'". Expect closer scrutiny.'])}});
  if(tokens.length===1&&GENERIC_WORDS.includes(tokens[0])){score-=30;issues.push(['critical','A single generic word is very unlikely to be accepted.'])}
  else if(tokens.length&&tokens.every(t=>GENERIC_WORDS.includes(t))){score-=18;issues.push(['warn','Every word is generic — add a distinctive element.'])}
  if(!/(limited|ltd|plc|incorporated|inc|enterprises|trading|services|solutions)\b/i.test(name)&&tokens.length<3){notes.push('If registering a company, the registry will normally expect "Limited" or "Ltd".')}
  score=Math.max(0,Math.min(100,Math.round(score)));
  let band=score>=80?'High readiness':score>=60?'Medium readiness':score>=40?'Low readiness':'High risk';
  return{name,score,band,issues,notes};
}

function numberToWords(num){const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];if(num===0)return'Zero';function c(n){if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');if(n<1000)return ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+c(n%100):'');if(n<1000000)return c(Math.floor(n/1000))+' Thousand'+(n%1000?' '+c(n%1000):'');return c(Math.floor(n/1000000))+' Million'+(n%1000000?' '+c(n%1000000):'')}return c(num)}

function OrientationPage({go}){
  const qKeys=['goal','entity','employees','premises','sector','turnover'];
  const [step,setStep]=useState(0);
  const [answers,setAnswers]=useState({});
  const [done,setDone]=useState(false);
  const current=QUESTIONS[qKeys[step]];
  const value=answers[qKeys[step]];
  const total=qKeys.length;
  useEffect(()=>{window.scrollTo(0,0)},[step,done]);
  const next=()=>{if(!value)return;if(step<total-1)setStep(step+1);else setDone(true)};
  const back=()=>{if(step>0)setStep(step-1)};
  const recommended=useMemo(()=>{
    if(!done)return null;
    const a=answers;
    if(a.goal==='register')return getJourney('register-company');
    if(a.goal==='tax')return getJourney('tax-registration');
    if(a.goal==='employ')return getJourney('employ-staff');
    if(a.goal==='licence')return getJourney('business-licence');
    if(a.goal==='comply')return getJourney('annual-compliance');
    if(a.sector==='food')return getJourney('food-business');
    if(a.entity==='business-name')return getJourney('register-business-name');
    if(a.entity==='company')return getJourney('register-company');
    return getJourney('start-business');
  },[done,answers]);
  if(done){
    return <div className="fadein bg-[#F5FAF6]">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-24">
        <div className="max-w-3xl">
          <span className="micro text-[#0A1F12]/50 block mb-8">Pathway complete</span>
          <h1 className="serif text-[clamp(2rem,5vw,3rem)] leading-[1.1] text-[#0A1F12] mb-6">Here is your recommended pathway.</h1>
          <p className="text-[15.5px] leading-relaxed text-[#0A1F12]/55 mb-10">Based on your answers, the journey most likely to fit your objective is:</p>
          {recommended&&<button onClick={()=>go('plan',recommended.id)} className="w-full bg-white p-6 lg:p-8 rounded-sm border-2 border-[#E8730F] hover:shadow-xl transition-all text-left mb-8" style={{cursor:'pointer',fontFamily:'inherit'}}>
            <div className="flex items-start gap-5">
              <span style={{fontSize:36,lineHeight:1,flexShrink:0}}>{recommended.icon}</span>
              <div className="flex-1 min-w-0">
                <span className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#E8730F] mb-2 block">{recommended.category}</span>
                <h3 className="serif text-[22px] lg:text-[26px] text-[#0A1F12] mb-3">{recommended.title}</h3>
                <p className="text-[13.5px] leading-relaxed text-[#0A1F12]/55 mb-5">{recommended.summary}</p>
                <div className="flex flex-wrap items-center gap-4"><span className="text-[11.5px] text-[#0A1F12]/50"><strong style={{color:'#0A1F12'}}>{recommended.processes.length}</strong> process steps</span><span className="flex items-center gap-2 text-[11px] tracking-[0.14em] uppercase text-[#E8730F] font-bold">Open guided action plan <Arrow/></span></div>
              </div>
            </div>
          </button>}
          <div className="grid sm:grid-cols-3 gap-4">
            <button onClick={()=>{setDone(false);setStep(0);setAnswers({})}} className="bg-white p-5 rounded-sm border border-[#0A1F12]/8 hover:border-[#E8730F]/50 transition-colors text-left" style={{cursor:'pointer',fontFamily:'inherit'}}><span className="text-[11px] tracking-[0.14em] uppercase font-bold text-[#0A1F12]/50 mb-2 block">Not quite right?</span><span className="text-[14px] text-[#0A1F12] font-semibold">Change my answers</span></button>
            <button onClick={()=>go('desks')} className="bg-white p-5 rounded-sm border border-[#0A1F12]/8 hover:border-[#E8730F]/50 transition-colors text-left" style={{cursor:'pointer',fontFamily:'inherit'}}><span className="text-[11px] tracking-[0.14em] uppercase font-bold text-[#0A1F12]/50 mb-2 block">Or browse by desk</span><span className="text-[14px] text-[#0A1F12] font-semibold">See the specialist desks</span></button>
            <button onClick={()=>go('services')} className="bg-white p-5 rounded-sm border border-[#0A1F12]/8 hover:border-[#E8730F]/50 transition-colors text-left" style={{cursor:'pointer',fontFamily:'inherit'}}><span className="text-[11px] tracking-[0.14em] uppercase font-bold text-[#0A1F12]/50 mb-2 block">Browse instead</span><span className="text-[14px] text-[#0A1F12] font-semibold">See the full catalogue</span></button>
          </div>
        </div>
      </section>
    </div>;
  }

function ActionPlanPage({journeyId,go,openPayment}){

            <div><p style={{fontSize:13.5,fontWeight:600,color:'#0A1F12',marginBottom:4}}>Your plan is free to prepare.</p><p style={{fontSize:12,color:'rgba(10,31,18,.6)',lineHeight:1.6}}>Tick each step as you complete it. When you are ready to request a specific service, use the button next to that process.</p></div>

          {processes.map((p,pi)=>{
            const desk=PROCESSES[Object.keys(PROCESSES).find(k=>PROCESSES[k]===p)];void desk;

                {(p.reversions||[]).length>0&&<details style={{marginTop:16,paddingTop:16,borderTop:'1px solid rgba(10,31,18,.06)'}}><summary style={{fontSize:12,fontWeight:600,color:'rgba(10,31,18,.6)',cursor:'pointer'}}>Common causes of reversion ({p.reversions.length})</summary><div style={{marginTop:12}}>{p.reversions.map((r,ri)=><div key={ri} style={{fontSize:12,color:'rgba(10,31,18,.6)',lineHeight:1.6,marginBottom:6}}>• {r}</div>)}</div></details>}

            <span className="micro text-[#0A1F12]/50 block mb-4">Your plan summary</span>
            <div className="space-y-3">
              {[['Journey',j.title],['Processes',String(processes.length)],['Steps total',String(progress.total)],['Completed',String(progress.done)]].map(([k,v],i)=><div key={i} style={{display:'flex',justifyContent:'space-between',gap:12,fontSize:12.5,padding:'8px 0',borderBottom:i<3?'1px solid rgba(10,31,18,.06)':'none'}}><span style={{color:'rgba(10,31,18,.45)'}}>{k}</span><span style={{color:'#0A1F12',fontWeight:500,textAlign:'right'}}>{v}</span></div>)}

function NameCheckPage({openPayment}){

  const scoreColor=s=>s>=80?'#1E7B3C':s>=60?'#E8730F':'#B8564F';

            <div className="flex flex-wrap gap-3"><Btn onClick={run} disabled={!names.filter(n=>n.trim()).length}>Run readiness check</Btn><Btn variant="ghost" onClick={()=>{setNames(['','','']);setResults(null)}}>Clear</Btn></div>

              <span style={{width:36,height:36,borderRadius:10,background:'#E8730F',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="fas fa-info-circle" style={{color:'#fff',fontSize:15}}></i></span>
              <div><div style={{fontSize:11,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:5}}>Want the formal report?</div><p style={{fontSize:12.5,lineHeight:1.6,color:'rgba(10,31,18,.75)',marginBottom:12}}>A StartEasy analyst can produce a formal PDF Name Readiness Report with detailed screening, saturation analysis and recommended submission order — delivered within 2 business days.</p><button onClick={()=>openPayment({amount:'K50',currency:'ZMW',purpose:'Name Readiness Report — Formal',purposeDetail:'A formal PDF report with detailed screening, saturation analysis and recommended submission order.',receiptPrefix:'SE-NR',serviceKey:'nameReport'})} style={{display:'inline-flex',alignItems:'center',gap:8,padding:'11px 18px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:12.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}><i className="fas fa-file-invoice"></i> Order formal report — K50</button></div>
            </div>
          </div>
        </div>
        <div>
          {!results?<div className="bg-white rounded-sm border border-[#0A1F12]/8 p-12 text-center">
            <div style={{width:56,height:56,borderRadius:'50%',background:'rgba(232,115,15,.1)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}><i className="fas fa-search" style={{fontSize:22,color:'#E8730F'}}></i></div>

            {results.map((r,i)=>{
              const sat=commonPatternRisk(r.name);
              return <div key={i} className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden" style={{borderLeftWidth:4,borderLeftColor:scoreColor(r.score)}}>

                  <div className="flex items-start justify-between gap-4 mb-4">

                  {sat.matched.length>0&&<div style={{marginBottom:12,padding:'10px 12px',background:'rgba(10,31,18,.03)',borderRadius:8,fontSize:11.5,color:'rgba(10,31,18,.6)',lineHeight:1.55}}><strong style={{color:'#0A1F12'}}>Common patterns detected:</strong>{' '}{sat.matched.map((m,mi)=><span key={mi} style={{display:'inline-block',padding:'2px 7px',margin:'2px 3px 2px 0',borderRadius:4,background:'rgba(232,115,15,.12)',color:'#8A6828',fontWeight:600,fontSize:10.5}}>{m}</span>)}</div>}
                  {(r.issues||[]).length>0&&<div style={{marginBottom:12}}>{r.issues.map((iss,ii)=><div key={ii} style={{fontSize:12,lineHeight:1.5,padding:10,borderRadius:6,marginBottom:6,background:iss[0]==='critical'?'rgba(184,86,79,.08)':'rgba(245,166,35,.1)',color:iss[0]==='critical'?'#7C2318':'#7A5C10'}}>{iss[0]==='critical'?'⛔':'⚠️'} {iss[1]}</div>)}</div>}
                  {(r.notes||[]).length>0&&<div style={{paddingTop:12,marginTop:12,borderTop:'1px solid rgba(10,31,18,.06)'}}>{r.notes.map((n,ni)=><div key={ni} style={{fontSize:12,color:'rgba(10,31,18,.55)',lineHeight:1.6,marginBottom:6}}>• {n}</div>)}</div>}
                </div>
              </div>;
            })}
          </div>}
        </div>
      </div>
    </section>
  </div>;
}

            <Field label="NAPSA employer number"><TextInput value={form.napsa} onChange={v=>setForm({...form,napsa:v})} placeholder="If registered as employer"/></Field>
            <Field label="City / town"><Select value={form.city} onChange={v=>setForm({...form,city:v})} options={['Lusaka','Ndola','Kitwe','Livingstone','Kabwe','Solwezi','Chipata','Kasama','Mongu','Choma','Mansa','Other']} placeholder="Select city"/></Field>
            <Field label="Number of employees"><TextInput type="number" value={form.employees} onChange={v=>setForm({...form,employees:v})} placeholder="0"/></Field>

        </form>
      </div>
    </section>
  </div>;
  const alerts=[];
  renewals.forEach(r=>{const d=Math.ceil((new Date(r.date)-Date.now())/864e5);if(d<0)alerts.push({level:'bad',text:r.name+' expired '+Math.abs(d)+' day(s) ago.'});else if(d<=60)alerts.push({level:'warn',text:r.name+' is due in '+d+' day(s) — '+fmtDate(r.date)+'.'})});
  if(!biz.tpin)alerts.push({level:'warn',text:'No TPIN recorded. Tax registration may still be outstanding.'});
  if(Number(biz.employees)>0&&!biz.napsa)alerts.push({level:'warn',text:'You have employees but no NAPSA employer number recorded.'});
  const passportItems=[
    {desk:'pacra',label:'PACRA',tone:'#2E9C4A',rows:[['Entity type',biz.entity],['Registration number',biz.regNo||'Not recorded']]},
    {desk:'zra',label:'ZRA',tone:'#1B6CA8',rows:[['TPIN',biz.tpin||'Not recorded']]},
    {desk:'napsa',label:'NAPSA',tone:'#7A4FA3',rows:[['Employer registration',biz.napsa||'Not recorded'],['Employees',String(biz.employees||0)]]},
    {desk:'licensing',label:'Licences',tone:'#E8730F',rows:[['Renewals tracked',String(renewals.length)],['Documents in vault',String(vault.length)]]}
  ];
  const totalScore=Math.min(100,(biz.regNo?35:0)+(biz.tpin?35:0)+(biz.napsa?15:0)+(renewals.length>0?15:0));
  return <div className="fadein bg-[#F5FAF6]">
    <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">

        <div className="flex items-center gap-5"><div style={{textAlign:'right'}}><div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:700,color:'rgba(10,31,18,.4)',marginBottom:4}}>Profile completeness</div><div className="serif" style={{fontSize:32,fontWeight:700,lineHeight:1,color:'#1E7B3C'}}>{totalScore}%</div></div><button onClick={()=>{localStorage.removeItem('se_business');localStorage.removeItem('se_renewals');localStorage.removeItem('se_vault');setBiz(null);setRenewals([]);setVault([])}} style={{padding:'8px 14px',background:'none',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'rgba(10,31,18,.6)'}}>Reset</button></div>
      </div>
      {alerts.length>0&&<div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden mb-8"><div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between"><span style={{fontSize:14,fontWeight:600,color:'#0A1F12'}}>StartEasy alerts</span><span style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:700,color:'#E8730F',background:'rgba(232,115,15,.1)',padding:'3px 10px',borderRadius:99}}>{alerts.length}</span></div><div className="p-6 space-y-3">{alerts.map((a,i)=><div key={i} style={{display:'flex',alignItems:'flex-start',gap:12,padding:'14px',borderRadius:6,border:'1px solid '+(a.level==='bad'?'rgba(184,86,79,.2)':'rgba(245,166,35,.3)'),background:a.level==='bad'?'rgba(184,86,79,.08)':'rgba(245,166,35,.1)',color:a.level==='bad'?'#7C2318':'#7A5C10'}}><span style={{flexShrink:0,marginTop:2}}>{a.level==='bad'?'⛔':'⚠️'}</span><span style={{fontSize:13,lineHeight:1.5}}>{a.text}</span></div>)}</div></div>}
      <div className="grid lg:grid-cols-2 gap-6 mb-8">
        {passportItems.map(p=><div key={p.desk} className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden" style={{borderTopWidth:3,borderTopColor:p.tone}}><div className="p-6"><div className="flex items-center justify-between mb-5"><h3 className="serif text-[20px] text-[#0A1F12]">{p.label}</h3><span style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:700,padding:'3px 10px',borderRadius:99,background:p.tone+'18',color:p.tone}}>{SERVICE_GROUPS.find(g=>g.id===p.desk)?.title||'Compliance'}</span></div><div>{p.rows.map((r,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',gap:16,padding:'12px 0',borderBottom:i<p.rows.length-1?'1px solid rgba(10,31,18,.06)':'none'}}><span style={{fontSize:12.5,color:'rgba(10,31,18,.45)'}}>{r[0]}</span><span style={{fontSize:12.5,color:'#0A1F12',fontWeight:600,textAlign:'right'}}>{r[1]}</span></div>)}</div></div></div>)}
      </div>
      <div className="grid lg:grid-cols-2 gap-6">
        <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
          <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between"><span style={{fontSize:14,fontWeight:600,color:'#0A1F12'}}>Renewals &amp; deadlines</span><button onClick={()=>setShowRF(!showRF)} style={{padding:'6px 12px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:6,fontSize:11.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>+ Add</button></div>
          <div className="p-6">
            {showRF&&<div style={{background:'#F5FAF6',borderRadius:6,border:'1px solid rgba(10,31,18,.08)',padding:16,marginBottom:20}}><div className="space-y-3"><TextInput value={nr.name} onChange={v=>setNr({...nr,name:v})} placeholder="What is being renewed?"/><TextInput value={nr.authority} onChange={v=>setNr({...nr,authority:v})} placeholder="Issuing authority"/><input type="date" value={nr.date} onChange={e=>setNr({...nr,date:e.target.value})} className={inputCls}/><button onClick={()=>{if(!nr.name||!nr.date)return;saveRen([...renewals,nr]);setNr({name:'',authority:'',date:''});setShowRF(false)}} style={{width:'100%',padding:'10px 16px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Add renewal</button></div></div>}
            {renewals.length===0?<p style={{fontSize:13,color:'rgba(10,31,18,.45)',fontStyle:'italic'}}>No renewals tracked yet. Add licence and filing dates so StartEasy can alert you in advance.</p>:renewals.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).map((r,i)=>{const d=Math.ceil((new Date(r.date)-Date.now())/864e5);const tone=d<0?'#B8564F':d<=60?'#E8730F':'#1E7B3C';return <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,padding:'12px 0',borderBottom:i<renewals.length-1?'1px solid rgba(10,31,18,.06)':'none'}}><div style={{flex:1,minWidth:0}}><p style={{fontSize:13,fontWeight:600,color:'#0A1F12',margin:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.name}</p><p style={{fontSize:11.5,color:'rgba(10,31,18,.45)',marginTop:2}}>{r.authority} · due {fmtDate(r.date)}</p></div><span style={{fontSize:10,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:700,padding:'4px 10px',borderRadius:99,flexShrink:0,background:tone+'18',color:tone}}>{d<0?'Overdue':d+'d'}</span></div>})}
          </div>
        </div>
        <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
          <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between"><span style={{fontSize:14,fontWeight:600,color:'#0A1F12'}}>Document vault</span><button onClick={()=>setShowDF(!showDF)} style={{padding:'6px 12px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:6,fontSize:11.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>+ Add</button></div>
          <div className="p-6">
            {showDF&&<div style={{background:'#F5FAF6',borderRadius:6,border:'1px solid rgba(10,31,18,.08)',padding:16,marginBottom:20}}><div className="space-y-3"><TextInput value={nd.name} onChange={v=>setNd({...nd,name:v})} placeholder="Document name"/><Select value={nd.type} onChange={v=>setNd({...nd,type:v})} options={['Registration certificate','Tax document','Licence / permit','Statutory filing','Identification','Clearance','Resolution','Correspondence','Other']} placeholder="Select type"/><button onClick={()=>{if(!nd.name)return;saveVault([...vault,{...nd,added:new Date().toISOString()}]);setNd({name:'',type:'Registration certificate'});setShowDF(false)}} style={{width:'100%',padding:'10px 16px',background:'linear-gradient(135deg,#1E7B3C,#2E9C4A)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Log document</button></div></div>}
            {vault.length===0?<p style={{fontSize:13,color:'rgba(10,31,18,.45)',fontStyle:'italic'}}>No documents recorded. Log your certificates, clearances and acknowledgements here so you always know what you hold.</p>:vault.map((d,i)=><div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,padding:'12px 0',borderBottom:i<vault.length-1?'1px solid rgba(10,31,18,.06)':'none'}}><div style={{flex:1,minWidth:0}}><p style={{fontSize:13,fontWeight:600,color:'#0A1F12',margin:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>📄 {d.name}</p><p style={{fontSize:11.5,color:'rgba(10,31,18,.45)',marginTop:2}}>{d.type} · added {fmtDate(d.added)}</p></div><button onClick={()=>saveVault(vault.filter((_,x)=>x!==i))} style={{background:'none',border:'none',color:'rgba(10,31,18,.4)',cursor:'pointer',fontSize:14,padding:4,fontFamily:'inherit'}} aria-label="Remove">✕</button></div>)}
          </div>
        </div>
      </div>
    </section>
  </div>;
}

/* ============================================================
   PAGE: TRACKER
   ============================================================ */
const STATUSES=['Awaiting verification','Verified — in preparation','Ready to submit','Submitted','Under review','Reverted','Approved','Completed'];
function TrackerPage(){
  const [apps,setApps]=useState(()=>{try{return JSON.parse(localStorage.getItem('se_apps')||'[]')}catch(e){return[]}});
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({title:'',desk:'pacra',ref:'',status:'Awaiting verification',notes:''});
  const save=l=>{setApps(l);try{localStorage.setItem('se_apps',JSON.stringify(l))}catch(e){}};
  const add=()=>{if(!form.title.trim())return;const n={id:uid('app'),createdAt:new Date().toISOString(),timeline:[{at:new Date().toISOString(),status:form.status}],...form};save([n,...apps]);setForm({title:'',desk:'pacra',ref:'',status:'Awaiting verification',notes:''});setShowForm(false)};
  const update=(id,st)=>{save(apps.map(a=>a.id===id?{...a,status:st,timeline:[...(a.timeline||[]),{at:new Date().toISOString(),status:st}]}:a))};
  const statusColor=s=>{if(s==='Completed'||s==='Approved')return{bg:'#1E7B3C18',fg:'#1E7B3C'};if(s==='Reverted')return{bg:'#B8564F18',fg:'#B8564F'};if(s==='Submitted'||s==='Under review')return{bg:'#1B6CA818',fg:'#1B6CA8'};if(s==='Ready to submit'||s==='Verified — in preparation')return{bg:'#F5A62318',fg:'#8A6828'};return{bg:'#0A1F1212',fg:'#5E7A67'}};
  return <div className="fadein bg-[#F5FAF6]">
    <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
      <div className="flex flex-wrap items-end justify-between gap-6 mb-10">
        <SectionHead eyebrow="Submission Tracker" title="Track every submission in one place." sub="When you submit a payment reference or start a service, it logs here. Record the reference, watch the status, and keep a history of what happened." className="max-w-2xl"/>
        <button onClick={()=>setShowForm(!showForm)} style={{padding:'12px 20px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>+ New submission</button>
      </div>
      {showForm&&<div className="bg-white rounded-sm border border-[#0A1F12]/8 p-6 mb-8 space-y-5 max-w-3xl"><div className="grid sm:grid-cols-2 gap-5"><Field label="Service / process name" required><TextInput value={form.title} onChange={v=>setForm({...form,title:v})} placeholder="e.g. Private company incorporation"/></Field><Field label="Desk"><Select value={form.desk} onChange={v=>setForm({...form,desk:v})} options={SERVICE_GROUPS.map(g=>g.id)} placeholder="Select desk"/></Field><Field label="Reference number"><TextInput value={form.ref} onChange={v=>setForm({...form,ref:v})} placeholder="Record this after submission"/></Field><Field label="Status"><Select value={form.status} onChange={v=>setForm({...form,status:v})} options={STATUSES} placeholder="Select status"/></Field></div><Field label="Notes"><TextArea value={form.notes} onChange={v=>setForm({...form,notes:v})} rows={3} placeholder="What was submitted, what the officer said, what is outstanding…"/></Field><div className="flex gap-3"><button onClick={add} style={{padding:'12px 24px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Add to tracker</button><button onClick={()=>setShowForm(false)} style={{padding:'12px 20px',background:'none',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'#0A1F12'}}>Cancel</button></div></div>}
      {apps.length===0?<div className="bg-white rounded-sm border border-[#0A1F12]/8 p-16 text-center"><div style={{width:64,height:64,borderRadius:'50%',background:'rgba(232,115,15,.1)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}><i className="fas fa-clipboard-list" style={{fontSize:24,color:'#E8730F'}}></i></div><h3 className="serif text-[24px] text-[#0A1F12] mb-3">Nothing tracked yet</h3><p style={{fontSize:14,color:'rgba(10,31,18,.55)',lineHeight:1.6,maxWidth:500,margin:'0 auto 24px'}}>When you submit a payment reference, it logs here automatically. You can also add your own submissions manually.</p><button onClick={()=>setShowForm(true)} style={{padding:'12px 24px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Add your first submission</button></div>:<div className="grid md:grid-cols-2 gap-5">{apps.map(a=>{const tone=statusColor(a.status);return <div key={a.id} className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden"><div className="p-6">
        <div className="flex items-center justify-between gap-3 mb-4"><span style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:700,padding:'4px 10px',borderRadius:99,background:'#2E9C4A18',color:'#1E7B3C'}}>{SERVICE_GROUPS.find(g=>g.id===a.desk)?.title||a.desk}</span><span style={{fontSize:10,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:700,padding:'4px 10px',borderRadius:99,background:tone.bg,color:tone.fg}}>{a.status}</span></div>
        <h4 className="serif text-[18px] text-[#0A1F12] mb-2">{a.title}</h4>
        <div style={{fontSize:11.5,color:'rgba(10,31,18,.45)',marginBottom:16}}>{a.ref&&<>Ref: <strong style={{fontFamily:'Consolas,monospace',color:'#0A1F12'}}>{a.ref}</strong> · </>}Created {fmtDate(a.createdAt)}</div>
        {a.notes&&<p style={{fontSize:12.5,color:'rgba(10,31,18,.6)',lineHeight:1.6,marginBottom:20}}>{a.notes}</p>}
        <div style={{marginBottom:16}}><label style={{fontSize:11,fontWeight:700,color:'rgba(10,31,18,.5)',display:'block',marginBottom:8}}>Update status</label><Select value={a.status} onChange={v=>update(a.id,v)} options={STATUSES} placeholder="Select status"/></div>
        {(a.timeline||[]).length>0&&<details><summary style={{fontSize:11.5,fontWeight:600,color:'#E8730F',cursor:'pointer'}}>History ({(a.timeline||[]).length})</summary><ul style={{marginTop:12,listStyle:'none',padding:0}}>{(a.timeline||[]).slice().reverse().map((t,i)=><li key={i} style={{display:'flex',alignItems:'flex-start',gap:12,fontSize:11.5,marginBottom:8}}><span style={{width:6,height:6,borderRadius:'50%',background:'#E8730F',marginTop:6,flexShrink:0}}/><span><strong style={{color:'#0A1F12'}}>{t.status}</strong> <span style={{color:'rgba(10,31,18,.45)'}}>· {fmtDate(t.at)}</span></span></li>)}</ul></details>}
        <button onClick={()=>save(apps.filter(x=>x.id!==a.id))} style={{marginTop:16,background:'none',border:'none',color:'rgba(10,31,18,.4)',fontSize:12,cursor:'pointer',fontFamily:'inherit',textDecoration:'underline'}}>Delete</button>
      </div></div>})}</div>}
    </section>
  </div>;
}

      <div style={{padding:20}}>
        <p style={{fontSize:12.5,color:'rgba(10,31,18,.65)',lineHeight:1.6,marginBottom:16}}>Tell us what you are trying to do and we will point you to the right desk — or message us directly.</p>
        <a href={waUrl('Hello StartEasy — I need help choosing the right service or desk.')} target="_blank" rel="noopener noreferrer" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:9,background:'#25D366',color:'#fff',padding:'12px 18px',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp" style={{fontSize:16}}></i> Chat on WhatsApp</a>
        <a href={'mailto:'+CONTACT_EMAIL} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:9,background:'#fff',color:'#0A1F12',padding:'12px 18px',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none',marginTop:8,border:'1px solid rgba(10,31,18,.15)'}}><i className="fas fa-envelope" style={{fontSize:14}}></i> Email us</a>
      </div>
    </div>}
    <button onClick={()=>setOpen(!open)} style={{width:56,height:56,borderRadius:'50%',background:'linear-gradient(135deg,#E8730F,#F5A623)',boxShadow:'0 4px 20px rgba(232,115,15,.45)',display:'flex',alignItems:'center',justifyContent:'center',border:'none',cursor:'pointer'}} aria-label="Help"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
  </div>;
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [route,setRoute]=useState('home');
  const [routeArg,setRouteArg]=useState(null);
  const [serviceModal,setServiceModal]=useState(null);
  const [toolsOpen,setToolsOpen]=useState(false);
  const [paymentOpen,setPaymentOpen]=useState(false);
  const [paymentConfig,setPaymentConfig]=useState(null);

  useEffect(()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);if(parts.length)setRoute(parts[0]);if(parts.length>1)setRouteArg(parts[1])},[]);
  const go=useCallback((r,arg)=>{setRoute(r);setRouteArg(arg||null);try{location.hash='#/'+r+(arg?'/'+arg:'')}catch(e){}window.scrollTo({top:0,behavior:'auto'})},[]);
  useEffect(()=>{const h=()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);setRoute(parts[0]||'home');setRouteArg(parts[1]||null)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);

  const openPayment=useCallback(cfg=>{setPaymentConfig(cfg);setPaymentOpen(true)},[]);
  const closePayment=useCallback(()=>{setPaymentOpen(false);setTimeout(()=>setPaymentConfig(null),300)},[]);
  const requestService=useCallback(s=>{setServiceModal(null);setTimeout(()=>openPayment({amount:s.priceZm,currency:'ZMW',purpose:s.code+' — '+s.title,purposeDetail:s.desc,receiptPrefix:'SE-'+s.code,serviceKey:s.serviceKey||'generic'}),260)},[openPayment]);

  const view=()=>{
    switch(route){
      case 'pathway': return <OrientationPage go={go}/>;
      case 'plan': return <ActionPlanPage journeyId={routeArg} go={go} openPayment={openPayment}/>;
      case 'name-check': return <NameCheckPage openPayment={openPayment}/>;
      case 'passport': return <PassportPage/>;
      case 'tracker': return <TrackerPage/>;
      case 'desks': return <DesksPage go={go}/>;
      case 'services': return <ServicesPage onOpenService={setServiceModal} go={go}/>;
      case 'providers': return <ProvidersPage/>;
      case 'compliance': return <CompliancePage openServiceModal={setServiceModal} openPayment={openPayment}/>;
      case 'pricing': return <PricingPage openServiceModal={setServiceModal}/>;
      case 'about': return <AboutPage go={go}/>;
      default: return <Home go={go} onOpenService={setServiceModal}/>;
    }
  };

  return <div className="min-h-screen bg-[#F5FAF6] flex flex-col">
    <Nav route={route} go={go} onOpenTools={()=>setToolsOpen(true)}/>
    <main className="flex-1">{view()}</main>
    <Footer go={go}/>
    <FloatingAssistant/>
    <ToolsMenu open={toolsOpen} onClose={()=>setToolsOpen(false)} go={go}/>
    {serviceModal&&<ServiceDetailModal service={serviceModal} onClose={()=>setServiceModal(null)} onRequest={requestService}/>}
    {paymentConfig&&<ModalShell open={paymentOpen} onClose={closePayment} eyebrow="Secure payment" title={paymentConfig.purpose} maxWidth="48rem"><PaymentFlow amount={paymentConfig.amount} currency={paymentConfig.currency} purpose={paymentConfig.purpose} purposeDetail={paymentConfig.purposeDetail} receiptPrefix={paymentConfig.receiptPrefix} serviceKey={paymentConfig.serviceKey} onClose={closePayment} onGoToDesk={()=>{closePayment();setTimeout(()=>go('tracker'),320)}}/></ModalShell>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
