function numberToWords(num){const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];if(num===0)return'Zero';function c(n){if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');if(n<1000)return ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+c(n%100):'');if(n<1000000)return c(Math.floor(n/1000))+' Thousand'+(n%1000?' '+c(n%1000):'');return c(Math.floor(n/1000000))+' Million'+(n%1000000?' '+c(n%1000000):'')}return c(num)}
function amountInWords(a,cur){const n=parseFloat(String(a).replace(/[^\d.]/g,''))||0;const w=numberToWords(Math.round(n));if(cur==='USD')return'US Dollars '+w+' Only';if(cur==='ZMW')return w+' Kwacha Only';return w+' Only'}

const WIZARD_STEPS=[
  {k:'idea',t:'Your business idea',sub:'What exactly will the business do?'},
  {k:'activity',t:'Primary activity',sub:'Which best describes the main activity?'},
  {k:'industry',t:'Industry classification',sub:'We map your activity against ISIC-aligned sectors.'},
  {k:'structure',t:'Legal structure',sub:'Which form fits your situation?'},
  {k:'descriptor',t:'Business character',sub:'Which descriptive word family communicates your business?'},
  {k:'names',t:'Three-name proposal',sub:'Constructed from your distinctive name + descriptor + legal ending.'},
  {k:'sheet',t:'Preparation sheet',sub:'Your PACRA Name-Clearance Preparation Sheet.'}
];
function NameAdvisoryPage({go,openPayment}){
  const [step,setStep]=useState(0);
  const [w,setW]=useState({
    idea:'', activity:'', industry:'', structure:'', descriptor:'',
    distinctive:'', legalEnding:'', regulatoryFlagAcknowledged:false
  });

  // Auto-fill derived fields
  useEffect(()=>{
    const ind=getIndustry(w.industry);
    const struct=getStructure(w.structure);
    if(ind.descriptors.length && !w.descriptor) setW(p=>({...p,descriptor:ind.descriptors[0]}));
    if(struct.endings.length && !w.legalEnding) setW(p=>({...p,legalEnding:struct.endings[0]}));
  },[w.industry,w.structure]);

  const industry=getIndustry(w.industry);
  const structure=getStructure(w.structure);

  // Recommended structures based on industry
  const recommendStructures=(industryKey)=>{
    if(['financial','health'].includes(industryKey))return ['ltd'];
    if(['education'].includes(industryKey))return ['ltd','ltdg'];
    if(['tourism','technology','professional','research','construction','logistics','realestate','agriculture','trading','marketing'].includes(industryKey))return ['ltd','bn'];
    return ['ltd','bn','ltdg'];
  };
  const recommended=w.industry?recommendStructures(w.industry):['ltd','bn','ltdg'];

  const canAdvance=()=>{
    if(step===0)return w.idea.trim().length>=10;
    if(step===1)return w.activity.trim().length>=3;
    if(step===2)return !!w.industry;
    if(step===3)return !!w.structure;
    if(step===4)return !!w.descriptor;
    if(step===5)return w.distinctive.trim().length>=3 && !!w.legalEnding;
    return true;
  };
  const next=()=>{if(step<WIZARD_STEPS.length-1)setStep(step+1)};
  const back=()=>{if(step>0)setStep(step-1)};

  // Build three names
  const buildName=(variant)=>{
    const distinct=w.distinctive.trim().toUpperCase()||'[DISTINCTIVE]';
    const desc=w.descriptor.toUpperCase();
    const ending=w.legalEnding||'';
    if(variant===1)return [distinct,desc,ending].filter(Boolean).join(' ');
    if(variant===2){
      const altDesc=industry.descriptors.find(d=>d.toUpperCase()!==desc)||industry.descriptors[1]||desc;
      return [distinct,altDesc.toUpperCase(),ending].filter(Boolean).join(' ');
    }
    if(variant===3){
      const thirdDesc=industry.descriptors.find(d=>d.toUpperCase()!==desc&&d.toUpperCase()!==(industry.descriptors[1]||'').toUpperCase())||industry.descriptors[2]||'SOLUTIONS';
      return [distinct,thirdDesc.toUpperCase(),ending].filter(Boolean).join(' ');
    }
    return '';
  };
  const names=[buildName(1),buildName(2),buildName(3)];

  const sendSheet=()=>{
    const msg=['*STARTEASY — NAME ADVISORY PREPARATION SHEET*','',
      '*Business idea:*',w.idea,'',
      '*Primary activity:* '+w.activity,
      '*Industry:* '+industry.label+' ('+industry.isic+')',
      '*Recommended structure:* '+structure.label,
      '*Distinctive name:* '+w.distinctive.toUpperCase(),
      '*Descriptor:* '+w.descriptor,
      '*Legal ending:* '+w.legalEnding,
      '',
      '*Three-name proposal:*',
      '1. '+names[0],
      '2. '+names[1],
      '3. '+names[2],
      '',
      '*Regulatory flag:* '+(industry.regulatoryFlag?('⚠ '+industry.regulatoryFlag.title):'None — proceed to PACRA check'),
      '',
      '_Please review and advise on next steps._'].join('\n');
    window.open(waUrl(msg),'_blank','noopener,noreferrer');
  };

  const openNamingPackage=()=>{
    openPayment({
      amount:'K400',
      currency:'ZMW',
      purpose:'Business Name & Structure Advisory',
      purposeDetail:'The full advisory: industry classification, legal structure recommendation, descriptive word family, three-name proposal and a PACRA Name-Clearance Preparation Sheet. Delivered within 3 business days.',
      receiptPrefix:'SE-NAM',
      serviceKey:'naming'
    });
  };
  const printSheet=()=>{
    document.body.classList.add('print-mode');
    setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('print-mode'),200)},100);
  };

  return <div className="fadein bg-[#F5FAF6]">

          <button onClick={()=>go('home')} style={{background:'none',border:'none',color:'inherit',fontSize:'inherit',letterSpacing:'inherit',fontWeight:'inherit',textTransform:'inherit',cursor:'pointer',fontFamily:'inherit'}}>Home</button>
          <span>›</span>
          <span style={{color:'#F5A623'}}>Name Advisory</span>
        </div>
        <span className="micro text-[#F5A623] block mb-6">Business Naming &amp; Registration Advisory Standard</span>
        <h1 className="serif text-[clamp(2rem,5.5vw,3.4rem)] leading-[1.08] text-white mb-6 max-w-3xl">A business idea is not yet a registration.</h1>
        <p style={{fontSize:16,lineHeight:1.7,color:'rgba(255,255,255,.65)',maxWidth:820,marginBottom:20}}>StartEasy helps beginners translate an idea into a properly prepared registration application — starting with the activity, the industry and the structure, not just a name.</p>

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [route,setRoute]=useState('home');
  const [routeArg,setRouteArg]=useState(null);
  const [serviceModal,setServiceModal]=useState(null);
  const [paymentOpen,setPaymentOpen]=useState(false);
  const [paymentConfig,setPaymentConfig]=useState(null);

  useEffect(()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);if(parts.length)setRoute(parts[0]);if(parts.length>1)setRouteArg(parts[1])},[]);
  const go=useCallback((r,arg)=>{setRoute(r);setRouteArg(arg||null);try{location.hash='#/'+r+(arg?'/'+arg:'')}catch(e){}window.scrollTo({top:0,behavior:'auto'})},[]);
  useEffect(()=>{const h=()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);setRoute(parts[0]||'home');setRouteArg(parts[1]||null)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);

  const openPayment=useCallback(cfg=>{setPaymentConfig(cfg);setPaymentOpen(true)},[]);
  const closePayment=useCallback(()=>{setPaymentOpen(false);setTimeout(()=>setPaymentConfig(null),300)},[]);
  const requestService=useCallback(s=>{setServiceModal(null);setTimeout(()=>openPayment({amount:s.priceZm,currency:'ZMW',purpose:s.code+' — '+s.title,purposeDetail:s.desc,receiptPrefix:'SE-'+s.code,serviceKey:s.link==='naming'?'naming':(s.desk||'generic')}),260)},[openPayment]);

  const view=()=>{
    switch(route){
      case 'naming': return <NameAdvisoryPage go={go} openPayment={openPayment}/>;
      case 'lines': return <ServiceLinesPage go={go}/>;
      case 'desks': return <DesksPage go={go}/>;
      case 'desk': return <DeskDetailPage deskId={routeArg||'pacra'} go={go} onOpenService={setServiceModal} openPayment={openPayment}/>;
      case 'audit': return <AuditPage go={go} openPayment={openPayment}/>;
      case 'services': return <ServicesPage onOpenService={setServiceModal} go={go}/>;
      case 'providers': return <ProvidersPage/>;
      case 'pricing': return <PricingPage openServiceModal={setServiceModal}/>;
      case 'about': return <AboutPage go={go}/>;
      default: return <Home go={go} onOpenService={setServiceModal}/>;
    }
  };

  return <div className="min-h-screen bg-[#F5FAF6] flex flex-col">
    <Nav route={route} go={go}/>
    <main className="flex-1">{view()}</main>
    <Footer go={go}/>
    <FloatingAssistant/>
    {serviceModal&&<ServiceDetailModal service={serviceModal} onClose={()=>setServiceModal(null)} onRequest={requestService} go={go}/>}
    {paymentConfig&&<ModalShell open={paymentOpen} onClose={closePayment} eyebrow="Secure payment" title={paymentConfig.purpose} maxWidth="48rem"><PaymentFlow amount={paymentConfig.amount} currency={paymentConfig.currency} purpose={paymentConfig.purpose} purposeDetail={paymentConfig.purposeDetail} receiptPrefix={paymentConfig.receiptPrefix} serviceKey={paymentConfig.serviceKey} onClose={closePayment} onGoToDesk={()=>{closePayment();setTimeout(()=>go('home'),320)}}/></ModalShell>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
