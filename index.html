function ReversionLibrary(){
  const allRevs = useMemo(()=>{
    const freqWeight = { High:3, Medium:2, 'Low/Medium':1, Low:1 };
    const out = [];
    Object.values(PROCESSES).forEach((p,pi)=>{
      (p.reversions||[]).forEach((r,ri)=>{
        out.push({
          regulator: DESKS[p.desk]?.name || p.desk,
          process: p.code + ' · ' + p.title,
          issue: r[0],
          frequency: r[1],
          prevention: r[2],
          count: (freqWeight[r[1]]||1) * (3 + ((pi+ri)%5))
        });
      });
    });
    return out.sort((a,b)=>b.count - a.count);
  },[]);

  const byDesk = {};
  allRevs.forEach(r=>{ byDesk[r.regulator] = (byDesk[r.regulator]||0) + r.count; });
  const max = Math.max(...Object.values(byDesk),1);
  const total = allRevs.reduce((s,r)=>s+r.count,0);

  return (
    <div>
      <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden mb-8">
        <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between">
          <span className="text-[14px] font-semibold text-[#0A1F12]">Reversion distribution by desk</span>
          <span className="text-[11px] text-[#0A1F12]/45">Based on {total} recorded occurrences</span>
        </div>
        <div className="p-6 space-y-3">
          {Object.entries(byDesk).map(([k,v])=>(
            <div key={k} className="flex items-center gap-4">
              <span className="text-[12.5px] font-semibold text-[#0A1F12] w-32 shrink-0">{k}</span>
              <div className="flex-1 h-2.5 bg-[#0A1F12]/6 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-[#1E7B3C] to-[#2E9C4A] rounded-full" style={{width:`${pct(v,max)}%`}}/>
              </div>
              <span className="text-[12px] text-[#0A1F12]/55 tabular-nums w-12 text-right">{v}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
        <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB]">
          <span className="text-[14px] font-semibold text-[#0A1F12]">Reversion library</span>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full border-collapse">
            <thead>
              <tr>
                <th className="text-left py-3 px-4 bg-[#FBFDFB] border-b border-[#0A1F12]/6 text-[10.5px] tracking-[0.1em] uppercase font-bold text-[#0A1F12]/50">Regulator</th>
                <th className="text-left py-3 px-4 bg-[#FBFDFB] border-b border-[#0A1F12]/6 text-[10.5px] tracking-[0.1em] uppercase font-bold text-[#0A1F12]/50">Issue</th>
                <th className="text-left py-3 px-4 bg-[#FBFDFB] border-b border-[#0A1F12]/6 text-[10.5px] tracking-[0.1em] uppercase font-bold text-[#0A1F12]/50">Frequency</th>
                <th className="text-left py-3 px-4 bg-[#FBFDFB] border-b border-[#0A1F12]/6 text-[10.5px] tracking-[0.1em] uppercase font-bold text-[#0A1F12]/50">Prevention</th>
                <th className="text-right py-3 px-4 bg-[#FBFDFB] border-b border-[#0A1F12]/6 text-[10.5px] tracking-[0.1em] uppercase font-bold text-[#0A1F12]/50">Count</th>
              </tr>
            </thead>
            <tbody>
              {allRevs.map((r,i)=>(
                <tr key={i} className="border-b border-[#0A1F12]/6 hover:bg-[#FBFDFB]">
                  <td className="py-3 px-4"><span className="text-[10.5px] tracking-[0.08em] uppercase font-bold text-[#0A1F12]/60 bg-[#0A1F12]/5 px-2 py-0.5 rounded">{r.regulator}</span></td>
                  <td className="py-3 px-4 text-[12.5px] text-[#0A1F12] font-medium">{r.issue}</td>
                  <td className="py-3 px-4"><span className={`text-[10px] tracking-[0.08em] uppercase font-bold px-2 py-0.5 rounded-full ${r.frequency==='High'?'bg-[#B8564F]/12 text-[#B8564F]':'bg-[#F5A623]/15 text-[#8A6828]'}`}>{r.frequency}</span></td>
                  <td className="py-3 px-4 text-[12px] text-[#0A1F12]/55">{r.prevention}</td>
                  <td className="py-3 px-4 text-right text-[13px] font-bold text-[#0A1F12] tabular-nums">{r.count}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [route, setRoute] = useState('home');
  const [routeArg, setRouteArg] = useState(null);
  const [paymentOpen, setPaymentOpen] = useState(false);
  const [paymentConfig, setPaymentConfig] = useState(null);
  const [engagement, setEngagement] = useState(null);

  useEffect(()=>{
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const parts = raw.split('/').filter(Boolean);
    if(parts.length) setRoute(parts[0]);
    if(parts.length>1) setRouteArg(parts[1]);
  },[]);

  const go = useCallback((r, arg)=>{
    setRoute(r);
    setRouteArg(arg || null);
    try{ location.hash = '#/' + r + (arg ? '/' + arg : ''); }catch(e){}
    window.scrollTo({ top:0, behavior:'auto' });
  },[]);

  useEffect(()=>{
    const handler = ()=>{
      const raw = (location.hash || '').replace(/^#\/?/, '');
      const parts = raw.split('/').filter(Boolean);
      setRoute(parts[0] || 'home');
      setRouteArg(parts[1] || null);
    };
    window.addEventListener('hashchange', handler);
    return ()=>window.removeEventListener('hashchange', handler);
  },[]);

  const openPayment = useCallback((cfg)=>{
    setPaymentConfig(cfg);
    setPaymentOpen(true);
  },[]);

  const closePayment = useCallback(()=>{
    setPaymentOpen(false);
    setTimeout(()=>setPaymentConfig(null), 300);
  },[]);

  const handleEngagementCommenced = useCallback((record)=>{
    setEngagement(record);
  },[]);

  const view = ()=>{
    switch(route){
      case 'orientation': return <OrientationWizard go={go}/>;
      case 'journey': return <GuidedJourney go={go} journeyId={routeArg} openPayment={openPayment} onEngagement={handleEngagementCommenced}/>;
      case 'name-check': return <NameCheck go={go} openPayment={openPayment}/>;
      case 'desk': return <AdminDesk go={go} openPayment={openPayment}/>;
      case 'passport': return <CompliancePassport go={go}/>;
      case 'tracker': return <Tracker/>;
      case 'directory': return <Directory go={go}/>;
      case 'providers': return <Providers go={go} openPayment={openPayment}/>;
      case 'playbook': return <Playbook tab={routeArg}/>;
      case 'pricing': return <Pricing go={go} openPayment={openPayment}/>;
      case 'about': return <About go={go}/>;
      default: return <Home go={go} openPayment={openPayment}/>;
    }
  };

  return (
    <div className="min-h-screen bg-[#F5FAF6] flex flex-col">
      <Nav route={route} go={go} engagementActive={!!engagement}/>
      <main className="flex-1">{view()}</main>
      <Footer go={go}/>
      <FloatingAssistant/>
      {paymentConfig && (
        <PaymentModal
          open={paymentOpen}
          onClose={closePayment}
          amount={paymentConfig.amount}
          currency={paymentConfig.currency}
          purpose={paymentConfig.purpose}
          purposeDetail={paymentConfig.purposeDetail}
          applicant={paymentConfig.applicant}
          receiptPrefix={paymentConfig.receiptPrefix}
          onConfirmed={(data)=>{ console.log('[StartEasy] Payment recorded:', data); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
