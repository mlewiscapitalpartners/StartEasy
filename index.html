const { useState, useMemo, useEffect, useCallback, useRef } = React;

/* ============ GLOBAL ASSIST INTENT ============ */
let ASSIST_INTENT = null;

/* ============ CONFIG ============ */

const uid=(p='id')=>p+'_'+Math.random().toString(36).slice(2,9);
const fmtDate=(d)=>{if(!d)return'—';const x=new Date(d);if(isNaN(x))return'—';return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const pct=(a,b)=>b===0?0:Math.round((a/b)*100);
function numberToWords(num){const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];if(num===0)return'Zero';function chunk(n){if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');if(n<1000)return ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+chunk(n%100):'');if(n<1000000)return chunk(Math.floor(n/1000))+' Thousand'+(n%1000?' '+chunk(n%1000):'');return chunk(Math.floor(n/1000000))+' Million'+(n%1000000?' '+chunk(n%1000000):'')}return chunk(num)}
function amountInWords(amountStr,currency){const num=parseFloat(String(amountStr).replace(/[^\d.]/g,''))||0;const words=numberToWords(Math.round(num));if(currency==='USD')return'US Dollars '+words+' Only';if(currency==='ZMW')return words+' Kwacha Only';return words+' Only'}

            <div style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.12)',borderRadius:10,padding:'10px 14px'}}><div style={{fontSize:9.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'rgba(255,255,255,.45)',marginBottom:3}}>Channel</div><div style={{fontSize:13.5,color:'#fff',fontWeight:700}}>{cfg.channel}</div></div>
          </div>
        </div>
      </div>
      <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:16,padding:'22px 24px',marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}><span style={{width:36,height:36,borderRadius:10,background:'rgba(232,115,15,.1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="fas fa-route" style={{color:'#E8730F',fontSize:15}}></i></span><div><div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.5)'}}>What happens next</div><div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:17,color:'#0A1F12',fontWeight:700}}>The fulfilment timeline</div></div></div>
        <ol className="fulfil-timeline">{cfg.nextSteps.map((s,i)=>(<li key={i} data-step={i+1} data-state={stepState[i]}><div className="ft-title">{s.t}</div><div className="ft-desc">{s.d}</div><span className="ft-when">{s.when}</span></li>))}</ol>
      </div>
      {cfg.actions&&cfg.actions.length>0&&(
        <div style={{background:'linear-gradient(135deg,#FFF4E0 0%,#FFF9EE 100%)',border:'1.5px solid #E8730F',borderRadius:16,padding:'22px 24px',marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}><span style={{width:36,height:36,borderRadius:10,background:'#E8730F',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="fas fa-hand-point-right" style={{color:'#fff',fontSize:15}}></i></span><div><div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828'}}>What you need to do</div><div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:17,color:'#0A1F12',fontWeight:700}}>Your actions</div></div></div>
          <ul style={{listStyle:'none',padding:0,margin:0}}>{cfg.actions.map((a,i)=>(<li key={i} style={{display:'flex',gap:12,alignItems:'flex-start',padding:'10px 0',borderBottom:i<cfg.actions.length-1?'1px dashed rgba(10,31,18,.12)':'none'}}><span style={{width:22,height:22,borderRadius:6,flexShrink:0,marginTop:1,background:'rgba(232,115,15,.15)',color:'#8A6828',fontSize:11,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Playfair Display',Georgia,serif"}}>{i+1}</span><span style={{fontSize:13.5,color:'rgba(10,31,18,.75)',lineHeight:1.55,fontWeight:500}}>{a}</span></li>))}</ul>
        </div>
      )}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:12,marginBottom:16}}>
        <a href={'https://wa.me/'+ADMIN_WHATSAPP+'?text='+encodeURIComponent('Hello StartEasy — regarding tracking reference '+trackingRef+' ('+cfg.name+').')} target="_blank" rel="noopener noreferrer" style={{background:'#25D366',color:'#fff',textDecoration:'none',borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'center',gap:12,fontWeight:700,fontSize:13.5}}><i className="fab fa-whatsapp" style={{fontSize:20}}></i><div><div style={{fontSize:11,letterSpacing:'.1em',textTransform:'uppercase',opacity:.85,fontWeight:800}}>Fastest channel</div><div>Message StartEasy on WhatsApp</div></div></a>
        <a href={'mailto:engagements@starteasy.zm?subject='+encodeURIComponent('Tracking '+trackingRef+' — '+cfg.name)} style={{background:'#0A1F12',color:'#fff',textDecoration:'none',borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'center',gap:12,fontWeight:700,fontSize:13.5}}><i className="fas fa-envelope" style={{fontSize:18}}></i><div><div style={{fontSize:11,letterSpacing:'.1em',textTransform:'uppercase',opacity:.7,fontWeight:800}}>Formal channel</div><div>Email engagements@starteasy.zm</div></div></a>
      </div>
      <div style={{background:'linear-gradient(135deg,#0A1F12 0%,#123A1F 100%)',borderRadius:16,padding:'20px 22px',color:'#fff'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:14,flexWrap:'wrap'}}><span style={{width:40,height:40,borderRadius:10,background:'rgba(245,166,35,.2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="fas fa-passport" style={{color:'#F5A623',fontSize:17}}></i></span><div style={{flex:1,minWidth:200}}><div style={{fontSize:10.5,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#F5A623',marginBottom:4}}>Always visible to you</div><div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:16,fontWeight:700,color:'#fff',marginBottom:6}}>Track this engagement in your Compliance Passport.</div><p style={{fontSize:12.5,color:'rgba(255,255,255,.6)',lineHeight:1.55,marginBottom:12}}>Your tracking reference <strong style={{color:'#F5A623',fontFamily:"'Playfair Display',Georgia,serif"}}>{trackingRef}</strong> is saved against your account.</p><div style={{display:'flex',flexWrap:'wrap',gap:8}}><button type="button" onClick={onGoToTracker} style={{background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,padding:'11px 18px',fontSize:12.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',gap:8}}><i className="fas fa-clipboard-list"></i> Open my tracker</button><button type="button" onClick={()=>window.print()} style={{background:'rgba(255,255,255,.08)',color:'#fff',border:'1px solid rgba(255,255,255,.2)',borderRadius:8,padding:'11px 18px',fontSize:12.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',gap:8}}><i className="fas fa-print"></i> Print this page</button></div></div></div>
      </div>
    </div>
  );
}

/* ============ PAYMENT FLOW ============ */
function PaymentFlow({amount,currency,purpose,purposeDetail,applicant,receiptPrefix,serviceKey,onConfirmed,onClose,onTrack}){
  const [method,setMethod]=useState(null);
  const [senderName,setSenderName]=useState('');
  const [senderContact,setSenderContact]=useState('');
  const [userRef,setUserRef]=useState('');
  const [agree,setAgree]=useState(false);
  const [errorMsg,setErrorMsg]=useState('');
  const [confirmed,setConfirmed]=useState(false);
  const [receiptNo,setReceiptNo]=useState('');
  const [receiptDate,setReceiptDate]=useState('');
  const [whatsappUrl,setWhatsappUrl]=useState('');
  const [whatsappSent,setWhatsappSent]=useState(false);
  const [whatsappOpened,setWhatsappOpened]=useState(false);
  const [copied,setCopied]=useState('');
  const [generatingPDF,setGeneratingPDF]=useState(false);
  const [checkRef,setCheckRef]=useState('');
  const [checkResult,setCheckResult]=useState('');
  const [copiedMessage,setCopiedMessage]=useState(false);

  const copyText=(text,key)=>{const done=()=>{setCopied(key);setTimeout(()=>setCopied(''),1500)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));else fallbackCopy(text,done)};
  const fallbackCopy=(text,done)=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)};

  const buildWhatsappMessage=(rcpt,dateOverride)=>{
    const dateStr=dateOverride||receiptDate;
    return ['*STARTEASY — PAYMENT PROOF*','','*Receipt No:* '+rcpt,'*Date & Time:* '+dateStr,'','*APPLICANT','Name: '+(applicant.firstName||'')+' '+(applicant.lastName||''),'Company: '+(applicant.company||'—'),'Email: '+(applicant.email||'—'),'Country: '+(applicant.country||'—'),'','*PURPOSE*',purpose,'','*PAYMENT DETAILS*','Method: '+(PAYMENT_METHODS[method]?PAYMENT_METHODS[method].label:'—'),'Amount: '+amount,'Sender Name: '+senderName,'Sender Contact: '+senderContact,'Transaction ID / Ref: '+(userRef||'(not provided)'),'','_Please verify this payment against our records._'].join('\n');
  };

  const handleConfirm=async()=>{
    setErrorMsg('');
    if(!method){setErrorMsg('Please select a payment method first.');return}
    if(!senderName.trim()){setErrorMsg('Please enter the name on the payment.');return}
    if(!senderContact.trim()){setErrorMsg('Please enter the phone or email used to pay.');return}
    if(!userRef.trim()){setErrorMsg('Please enter your transaction reference.');return}
    if(!agree){setErrorMsg('Please tick the confirmation checkbox.');return}
    let waWindow=null;
    if(!isMobileDevice()){try{waWindow=window.open('about:blank','_blank');if(waWindow){try{waWindow.document.write('<title>Opening WhatsApp…</title><body style="font-family:system-ui;padding:24px;color:#0A1F12">Opening WhatsApp…</body>')}catch(e){}}}catch(e){}}
    const rcpt=receiptPrefix+'-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*90000)+10000);
    const now=new Date();const dt=now.toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    setReceiptNo(rcpt);setReceiptDate(dt);
    const msg=buildWhatsappMessage(rcpt,dt);
    if(isMobileDevice()){const result=launchWhatsapp(msg);setWhatsappUrl(result.url);setWhatsappOpened(result.opened)}else{const url=buildWhatsappUrl(msg);setWhatsappUrl(url);if(waWindow&&!waWindow.closed){try{waWindow.location.href=url;setWhatsappOpened(true)}catch(e){}}}
    setConfirmed(true);
    const m=PAYMENT_METHODS[method];
    const data={receiptNo:rcpt,receiptDate:dt,amount,currency,purpose,method:m.label,transactionRef:userRef,senderName,senderContact,applicantName:((applicant.firstName||'')+' '+(applicant.lastName||'')).trim(),applicantEmail:applicant.email,applicantCountry:applicant.country,applicantCompany:applicant.company,recipientAccount:m.recipientAccount,serviceKey:serviceKey||'generic',status:'pending'};
    try{const stored=JSON.parse(localStorage.getItem('se_receipts')||'[]');stored.push(data);localStorage.setItem('se_receipts',JSON.stringify(stored))}catch(e){}
    if(onConfirmed)onConfirmed(data);
  };

  const copyWhatsappMessage=()=>{const text=buildWhatsappMessage(receiptNo,receiptDate);const done=()=>{setCopiedMessage(true);setTimeout(()=>setCopiedMessage(false),2500)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)})}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)}};

  const downloadReceiptPDF=async()=>{const el=document.getElementById('seReceipt');if(!el)return;if(typeof html2canvas==='undefined'||typeof window.jspdf==='undefined'){setErrorMsg('PDF generator not ready. Use Print instead.');return}setGeneratingPDF(true);try{const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});const imgData=canvas.toDataURL('image/png');const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});const pdfW=pdf.internal.pageSize.getWidth();const pdfH=pdf.internal.pageSize.getHeight();const margin=10;const usableW=pdfW-margin*2;const ratio=canvas.height/canvas.width;let dispW=usableW;let dispH=dispW*ratio;if(dispH>pdfH-margin*2){dispH=pdfH-margin*2;dispW=dispH/ratio}const xOffset=(pdfW-dispW)/2;pdf.addImage(imgData,'PNG',xOffset,margin,dispW,dispH);pdf.save('StartEasy-Receipt-'+receiptNo+'.pdf')}catch(err){console.error(err);setErrorMsg('Could not generate PDF. Try Print instead.')}finally{setGeneratingPDF(false)}};

  const printReceipt=()=>{document.body.classList.add('print-receipt-mode');setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('print-receipt-mode'),200)},100)};

  const lookupReceipt=()=>{if(!checkRef.trim()){setCheckResult('Please enter a receipt number.');return}try{const stored=JSON.parse(localStorage.getItem('se_receipts')||'[]');const found=stored.find(r=>r.receiptNo===checkRef.trim().toUpperCase());if(found){setCheckResult('PENDING — awaiting verification by our team.')}else{setCheckResult('Receipt not found on this device. Contact engagements@starteasy.zm with your receipt number.')}}catch(e){setCheckResult('Could not check right now. Please try again later.')}};

  if(confirmed){
    const m=PAYMENT_METHODS[method];
    const receiptData={receiptNo,receiptDate,amount,currency,purpose,method:m.label,transactionRef:userRef,senderName,senderContact,applicantName:((applicant.firstName||'')+' '+(applicant.lastName||'')).trim(),applicantEmail:applicant.email,applicantCountry:applicant.country,recipientAccount:m.recipientAccount,serviceKey:serviceKey||'generic'};
    return(
      <div className="fadein">
        <div className="payment-success">
          <i className="fas fa-check-circle ps-icon" aria-hidden="true"></i>
          <h4>Payment Recorded</h4>
          <p>Receipt Reference: <strong>{receiptNo}</strong></p>
          <p style={{fontSize:12.5,color:'rgba(10,31,18,.6)',marginTop:6}}>Your receipt has been generated below. Download it for your records.</p>
          <div className="ps-whatsapp-block">
            <div className="psw-title"><i className="fab fa-whatsapp" aria-hidden="true"></i> Step 1 — Send Proof to StartEasy</div>
            <p>To confirm your payment, please send the confirmation below to our team on WhatsApp <strong>+260 768 526 191</strong>.</p>
            <a href={whatsappUrl} className="btn-whatsapp" target="_blank" rel="noopener noreferrer" onClick={()=>setWhatsappSent(true)}><i className="fab fa-whatsapp" aria-hidden="true"></i><span>{whatsappOpened?'Open WhatsApp again':'Send Proof to WhatsApp'}</span></a>
            <button type="button" onClick={copyWhatsappMessage} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',marginTop:10,padding:'11px 18px',background:'#fff',border:'1.5px solid #25D366',color:'#075E54',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit',transition:'all .2s ease'}}><i className={`fas ${copiedMessage?'fa-check':'fa-copy'}`} aria-hidden="true"></i>{copiedMessage?'Message copied to clipboard':'Copy message (if WhatsApp is blocked)'}</button>
            <div className="psw-note">If WhatsApp does not open automatically, use the green button above. If it is still blocked, copy the message and send it manually to <strong>+260 768 526 191</strong>.</div>
            {whatsappSent&&<div className="psw-sent show"><i className="fas fa-check-circle"></i> Confirmation ready — please tap <strong>Send</strong> in WhatsApp.</div>}
          </div>
          <ServiceFulfilment serviceKey={serviceKey||'generic'} receiptData={receiptData} onGoToTracker={onTrack}/>
          <div className="receipt-section">
            <div className="receipt-section-head"><div><h5><i className="fas fa-file-invoice" style={{color:'#8A6828',marginRight:6}}></i> Your Receipt</h5><div className="rsh-sub">Download or print for your records</div></div><div className="receipt-buttons"><button type="button" className="receipt-btn receipt-btn-gold" onClick={downloadReceiptPDF} disabled={generatingPDF}><i className={`fas ${generatingPDF?'fa-spinner fa-spin':'fa-download'}`}></i> {generatingPDF?'Generating…':'Download PDF'}</button><button type="button" className="receipt-btn" onClick={printReceipt}><i className="fas fa-print"></i> Print</button></div></div>
            <Receipt data={receiptData} id="seReceipt"/>
            <div className="receipt-check">
              <h6><i className="fas fa-search"></i> Check receipt status later</h6>
              <div className="receipt-check-row"><input type="text" value={checkRef} onChange={e=>setCheckRef(e.target.value)} placeholder="Enter your Receipt No (e.g. SE-2026-00001)"/><button type="button" onClick={lookupReceipt} style={{padding:'10px 18px',background:'#1E7B3C',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Check</button></div>
              {checkResult&&<div className="receipt-check-result show">{checkResult}</div>}
            </div>
          </div>
          {errorMsg&&<p style={{color:'#DC3545',fontSize:12.5,marginTop:12}}>{errorMsg}</p>}
          {onClose&&<button type="button" onClick={onClose} style={{marginTop:18,padding:'10px 20px',border:'1px solid rgba(10,31,18,.2)',background:'#fff',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'#0A1F12'}}>Close</button>}
        </div>
      </div>
    );
  }

  const m=method?PAYMENT_METHODS[method]:null;
  return(
    <div>
      <div className="pay-amount-banner"><div><div className="pab-label">Amount Due</div><div className="pab-amount">{amount}</div><div className="pab-context">{purposeDetail||purpose}</div></div><i className="fas fa-shield-alt pab-icon"></i></div>
      <div className="fee-tier-note"><i className="fas fa-info-circle"></i><div><strong>Purpose:</strong> {purpose}. <strong>Method:</strong> Choose the payment method that works for you. Every payment is verified before your request proceeds.</div></div>
      <div className="pay-methods-grid" role="radiogroup" aria-label="Payment method">
        {Object.entries(PAYMENT_METHODS).map(([key,pm])=>{const isSelected=method===key;return(<button key={key} type="button" role="radio" aria-checked={isSelected} className={`pay-method-card pm-${key} ${isSelected?'selected':''}`} onClick={()=>setMethod(key)}><div className="pm-logo">{key==='airtel'?'airtel':key==='mtn'?'MTN':key==='bank'?<i className="fas fa-university"></i>:key==='paypal'?<i className="fab fa-paypal"></i>:<i className="fab fa-bitcoin"></i>}</div><div className="pm-name">{pm.label}</div><div className="pm-desc">{pm.sub}</div></button>)})}
      </div>
      {m&&(<div className={`pay-details-panel ${m.brandClass}`}><div className="pdp-header"><div className="pdp-icon">{m.iconSet==='fab'?<i className={`fab ${m.icon}`}></i>:<i className={`fas ${m.icon}`}></i>}</div><div><div className="pdp-title">{m.title}</div><div className="pdp-sub">{m.sub}</div></div></div><div className="pdp-body"><div className="pdp-amount-banner"><div className="pab-l">Amount to Send</div><div className="pab-v">{amount}</div></div>{m.ussdCode&&(<div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:12}}><a className={`ussd-link ${method==='airtel'?'ussd-airtel':method==='mtn'?'ussd-mtn':''}`} href={`tel:${encodeURIComponent(m.ussdCode)}`} style={{display:'inline-flex',alignItems:'center',gap:7,background:method==='airtel'?'#E40000':method==='mtn'?'#FFCC00':'#0A1F12',color:method==='mtn'?'#000':'#fff',padding:'10px 14px',borderRadius:8,fontSize:12,fontWeight:700,textDecoration:'none'}}><i className="fas fa-mobile-alt"></i> {m.ussdLabel} ({m.ussdCode})</a></div>)}<div className="pdp-rows" style={{marginTop:14}}>{m.rows.map((r,i)=>(<div key={i} className="pay-detail-row"><div className="pdr-info"><div className="pdr-label">{r.label}</div><div className={`pdr-value ${r.plain?'plain':''}`}>{r.value}</div></div>{r.copy&&<button type="button" className={`pdr-copy ${copied===r.label?'copied':''}`} onClick={()=>copyText(r.copyValue||r.value,r.label)}><i className={`fas ${copied===r.label?'fa-check':'fa-copy'}`}></i></button>}</div>))}</div><div className="pdp-steps"><div className="pds-title"><i className="fas fa-list-ol"></i> How to Pay — Step by Step</div><ol>{m.steps.map((s,i)=><li key={i} dangerouslySetInnerHTML={{__html:s}}/>)}</ol></div>{m.note&&<div className="pdp-warning"><i className="fas fa-info-circle"></i><div>{m.note}</div></div>}</div></div>)}
      {m&&(<div className="pay-confirm-form"><h4><i className="fas fa-clipboard-check"></i> Confirm You Have Paid</h4><p style={{fontSize:12.5,color:'rgba(10,31,18,.6)',marginBottom:16,lineHeight:1.6}}>Once you have completed the transfer, confirm below. Your details will be sent to StartEasy on WhatsApp for verification, and a receipt will be generated for you to download.</p><div className="grid sm:grid-cols-2 gap-5"><div><label style={{display:'block',fontSize:'12.5px',fontWeight:600,color:'#0A1F12',marginBottom:8}}>Your Name (as on the payment) <span style={{color:'#E8730F'}}>*</span></label><input value={senderName} onChange={e=>setSenderName(e.target.value)} placeholder="e.g. Mulenga Katyala" style={{width:'100%',padding:'12px 14px',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff'}}/></div><div><label style={{display:'block',fontSize:'12.5px',fontWeight:600,color:'#0A1F12',marginBottom:8}}>Phone / Email used to pay <span style={{color:'#E8730F'}}>*</span></label><input value={senderContact} onChange={e=>setSenderContact(e.target.value)} placeholder="e.g. 076 304 9144" style={{width:'100%',padding:'12px 14px',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff'}}/></div></div><div style={{marginTop:14}}><label style={{display:'block',fontSize:'12.5px',fontWeight:600,color:'#0A1F12',marginBottom:8}}>Transaction Reference / Transaction ID <span style={{color:'#E8730F'}}>*</span></label><input value={userRef} onChange={e=>setUserRef(e.target.value)} placeholder="e.g. 10683000119" style={{width:'100%',padding:'12px 14px',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff'}}/></div><label style={{display:'flex',gap:12,alignItems:'flex-start',fontSize:13,color:'rgba(10,31,18,.8)',cursor:'pointer',lineHeight:1.55,fontWeight:500,marginTop:14}}><input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)} style={{width:18,height:18,accentColor:'#E8730F',flexShrink:0,marginTop:2,cursor:'pointer'}}/><span>I confirm I have sent <strong>{amount}</strong> to the account shown above, and I agree my details will be shared with the StartEasy team via WhatsApp for verification.</span></label>{errorMsg&&<div style={{background:'rgba(220,53,69,.08)',border:'1px solid rgba(220,53,69,.3)',borderRadius:8,padding:'10px 14px',marginTop:12,color:'#B8564F',fontSize:12.5,display:'flex',alignItems:'center',gap:8}}><i className="fas fa-exclamation-circle"></i> {errorMsg}</div>}<button type="button" onClick={handleConfirm} style={{width:'100%',marginTop:16,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:10,background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,padding:'14px 20px',fontSize:13.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}><i className="fas fa-check-circle"></i> I Have Paid — Generate My Receipt</button></div>)}

const HERO_SLIDES=[

      <button type="button" onClick={()=>slide(1)} aria-label="Next" className="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-[#0A1F12]/60 border border-white/15 text-white flex items-center justify-center transition-all duration-300 hover:bg-[#F5A623] hover:text-[#0A1F12] opacity-70 lg:opacity-0 lg:group-hover:opacity-100" style={{cursor:'pointer'}}><svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M9 1L13 5L9 9M13 5H1" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg></button>

  );

function CompliancePage({go,openPayment}){
  const [tickets,setTickets]=useState(()=>{try{return JSON.parse(localStorage.getItem('se_tickets')||'[]')}catch(e){return[]}});
  const [form,setForm]=useState({name:'',email:'',phone:'',category:'A',service:'',subject:'',detail:''});
  useEffect(()=>{
    if(ASSIST_INTENT){
      setForm(f=>Object.assign({},f,{subject:ASSIST_INTENT.subject||f.subject}));
      ASSIST_INTENT=null;
      setTimeout(()=>{const el=document.getElementById('assist-form-anchor');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},120);
    }
  },[]);
  const saveTickets=(list)=>{setTickets(list);try{localStorage.setItem('se_tickets',JSON.stringify(list))}catch(e){}};
  const handleSubmit=(e)=>{
    e.preventDefault();
    const tk={id:uid('tk'),category:form.category,service:form.service,subject:form.subject,detail:form.detail,status:'Logged',ref:'SE-'+Math.random().toString(36).slice(2,7).toUpperCase(),createdAt:new Date().toISOString()};
    saveTickets([tk,...tickets]);
    setForm(Object.assign({},form,{subject:'',detail:''}));
  };
  const openComplianceSubscription=()=>{
    openPayment({amount:PRICING.subscription.zm,currency:'ZMW',purpose:'Business Compliance Desk — Monthly Subscription',purposeDetail:'Ongoing compliance calendar, document vault, renewal alerts and administrative support.',applicant:{firstName:form.name.split(' ')[0]||'',lastName:form.name.split(' ').slice(1).join(' ')||'',email:form.email,phone:form.phone,country:'Zambia',company:''},receiptPrefix:'SE-CMP',serviceKey:'compliance'});
  };
  const allServices=[];
  Object.values(SERVICE_CATEGORIES).forEach(cat=>{cat.services.forEach(s=>{allServices.push({code:s.code,title:s.title,category:cat.code})})});
  const filteredServices=allServices.filter(s=>s.category===form.category);
  return(
    <div className="fadein bg-[#F5FAF6]">
      <section className="bg-[#0A1F12] text-white relative overflow-hidden">
        <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-[#E8730F]/5 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/3 pointer-events-none"/>
        <div className="max-w-[1320px] mx-auto px-6 lg:px-10 py-16 lg:py-24 relative z-10">
          <span className="micro text-[#F5A623] block mb-6">Business Compliance Desk</span>
          <h1 className="serif text-[clamp(2rem,5.5vw,3.6rem)] leading-[1.08] text-white mb-6 max-w-3xl">Stay compliant. Grow with confidence.</h1>
          <p className="text-[16px] lg:text-[17px] leading-relaxed text-white/60 max-w-3xl mb-8">The recurring side of StartEasy. A customized compliance calendar keeps filings, renewals and statutory deadlines visible and on time — with reminders at 60, 30 and 7 days so nothing lapses.</p>
          <div className="flex flex-wrap gap-3"><Btn size="lg" variant="primary" onClick={openComplianceSubscription}>Subscribe to the Compliance Desk <Arrow/></Btn><Btn size="lg" variant="ghostLight" onClick={()=>go('catalogue')}>View the Catalogue</Btn></div>
        </div>
      </section>

      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
        <SectionHead eyebrow="What the Compliance Desk provides" title="Filings, renewals and records — on one calendar." className="mb-10 max-w-3xl"/>
        <div className="grid md:grid-cols-3 gap-5 mb-14">
          {SERVICE_CATEGORIES.B.services.map((s,i)=>(
            <div key={i} className="bg-white rounded-sm border border-[#0A1F12]/8 p-6 lg:p-7" style={{borderTopWidth:3,borderTopColor:'#0E7C7B'}}>
              <span className="text-[11px] font-mono text-[#0A1F12]/40 block mb-2">{s.code}</span>
              <h3 className="serif text-[19px] text-[#0A1F12] leading-tight mb-3">{s.title}</h3>
              <p className="text-[12.5px] text-[#0A1F12]/60 leading-relaxed mb-4">{s.desc}</p>
              <ul className="space-y-1.5">{s.bullets.map((b,bi)=>(<li key={bi} className="flex items-start gap-2 text-[11.5px] text-[#0A1F12]/55 leading-relaxed"><span style={{color:'#0E7C7B',flexShrink:0,marginTop:3}}>•</span>{b}</li>))}</ul>
            </div>
          ))}
        </div>

        <div className="grid lg:grid-cols-2 gap-8 lg:gap-12">
          <div id="assist-form-anchor" style={{scrollMarginTop:'96px'}}>
            <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
              <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between"><span className="text-[14px] font-semibold text-[#0A1F12]">Request assistance</span><span className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#1E7B3C] bg-[#1E7B3C]/10 px-2.5 py-1 rounded-full">Human support</span></div>
              <form onSubmit={handleSubmit} className="p-6 space-y-5">
                <Field label="Your name" required><TextInput value={form.name} onChange={v=>setForm(Object.assign({},form,{name:v}))} placeholder="Full name"/></Field>
                <div className="grid sm:grid-cols-2 gap-4"><Field label="Email" required><TextInput type="email" value={form.email} onChange={v=>setForm(Object.assign({},form,{email:v}))} placeholder="you@company.com"/></Field><Field label="Phone"><TextInput value={form.phone} onChange={v=>setForm(Object.assign({},form,{phone:v}))} placeholder="+260 ..."/></Field></div>
                <div className="grid sm:grid-cols-2 gap-4">
                  <Field label="Service category" required><Select value={form.category} onChange={v=>setForm(Object.assign({},form,{category:v,service:''}))} options={Object.values(SERVICE_CATEGORIES).map(c=>'Category '+c.code+' — '+c.title)} placeholder="Select category"/></Field>
                  <Field label="Service line"><Select value={form.service} onChange={v=>setForm(Object.assign({},form,{service:v}))} options={filteredServices.map(s=>s.code+' — '+s.title)} placeholder="Select service"/></Field>
                </div>
                <Field label="What do you need help with?" required><TextInput value={form.subject} onChange={v=>setForm(Object.assign({},form,{subject:v}))} placeholder="e.g. My PACRA application was reverted for a name issue"/></Field>
                <Field label="Describe the situation"><TextArea value={form.detail} onChange={v=>setForm(Object.assign({},form,{detail:v}))} rows={4} placeholder="Include any reference numbers, dates and what you have already tried."/></Field>
                <div className="bg-[#0A1F12]/5 border border-[#0A1F12]/10 rounded-sm p-4"><p className="text-[12px] text-[#0A1F12]/60 leading-relaxed"><strong className="text-[#0A1F12]">Scope note.</strong> StartEasy provides administrative process support. We do not provide legal, tax or accounting advice; where that is needed we will refer you to an appropriately qualified professional.</p></div>
                <button type="submit" style={{width:'100%',padding:'13px 16px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Submit request</button>
              </form>
            </div>
          </div>
          <div className="space-y-6">
            <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
              <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between"><span className="text-[14px] font-semibold text-[#0A1F12]">Your requests</span><span className="text-[11px] font-bold text-[#0A1F12]/40">{tickets.length}</span></div>
              <div className="p-6">{tickets.length===0?(<p className="text-[13px] text-[#0A1F12]/45 italic">No requests logged. Use the form to open a support matter.</p>):tickets.map(t=>(<div key={t.id} className="py-4 border-b border-[#0A1F12]/6 last:border-0"><div className="flex items-start justify-between gap-3 mb-2"><span className="text-[13.5px] font-semibold text-[#0A1F12]">{t.subject}</span><span className={'text-[10px] tracking-[0.1em] uppercase font-bold px-2 py-1 rounded-full shrink-0 '+(t.status==='Resolved'?'bg-[#1E7B3C]/15 text-[#1E7B3C]':'bg-[#F5A623]/20 text-[#8A6828]')}>{t.status}</span></div><div className="text-[11.5px] text-[#0A1F12]/45 mb-2">Category {t.category} · {t.service||'General'} · Ref {t.ref} · {fmtDate(t.createdAt)}</div>{t.detail&&<p className="text-[12px] text-[#0A1F12]/60 leading-relaxed">{t.detail}</p>}</div>))}</div>
            </div>
            <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
              <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB]"><span className="text-[14px] font-semibold text-[#0A1F12]">What the desk coordinates with</span></div>
              <div className="p-6">
                <ul className="space-y-2.5">{['PACRA','ZRA','NAPSA','Workers\' Compensation Fund Control Board','Local authorities','Sector regulators','Other government agencies'].map((x,i)=>(<li key={i} className="flex items-start gap-2.5 text-[13px] text-[#0A1F12]/65 leading-relaxed"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E7C7B" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="mt-1 shrink-0"><path d="M20 6L9 17l-5-5"/></svg>{x}</li>))}</ul>
                <p className="text-[11.5px] text-[#0A1F12]/45 italic leading-relaxed mt-5">Exact obligations are always determined by the client's business, legal structure, activities, employees and location.</p>
              </div>
            </div>
            <div className="bg-[#0A1F12] text-white rounded-sm p-6 lg:p-7 relative overflow-hidden">
              <div className="absolute top-0 right-0 w-40 h-40 bg-[#E8730F]/10 rounded-full blur-[60px] pointer-events-none"/>
              <div className="relative">
                <span className="micro text-[#F5A623] block mb-4">Recurring support</span>
                <h3 className="serif text-[20px] text-white mb-3">Subscribe to the Compliance Desk.</h3>
                <p className="text-[12.5px] leading-relaxed text-white/55 mb-5">A continuing administrative relationship: compliance calendar, document vault, renewal alerts and support. From {PRICING.subscription.zm} / {PRICING.subscription.usd} per month.</p>
                <button onClick={openComplianceSubscription} style={{width:'100%',padding:'12px 18px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8}}><i className="fas fa-calendar-check"></i> Subscribe now</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  );
}

/* ============ PRICING PAGE ============ */
function Pricing({openPayment}){
  const tiers=[
    {key:'diy',name:'Discover',tagline:'Explore the catalogue',priceZm:'Free',priceUsd:'Free',desc:'Access to the Service Catalogue, process guidance and readiness information.',feats:['Service Catalogue','Process guidance','Readiness checklists','Official links'],who:'Exploring your options'},
    {key:'nameReport',name:'Name Report',tagline:'Formal name readiness report',priceZm:PRICING.nameReport.zm,priceUsd:PRICING.nameReport.usd,desc:'A formal PDF report with detailed screening, saturation analysis and recommended submission order.',feats:['Protected-term check','Similarity analysis','Saturation review','Recommended submission order'],who:'Before name clearance',serviceKey:'nameReport'},
    {key:'guided',name:'Guided',tagline:'Guide me through it',priceZm:PRICING.guided.zm,priceUsd:PRICING.guided.usd,desc:'A personalised action plan with dynamic requirements, document checklists and readiness scoring.',feats:['Personalised journey','Document checklist','Readiness checks','Process tracker'],who:'Wanting structure',serviceKey:'guided'},
    {key:'assisted',name:'Assisted',tagline:'I need help',priceZm:PRICING.assisted.zm,priceUsd:PRICING.assisted.usd,desc:'Everything in Guided, plus human review of your pack and help resolving issues or reversions.',feats:['Everything in Guided','Human document review','Support sessions','Reversion assistance'],who:'Facing a specific problem',highlight:true,serviceKey:'assisted'},
    {key:'managed',name:'Managed',tagline:'Handle it for me',priceZm:PRICING.managed.zm,priceUsd:PRICING.managed.usd,desc:'StartEasy handles the administrative process end to end, within defined support units.',feats:['StartEasy handles submission','Dedicated support','Tracking','Document management'],who:'Businesses with no time',serviceKey:'managed'},
    {key:'subscription',name:'Compliance',tagline:'Ongoing support',priceZm:PRICING.subscription.zm,priceUsd:PRICING.subscription.usd,desc:'A continuing administrative relationship: compliance calendar, document vault, renewal alerts and support.',feats:['Compliance calendar','Document vault','Renewal alerts','Regulatory monitoring','Ongoing support'],who:'Established SMEs',serviceKey:'compliance'}
  ];
  const openTier=(tier)=>{
    if(tier.key==='diy')return;
    openPayment({amount:tier.priceZm,currency:'ZMW',purpose:tier.name+' — StartEasy Administrative Services Desk',purposeDetail:tier.desc,applicant:{firstName:'',lastName:'',email:'',phone:'',country:'Zambia',company:''},receiptPrefix:'SE-TIER',serviceKey:tier.serviceKey||'generic'});
  };
  return(
    <div className="fadein bg-[#F5FAF6]">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
        <SectionHead eyebrow="Commercial model" title="A commercial ladder — free discovery to ongoing support." sub="StartEasy is deliberately more scalable than a company-registration agency. The catalogue attracts users. The guided platform converts them. The Administrative Desk monetises those who need help. The Compliance Desk retains them." className="mb-14 max-w-3xl"/>
        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5 mb-16">
          {tiers.map(t=>(<div key={t.key} className={'bg-white rounded-sm border flex flex-col relative overflow-hidden '+(t.highlight?'border-[#E8730F] shadow-[0_0_40px_rgba(232,115,15,0.15)]':'border-[#0A1F12]/8')}>{t.highlight&&<div className="absolute top-0 right-0 bg-[#E8730F] text-white text-[10px] tracking-[0.14em] uppercase font-bold px-3 py-1.5">Most requested</div>}<div className="p-6 lg:p-7 flex-1"><span className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#0A1F12]/40 block mb-3">{t.who}</span><h3 className="serif text-[24px] text-[#0A1F12] mb-1">StartEasy {t.name}</h3><div className="text-[12px] text-[#0A1F12]/45 mb-4">{t.tagline}</div><div className="mb-5"><span className="serif text-[28px] font-bold text-[#E8730F]">{t.priceZm}</span><span className="text-[12px] text-[#0A1F12]/40 ml-2">/ {t.priceUsd}</span></div><p className="text-[12.5px] leading-relaxed text-[#0A1F12]/55 mb-5">{t.desc}</p><ul className="space-y-2.5 mb-6">{t.feats.map((f,i)=>(<li key={i} className="flex items-start gap-2.5 text-[12px] leading-relaxed text-[#0A1F12]/65"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#E8730F" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="mt-1 shrink-0"><path d="M20 6L9 17l-5-5"/></svg>{f}</li>))}</ul></div><div className="p-5 pt-0"><button onClick={()=>openTier(t)} style={{width:'100%',padding:'12px 16px',background:t.highlight?'linear-gradient(135deg,#E8730F,#F5A623)':'#0A1F12',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>{t.key==='diy'?'Start free':'Request this tier'}</button></div></div>))}
        </div>
        <div className="p-4 rounded-sm max-w-3xl" style={{background:'#FFF4E5',borderLeft:'3px solid #FFC107',fontSize:12.5,color:'#7A5C10',lineHeight:1.6}}><strong>Pricing note.</strong> The figures shown are indicative bands for demonstration only. Actual pricing must be researched against the Zambian market before being set. Fees are for StartEasy service — they never buy government approval.</div>
      </section>
    </div>
  );
}

/* ============ ABOUT PAGE ============ */
function About({go}){
  return(
    <div className="fadein bg-[#F5FAF6]">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
        <SectionHead eyebrow="About StartEasy" title="Administrative support infrastructure for Zambian businesses." sub="StartEasy is not a company-registration business. It is an administrative support and process-management service that sits between the business owner and the administrative system." className="mb-12 max-w-3xl"/>
        <div className="grid md:grid-cols-2 gap-6 mb-12">
          <div className="bg-white p-7 lg:p-9 rounded-sm border border-[#0A1F12]/8"><h3 className="serif text-[22px] text-[#0A1F12] mb-4">What StartEasy is</h3><ul className="space-y-3">{['An administrative support and process-management service.','A navigation and preparation layer between you and official regulatory systems.','A quality-control step before submission.','A keeper of your compliance calendar and records.','A referral route to qualified professionals when a matter requires it.'].map((x,i)=>(<li key={i} className="text-[13.5px] text-[#0A1F12]/65 leading-relaxed flex items-start gap-2.5"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1E7B3C" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="mt-1 shrink-0"><path d="M20 6L9 17l-5-5"/></svg>{x}</li>))}</ul></div>
          <div className="bg-white p-7 lg:p-9 rounded-sm border border-[#0A1F12]/8"><h3 className="serif text-[22px] text-[#0A1F12] mb-4">What StartEasy is not</h3><ul className="space-y-3">{['Not a government authority or a regulator.','Not a guarantor of regulatory approval.','Not a law firm or legal adviser.','Not an accounting or tax advisory practice.','Not an informal agent operating outside official channels.'].map((x,i)=>(<li key={i} className="text-[13.5px] text-[#0A1F12]/65 leading-relaxed flex items-start gap-2.5"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B8564F" strokeWidth="3" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>{x}</li>))}</ul></div>
        </div>
        <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden mb-12">
          <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB]"><span className="text-[14px] font-semibold text-[#0A1F12]">How the roles divide</span></div>
          <div className="overflow-x-auto"><table className="w-full border-collapse"><thead><tr><th className="text-left py-3 px-4 bg-[#FBFDFB] border-b border-[#0A1F12]/6 text-[10.5px] tracking-[0.1em] uppercase font-bold text-[#0A1F12]/50">Who</th><th className="text-left py-3 px-4 bg-[#FBFDFB] border-b border-[#0A1F12]/6 text-[10.5px] tracking-[0.1em] uppercase font-bold text-[#0A1F12]/50">Responsibility</th></tr></thead><tbody>{[['StartEasy','Administrative process: identification, preparation, registry screening, quality control, submission support, tracking, record keeping.'],['Lawyer','Legal advice and legal documents.'],['Accountant / tax professional','Professional accounting, tax advice and assurance.'],['HR professional','Specialist employment and HR matters.'],['The regulator','Official decision and approval. This is never StartEasy decision.']].map((r,i)=>(<tr key={i} className="border-b border-[#0A1F12]/6 last:border-0"><td className="py-3 px-4 text-[13px] font-semibold text-[#0A1F12]">{r[0]}</td><td className="py-3 px-4 text-[12.5px] text-[#0A1F12]/60 leading-relaxed">{r[1]}</td></tr>))}</tbody></table></div>
        </div>
        <div className="bg-gradient-to-br from-[#0A1F12] to-[#123A1F] rounded-sm p-8 lg:p-14 relative overflow-hidden">
          <div className="absolute top-0 right-0 w-64 h-64 bg-[#E8730F]/10 rounded-full blur-[80px] pointer-events-none"/>
          <div className="relative">
            <h2 className="serif text-[clamp(1.8rem,4vw,2.8rem)] leading-tight text-white mb-6">The seed observation</h2>
            <p className="text-[16px] leading-relaxed text-white/60 max-w-3xl">People do not necessarily fail because they do not know what they want to do. They lose time and money because they do not know how to navigate the administrative process efficiently. That is a legitimate problem worth designing a business around.</p>
            <div className="mt-8 flex flex-wrap gap-4"><Btn size="lg" variant="primary" onClick={()=>go('catalogue')}>View the Service Catalogue <Arrow/></Btn><Btn size="lg" variant="ghostLight" onClick={()=>go('promise')}>The StartEasy Promise</Btn></div>
          </div>
        </div>
      </section>
    </div>
  );
}

/* ============ APP ============ */
function App(){
  const [route,setRoute]=useState('home');
  const [paymentOpen,setPaymentOpen]=useState(false);
  const [paymentConfig,setPaymentConfig]=useState(null);
  useEffect(()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);if(parts.length)setRoute(parts[0])},[]);
  const go=useCallback((r,arg)=>{setRoute(r);try{location.hash='#/'+r+(arg?'/'+arg:'')}catch(e){}window.scrollTo({top:0,behavior:'auto'})},[]);
  useEffect(()=>{const handler=()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);setRoute(parts[0]||'home')};window.addEventListener('hashchange',handler);return()=>window.removeEventListener('hashchange',handler)},[]);
  const openPayment=useCallback((cfg)=>{setPaymentConfig(cfg);setPaymentOpen(true)},[]);
  const closePayment=useCallback(()=>{setPaymentOpen(false);setTimeout(()=>setPaymentConfig(null),300)},[]);
  const handlePaymentConfirmed=useCallback((data)=>{try{const stored=JSON.parse(localStorage.getItem('se_apps')||'[]');const newEntry={id:uid('app'),title:data.purpose||'StartEasy Service',ref:data.receiptNo?data.receiptNo.replace(/^SE-/,'TRK-'):'',status:'Preparing',notes:'Paid service — tracking reference '+(data.receiptNo||'')+'. Fulfilment in progress.',createdAt:new Date().toISOString(),timeline:[{at:new Date().toISOString(),status:'Preparing',note:'Payment confirmed — service activated'}]};stored.push(newEntry);localStorage.setItem('se_apps',JSON.stringify(stored))}catch(e){console.warn('[StartEasy] could not add to tracker',e)}},[]);
  const view=()=>{
    switch(route){
      case 'problem': return <ProblemPage go={go}/>;
      case 'promise': return <PromisePage go={go}/>;
      case 'catalogue': return <CataloguePage go={go} openPayment={openPayment}/>;
      case 'compliance': return <CompliancePage go={go} openPayment={openPayment}/>;
      case 'pricing': return <Pricing openPayment={openPayment}/>;
      case 'about': return <About go={go}/>;
      default: return <Home go={go}/>;
    }
  };
  return(
    <div className="min-h-screen bg-[#F5FAF6] flex flex-col">
      <Nav route={route} go={go}/>
      <main className="flex-1">{view()}</main>
      <Footer go={go}/>
      <FloatingAssistant/>
      {paymentConfig&&(<PaymentModal open={paymentOpen} onClose={closePayment} amount={paymentConfig.amount} currency={paymentConfig.currency} purpose={paymentConfig.purpose} purposeDetail={paymentConfig.purposeDetail} applicant={paymentConfig.applicant} receiptPrefix={paymentConfig.receiptPrefix} serviceKey={paymentConfig.serviceKey} onConfirmed={handlePaymentConfirmed} onTrack={()=>{closePayment();setTimeout(()=>go('compliance'),320)}}/>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
