<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StartEasy — Regulatory &amp; Administrative Services Desk · Zambia</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>

<style>
:root{
    --forest:#0A1F12;
    --forest-2:#123A1F;
    --green:#1E7B3C;
    --green-2:#2E9C4A;
    --green-4:#7DD957;
    --orange:#E8730F;
    --orange-2:#F5A623;
    --yellow:#FFC107;
    --light:#F5FAF6;
    --line:#DCE9DF;
    --muted:#5E7A67
}

html{
    overflow-x:hidden;
    -webkit-text-size-adjust:100%
}

body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:var(--light);
    overflow-x:hidden;
    width:100%;
    max-width:100vw;
    position:relative;
    margin:0
}

#root{
    overflow-x:hidden;
    width:100%;
    min-width:0
}

*,*::before,*::after{
    box-sizing:border-box;
    min-width:0
}

h1,h2,h3,h4,h5,h6,p,span,a,li,div{
    overflow-wrap:break-word;
    word-wrap:break-word
}

button,a{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent
}

img,svg,video,canvas,iframe,embed,object{
    max-width:100%;
    height:auto
}

.serif{
    font-family:'Playfair Display',Georgia,serif
}

.micro{
    font-size:10.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    font-weight:700
}

::selection{
    background:var(--orange-2);
    color:var(--forest)
}

input,select,textarea{
    font-family:'Inter',system-ui,sans-serif
}

input:focus,select:focus,textarea:focus{
    outline:none
}

.fadein{
    animation:fadein .5s cubic-bezier(.22,.61,.36,1) both
}

@keyframes fadein{
    from{
        opacity:0;
        transform:translateY(12px)
    }
    to{
        opacity:1;
        transform:none
    }
}

.fadein-s{
    animation:fadein .3s ease both
}

.pulse-soft{
    animation:pulseSoft 2s infinite ease-in-out
}

@keyframes pulseSoft{
    0%,100%{opacity:1}
    50%{opacity:.55}
}

::-webkit-scrollbar{
    width:8px;
    height:8px
}

::-webkit-scrollbar-track{
    background:var(--forest)
}

::-webkit-scrollbar-thumb{
    background:var(--orange-2);
    border-radius:4px
}

.modal-fade{
    animation:modalFade .25s ease both
}

@keyframes modalFade{
    from{opacity:0}
    to{opacity:1}
}

.modal-card{
    animation:modalCard .35s cubic-bezier(.22,.61,.36,1) both
}

@keyframes modalCard{
    from{
        opacity:0;
        transform:translateY(30px) scale(.98)
    }
    to{
        opacity:1;
        transform:none
    }
}

@media (max-width:768px){
    .fadein,
    .fadein-s{
        animation:none !important;
        opacity:1 !important;
        transform:none !important
    }

    .pulse-soft{
        animation:none !important;
        opacity:1 !important
    }
}

@media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:0.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:0.01ms !important;
        scroll-behavior:auto !important
    }
}

@media (min-width:1024px){
    html{
        scroll-behavior:smooth
    }
}

/* =========================
   REGISTRY SEARCH
========================= */

.registry-search-wrap{
    background:linear-gradient(
        135deg,
        #0A1F12 0%,
        #123A1F 100%
    );
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden
}

.registry-search-wrap::after{
    content:"";
    position:absolute;
    top:-60px;
    right:-60px;
    width:180px;
    height:180px;
    background:
        radial-gradient(
            circle,
            rgba(245,166,35,.18),
            transparent 65%
        );
    pointer-events:none
}

.registry-search-wrap .rsw-label{
    font-size:10.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--orange-2);
    font-weight:800;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:8px
}

.registry-search-wrap .rsw-title{
    font-family:'Playfair Display',Georgia,serif;
    font-size:22px;
    color:#fff;
    margin-bottom:6px;
    line-height:1.2
}

.registry-search-wrap .rsw-sub{
    font-size:12.5px;
    color:rgba(255,255,255,.55);
    line-height:1.6;
    margin-bottom:16px;
    max-width:640px
}

/* =========================
   FULFILMENT TIMELINE
========================= */

.fulfil-timeline{
    list-style:none;
    padding:0;
    margin:0
}

.fulfil-timeline li{
    position:relative;
    padding:0 0 22px 46px;
    border-left:2px solid rgba(10,31,18,.1);
    margin-left:16px
}

.fulfil-timeline li:last-child{
    border-left-color:transparent;
    padding-bottom:0
}

.fulfil-timeline li::before{
    content:'';
    position:absolute;
    left:-13px;
    top:0;
    width:26px;
    height:26px;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--orange-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:800;
    color:var(--orange);
    font-family:'Playfair Display',Georgia,serif;
    z-index:1
}

.fulfil-timeline li[data-step]::before{
    content:attr(data-step)
}

.fulfil-timeline li[data-state="done"]::before{
    content:'\f00c';
    font-family:'Font Awesome 6 Free';
    font-weight:900;
    background:var(--green);
    border-color:var(--green);
    color:#fff;
    font-size:11px
}

.fulfil-timeline li[data-state="now"]::before{
    background:var(--orange-2);
    border-color:var(--orange-2);
    color:#fff;
    animation:pulseSoft 2s infinite ease-in-out
}

.fulfil-timeline li .ft-title{
    font-size:14px;
    font-weight:700;
    color:var(--forest);
    margin-bottom:4px
}

.fulfil-timeline li .ft-desc{
    font-size:12.5px;
    color:rgba(10,31,18,.6);
    line-height:1.55;
    margin-bottom:6px
}

.fulfil-timeline li .ft-when{
    display:inline-block;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:800;
    color:var(--orange);
    background:rgba(232,115,15,.1);
    padding:3px 10px;
    border-radius:99px
}

.fulfil-timeline li[data-state="now"] .ft-when{
    background:rgba(232,115,15,.2)
}

/* =========================
   PAYMENT AMOUNT
========================= */

.pay-amount-banner{
    background:
        linear-gradient(
            135deg,
            var(--forest) 0%,
            var(--forest-2) 100%
        );
    color:#fff;
    border-radius:14px;
    padding:22px 24px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    position:relative;
    overflow:hidden
}

.pay-amount-banner .pab-label{
    font-size:11px;
    font-weight:800;
    letter-spacing:1.8px;
    text-transform:uppercase;
    color:var(--orange-2);
    margin-bottom:6px
}

.pay-amount-banner .pab-amount{
    font-family:'Playfair Display',Georgia,serif;
    font-size:clamp(2rem,4vw,2.6rem);
    font-weight:800;
    color:var(--orange-2);
    line-height:1
}

.pay-amount-banner .pab-context{
    font-size:12.5px;
    color:rgba(255,255,255,.72);
    margin-top:8px;
    max-width:400px;
    line-height:1.6
}

.pay-amount-banner .pab-icon{
    font-size:44px;
    color:var(--orange-2);
    opacity:.65;
    flex-shrink:0
}

/* =========================
   FEE TIER
========================= */

.fee-tier-note{
    background:
        linear-gradient(
            135deg,
            #E7F4EC 0%,
            #F1FAF4 100%
        );
    border-left:4px solid var(--green-2);
    border-radius:10px;
    padding:14px 18px;
    margin-bottom:20px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    font-size:12.5px;
    color:#0A4D28;
    line-height:1.65
}

.fee-tier-note i{
    color:var(--green);
    font-size:16px;
    flex-shrink:0;
    margin-top:2px
}

/* =========================
   PAYMENT METHODS
========================= */

.pay-methods-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-bottom:20px
}

.pay-method-card{
    background:#fff;
    border:2px solid rgba(10,31,18,.12);
    border-radius:14px;
    padding:18px 12px 16px;
    cursor:pointer;
    transition:all .25s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    font-family:inherit;
    position:relative;
    overflow:hidden
}

.pay-method-card:hover{
    border-color:var(--orange-2);
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,.08)
}

.pay-method-card.selected{
    border-color:var(--orange-2);
    box-shadow:0 0 0 4px rgba(245,166,35,.14);
    transform:translateY(-3px)
}

.pay-method-card.selected::after{
    content:'\f00c';
    font-family:'Font Awesome 6 Free';
    font-weight:900;
    position:absolute;
    top:8px;
    right:8px;
    width:22px;
    height:22px;
    background:var(--orange-2);
    color:var(--forest);
    border-radius:50%;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center
}

.pay-method-card .pm-logo{
    width:56px;
    height:56px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-family:Arial,Helvetica,sans-serif;
    flex-shrink:0
}

.pay-method-card .pm-name{
    font-size:12.5px;
    font-weight:800;
    color:var(--forest);
    line-height:1.25
}

.pay-method-card .pm-desc{
    font-size:10.5px;
    color:rgba(10,31,18,.5);
    font-weight:500;
    line-height:1.35
}

.pm-airtel .pm-logo{
    background:#E40000;
    color:#fff;
    font-size:15px;
    font-style:italic;
    text-transform:lowercase;
    padding-bottom:2px
}

.pm-mtn .pm-logo{
    background:#FFCC00;
    color:#000;
    font-size:14px
}

.pm-bank .pm-logo{
    background:linear-gradient(135deg,#1B5E8C 0%,#0D3D5E 100%);
    color:#fff;
    font-size:22px
}

.pm-paypal .pm-logo{
    background:linear-gradient(135deg,#003087 0%,#009CDE 100%);
    color:#fff;
    font-size:20px
}

.pm-crypto .pm-logo{
    background:linear-gradient(135deg,#F7931A 0%,#E2761B 100%);
    color:#fff;
    font-size:22px
}

/* =========================
   PAYMENT DETAILS
========================= */

.pay-details-panel{
    margin-top:14px;
    background:#fff;
    border:2px solid rgba(10,31,18,.12);
    border-radius:16px;
    overflow:hidden;
    animation:fadein .35s ease
}

.pay-details-panel.brand-airtel{
    border-color:#E40000
}

.pay-details-panel.brand-mtn{
    border-color:#FFCC00
}

.pay-details-panel.brand-bank{
    border-color:#1B5E8C
}

.pay-details-panel.brand-paypal{
    border-color:#003087
}

.pay-details-panel.brand-crypto{
    border-color:#F7931A
}

.pdp-header{
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    color:#fff
}

.brand-airtel .pdp-header{
    background:#E40000
}

.brand-mtn .pdp-header{
    background:#FFCC00;
    color:#000
}

.brand-bank .pdp-header{
    background:linear-gradient(135deg,#1B5E8C 0%,#0D3D5E 100%)
}

.brand-paypal .pdp-header{
    background:linear-gradient(135deg,#003087 0%,#009CDE 100%)
}

.brand-crypto .pdp-header{
    background:linear-gradient(135deg,#F7931A 0%,#E2761B 100%)
}

.pdp-header .pdp-icon{
    width:44px;
    height:44px;
    border-radius:12px;
    background:rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0
}

.brand-mtn .pdp-header .pdp-icon{
    background:rgba(0,0,0,.12)
}

.pdp-header .pdp-title{
    font-size:15px;
    font-weight:800;
    line-height:1.25
}

.pdp-header .pdp-sub{
    font-size:11.5px;
    opacity:.88;
    margin-top:2px;
    font-weight:500
}

.pdp-body{
    padding:20px
}

.pdp-amount-banner{
    background:
        linear-gradient(
            135deg,
            rgba(245,166,35,.1) 0%,
            rgba(245,166,35,.05) 100%
        );
    border:1px solid rgba(245,166,35,.2);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:16px;
}
