function numberToWords(num){const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];if(num===0)return'Zero';function c(n){if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');if(n<1000)return ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+c(n%100):'');if(n<1000000)return c(Math.floor(n/1000))+' Thousand'+(n%1000?' '+c(n%1000):'');return c(Math.floor(n/1000000))+' Million'+(n%1000000?' '+c(n%1000000):'')}return c(num)}
function amountInWords(a,cur){const n=parseFloat(String(a).replace(/[^\d.]/g,''))||0;const w=numberToWords(Math.round(n));if(cur==='USD')return'US Dollars '+w+' Only';if(cur==='ZMW')return w+' Kwacha Only';return w+' Only'}

  const fallbackCopy=(text,done)=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)};
  const buildMsg=(rcpt,dt)=>['*STARTEASY — PAYMENT REFERENCE SUBMITTED*','','*Submission ref:* '+rcpt,'*Date & time:* '+dt,'','*PURPOSE*',purpose,'','*PAYMENT DETAILS*','Method: '+(PAYMENT_METHODS[method]?PAYMENT_METHODS[method].label:'—'),'Amount declared: '+amount,'Sender name: '+senderName,'Sender contact: '+senderContact,'Transaction ID: '+(userRef||'(not provided)'),'','_Please verify this reference. This is a client declaration, not a confirmation of payment._'].join('\n');

    try{const stored=JSON.parse(localStorage.getItem('se_receipts')||'[]');stored.push({receiptNo:rcpt,receiptDate:dt,amount,currency,purpose,method:PAYMENT_METHODS[method].label,transactionRef:userRef,senderName,senderContact,serviceKey:serviceKey||'generic'});localStorage.setItem('se_receipts',JSON.stringify(stored))}catch(e){}
  };
  const copyMsg=()=>{const text=buildMsg(receiptNo,receiptDate);const done=()=>{setCopiedMessage(true);setTimeout(()=>setCopiedMessage(false),2500)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(done);else done()};
  const downloadPDF=async()=>{const el=document.getElementById('seReceipt');if(!el||typeof html2canvas==='undefined'||!window.jspdf){setErrorMsg('PDF generator not ready. Use Print.');return}setGeneratingPDF(true);try{const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});const img=canvas.toDataURL('image/png');const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});const w=pdf.internal.pageSize.getWidth();const ratio=canvas.height/canvas.width;const dw=w-20;const dh=dw*ratio;pdf.addImage(img,'PNG',10,10,dw,Math.min(dh,275));pdf.save('StartEasy-Submission-'+receiptNo+'.pdf')}catch(e){setErrorMsg('Could not generate PDF. Use Print.')}finally{setGeneratingPDF(false)}};

  if(confirmed){

        <p style={{fontSize:13,color:'rgba(10,31,18,.7)',marginTop:8,lineHeight:1.65,maxWidth:'54ch',marginLeft:'auto',marginRight:'auto'}}>A StartEasy officer will verify it against our bank and mobile money records — this is done by a person, not by software.</p>
        <div style={{background:'#fff',border:'1px dashed #25D366',borderRadius:12,padding:18,marginTop:18,textAlign:'left'}}>
          <div style={{fontSize:12.5,fontWeight:800,letterSpacing:'.6px',color:'#075E54',marginBottom:8,display:'flex',alignItems:'center',gap:8,textTransform:'uppercase'}}><i className="fab fa-whatsapp" style={{color:'#25D366',fontSize:16}}></i> Step 1 — Send your reference to the officer</div>

  const m=method?PAYMENT_METHODS[method]:null;

    {m&&<div className={`pay-details-panel ${m.brandClass}`}><div className="pdp-header"><div className="pdp-icon">{m.iconSet==='fab'?<i className={`fab ${m.icon}`}></i>:<i className={`fas ${m.icon}`}></i>}</div><div><div className="pdp-title">{m.title}</div><div className="pdp-sub">{m.sub}</div></div></div><div className="pdp-body"><div className="pdp-amount-banner"><div className="pab-l">Amount to send</div><div className="pab-v">{amount}</div></div><div className="pdp-rows" style={{marginTop:14}}>{m.rows.map((r,i)=><div key={i} className="pay-detail-row"><div className="pdr-info"><div className="pdr-label">{r.label}</div><div className={`pdr-value ${r.plain?'plain':''}`}>{r.value}</div></div>{r.copy&&<button type="button" className={`pdr-copy ${copied===r.label?'copied':''}`} onClick={()=>copyText(r.copyValue||r.value,r.label)}><i className={`fas ${copied===r.label?'fa-check':'fa-copy'}`}></i></button>}</div>)}</div><div className="pdp-steps"><div className="pds-title"><i className="fas fa-list-ol"></i> How to pay — step by step</div><ol>{m.steps.map((s,i)=><li key={i} dangerouslySetInnerHTML={{__html:s}}/>)}</ol></div>{m.note&&<div className="pdp-warning"><i className="fas fa-info-circle"></i><div>{m.note}</div></div>}</div></div>}
    {m&&<div style={{marginTop:20,paddingTop:20,borderTop:'1px dashed rgba(10,31,18,.15)'}}><h4 style={{fontSize:13,fontWeight:800,letterSpacing:.8,textTransform:'uppercase',color:'#0A1F12',marginBottom:14,display:'flex',alignItems:'center',gap:10}}><i className="fas fa-clipboard-check" style={{color:'#8A6828'}}></i> Confirm you have paid</h4><div className="grid sm:grid-cols-2 gap-5"><div><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:8}}>Your name (as on the payment) <span style={{color:'#E8730F'}}>*</span></label><input value={senderName} onChange={e=>setSenderName(e.target.value)} placeholder="e.g. Mulenga Katyala" style={{width:'100%',padding:'12px 14px',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff'}}/></div><div><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:8}}>Phone / email used to pay <span style={{color:'#E8730F'}}>*</span></label><input value={senderContact} onChange={e=>setSenderContact(e.target.value)} placeholder="e.g. 076 304 9144" style={{width:'100%',padding:'12px 14px',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff'}}/></div></div><div style={{marginTop:14}}><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:8}}>Transaction reference / Transaction ID <span style={{color:'#E8730F'}}>*</span></label><input value={userRef} onChange={e=>setUserRef(e.target.value)} placeholder="e.g. 10683000119" style={{width:'100%',padding:'12px 14px',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'#fff'}}/></div><label style={{display:'flex',gap:12,alignItems:'flex-start',fontSize:13,color:'rgba(10,31,18,.8)',cursor:'pointer',lineHeight:1.55,fontWeight:500,marginTop:14}}><input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)} style={{width:18,height:18,accentColor   </div>;

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [route,setRoute]=useState('home');
  const [routeArg,setRouteArg]=useState(null);
  const [serviceModal,setServiceModal]=useState(null);
  const [paymentOpen,setPaymentOpen]=useState(false);
  const [paymentConfig,setPaymentConfig]=useState(null);

  useEffect(()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);if(parts.length)setRoute(parts[0]);if(parts.length>1)setRouteArg(parts[1])},[]);
  const go=useCallback((r,arg)=>{setRoute(r);setRouteArg(arg||null);try{location.hash='#/'+r+(arg?'/'+arg:'')}catch(e){}window.scrollTo({top:0,behavior:'auto'})},[]);
  useEffect(()=>{const h=()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);setRoute(parts[0]||'home');setRouteArg(parts[1]||null)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);

  const openPayment=useCallback(cfg=>{setPaymentConfig(cfg);setPaymentOpen(true)},[]);
  const closePayment=useCallback(()=>{setPaymentOpen(false);setTimeout(()=>setPaymentConfig(null),300)},[]);
  const requestService=useCallback(s=>{setServiceModal(null);setTimeout(()=>openPayment({amount:s.priceZm,currency:'ZMW',purpose:s.code+' — '+s.title,purposeDetail:s.desc,receiptPrefix:'SE-'+s.code,serviceKey:s.desk||'generic'}),260)},[openPayment]);

  const view=()=>{
    switch(route){
      case 'lines': return <ServiceLinesPage go={go}/>;
      case 'desks': return <DesksPage go={go}/>;
      case 'desk': return <DeskDetailPage deskId={routeArg||'pacra'} go={go} onOpenService={setServiceModal} openPayment={openPayment}/>;
      case 'audit': return <AuditPage go={go} openPayment={openPayment}/>;
      case 'services': return <ServicesPage onOpenService={setServiceModal} go={go}/>;
      case 'providers': return <ProvidersPage/>;
      case 'pricing': return <PricingPage openServiceModal={setServiceModal}/>;
      case 'about': return <AboutPage go={go}/>;
      default: return <Home go={go} onOpenService={setServiceModal}/>;
    }
  };

  return <div className="min-h-screen bg-[#F5FAF6] flex flex-col">
    <Nav route={route} go={go}/>
    <main className="flex-1">{view()}</main>
    <Footer go={go}/>
    <FloatingAssistant/>
    {serviceModal&&<ServiceDetailModal service={serviceModal} onClose={()=>setServiceModal(null)} onRequest={requestService}/>}
    {paymentConfig&&<ModalShell open={paymentOpen} onClose={closePayment} eyebrow="Secure payment" title={paymentConfig.purpose} maxWidth="48rem"><PaymentFlow amount={paymentConfig.amount} currency={paymentConfig.currency} purpose={paymentConfig.purpose} purposeDetail={paymentConfig.purposeDetail} receiptPrefix={paymentConfig.receiptPrefix} serviceKey={paymentConfig.serviceKey} onClose={closePayment} onGoToDesk={()=>{closePayment();setTimeout(()=>go('home'),320)}}/></ModalShell>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
