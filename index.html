<style>
:root{--forest:#0A1F12;--forest-2:#123A1F;--green:#1E7B3C;--orange:#E8730F;--orange-2:#F5A623;--light:#F5FAF6;--red:#B8564F;--purple:#7A4FA3;--blue:#1B6CA8;--teal:#0E7C7B}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--light);overflow-x:hidden;margin:0}
#root{overflow-x:hidden;width:100%}
*,*::before,*::after{box-sizing:border-box;min-width:0}
h1,h2,h3,h4,h5,h6,p,span,a,li,div,button{overflow-wrap:break-word}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.serif{font-family:'Playfair Display',Georgia,serif}
.micro{font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700}
::selection{background:var(--orange-2);color:var(--forest)}
input,select,textarea{font-family:'Inter',system-ui,sans-serif}
input:focus,select:focus,textarea:focus{outline:none}
.fadein{animation:fi .5s cubic-bezier(.22,.61,.36,1) both}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:ps 2s infinite ease-in-out}
@keyframes ps{0%,100%{opacity:1}50%{opacity:.55}}
.mf{animation:mf .25s ease both}
@keyframes mf{from{opacity:0}to{opacity:1}}
.mc{animation:mc .35s cubic-bezier(.22,.61,.36,1) both}
@keyframes mc{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:768px){.fadein{animation:none!important;opacity:1!important;transform:none!important}.pulse{animation:none!important}}

/* tile */
.gtile{background:#fff;border:2px solid rgba(10,31,18,.1);border-radius:12px;padding:20px;text-align:left;cursor:pointer;font-family:inherit;transition:all .22s;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.gtile:hover{border-color:#E8730F;transform:translateY(-3px);box-shadow:0 10px 25px rgba(0,0,0,.07)}
.gtile.sel{border-color:#E8730F;background:linear-gradient(135deg,rgba(232,115,15,.06),rgba(245,166,35,.03));box-shadow:0 0 0 4px rgba(232,115,15,.12)}
.gtile .ico{width:42px;height:42px;border-radius:10px;background:rgba(232,115,15,.1);color:#E8730F;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gtile.sel .ico{background:#E8730F;color:#fff}
.gtile h3{font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700;color:#0A1F12;line-height:1.25;margin:0}
.gtile p{font-size:12.5px;color:rgba(10,31,18,.55);line-height:1.5;margin:0}
/* svc */
.svc{background:#fff;border:1px solid rgba(10,31,18,.08);border-radius:12px;padding:0;cursor:pointer;font-family:inherit;text-align:left;transition:all .25s;display:flex;flex-direction:column;position:relative;overflow:hidden;height:100%}
.svc:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.08);border-color:rgba(232,115,15,.4)}
.svc .bar{height:3px;background:var(--accent,#E8730F)}
.svc .bd{padding:22px;display:flex;flex-direction:column;gap:12px;flex:1}
.svc .code{font-family:Consolas,monospace;font-size:10.5px;letter-spacing:.08em;color:rgba(10,31,18,.4);font-weight:700}
.svc h3{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:#0A1F12;line-height:1.25;margin:0}
.svc p{font-size:12.5px;color:rgba(10,31,18,.6);line-height:1.55;margin:0;flex:1}
.svc .foot{padding-top:14px;border-top:1px solid rgba(10,31,18,.06);display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.svc .lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(10,31,18,.4);font-weight:800;margin-bottom:3px}
.svc .fee{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:800;color:#E8730F;line-height:1}
.svc .when{font-size:10.5px;color:rgba(10,31,18,.4);margin-top:3px}
/* feebox */
.feebox{background:linear-gradient(135deg,#FFF9E6,#FFFCF0);border:1px solid #F0E0A0;border-radius:10px;padding:18px 20px}
.feebox .row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;align-items:baseline;font-size:13px}
.feebox .row+.row{border-top:1px dashed #E0D08A}
.feebox .l{color:#666;font-weight:600}
.feebox .v{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:800;color:#0A1F12;white-space:nowrap}
/* wizard step chips */
.step{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border:1.5px solid rgba(10,31,18,.1);border-radius:99px;font-size:12px;font-weight:600;color:rgba(10,31,18,.5);font-family:inherit;transition:all .25s;flex-shrink:0}
.step.done{background:rgba(30,123,60,.1);color:#1E7B3C;border-color:rgba(30,123,60,.3);cursor:pointer}
.step.active{background:#0A1F12;color:#fff;border-color:#0A1F12}
.step .n{width:20px;height:20px;border-radius:50%;background:rgba(10,31,18,.08);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.step.active .n{background:rgba(255,255,255,.2)}
.step.done .n{background:rgba(30,123,60,.2);color:#1E7B3C}
/* input */
.inp{width:100%;background:#fff;border:2px solid rgba(10,31,18,.12);border-radius:12px;padding:16px 20px;font-size:14.5px;color:#0A1F12;font-family:inherit;transition:all .2s;line-height:1.5}
.inp:focus{border-color:#E8730F;box-shadow:0 0 0 4px rgba(232,115,15,.08)}
/* chip */
.dchip{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;background:#fff;border:1.5px solid rgba(10,31,18,.12);border-radius:99px;font-size:12.5px;font-weight:600;color:rgba(10,31,18,.75);cursor:pointer;font-family:inherit;transition:all .2s}
.dchip:hover{border-color:#E8730F;color:#E8730F}
.dchip.on{background:#E8730F;color:#fff;border-color:#E8730F}
/* structure tile */
.stile{background:#fff;border:2px solid rgba(10,31,18,.1);border-radius:12px;padding:18px 20px;text-align:left;cursor:pointer;font-family:inherit;transition:all .22s;position:relative}
.stile:hover{border-color:#E8730F}
.stile.sel{border-color:#E8730F;background:linear-gradient(135deg,rgba(232,115,15,.05),rgba(245,166,35,.02))}
.stile .rec{position:absolute;top:14px;right:14px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(30,123,60,.12);color:#1E7B3C}
.stile h4{font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;color:#0A1F12;line-height:1.3;margin:0 0 6px}
.stile p{font-size:12.5px;color:rgba(10,31,18,.6);line-height:1.55;margin:0 0 10px}
.stile .ends{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.stile .ends span{font-family:Consolas,monospace;font-size:10.5px;font-weight:700;color:rgba(10,31,18,.5);background:rgba(10,31,18,.05);padding:3px 8px;border-radius:4px}
/* industry tile */
.iti{background:#fff;border:2px solid rgba(10,31,18,.1);border-radius:12px;padding:16px 18px;text-align:left;cursor:pointer;font-family:inherit;transition:all .22s;position:relative}
.iti:hover{border-color:#E8730F;transform:translateY(-2px)}
.iti.sel{border-color:#E8730F;background:linear-gradient(135deg,rgba(232,115,15,.05),rgba(245,166,35,.02))}
.iti .isic{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:6px}
.iti h4{font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:700;color:#0A1F12;line-height:1.3;margin:0 0 6px}
.iti p{font-size:11.5px;color:rgba(10,31,18,.55);line-height:1.5;margin:0}
/* report */
.rpt{background:#fff;border:1px solid #D0D0D0;border-radius:8px;padding:32px 38px;font-size:12.5px;line-height:1.6;color:#222}
.rpt .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:3px solid #0A1F12;margin-bottom:20px;flex-wrap:wrap}
.rpt .rh .brand{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:800;color:#0A1F12;letter-spacing:1px}
.rpt .rh .brand em{font-style:normal;color:#E8730F}
.rpt .rh .sub{font-size:9.5px;color:#8A6828;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:4px}
.rpt .rh .dt{font-family:'Playfair Display',Georgia,serif;font-size:13px;font-weight:800;color:#E8730F;letter-spacing:1.2px;text-align:right}
.rpt .rh .mt{font-size:10.5px;color:#666;text-align:right;margin-top:6px}
.rpt h5{font-family:'Playfair Display',Georgia,serif;font-size:13px;color:#0A1F12;font-weight:700;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid #E0E0E0}
.rpt h5:first-of-type{margin-top:0}
.rpt .row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;font-size:12px;border-bottom:1px dashed #EEE}
.rpt .row:last-child{border-bottom:none}
.rpt .row .k{color:#666;font-weight:600;flex-shrink:0}
.rpt .row .v{color:#0A1F12;font-weight:700;text-align:right;max-width:65%}
.rpt ol.names{list-style:none;padding:0;margin:0;counter-reset:rn}
.rpt ol.names li{display:flex;gap:12px;padding:9px 0;font-size:12.5px;counter-increment:rn;border-bottom:1px dashed #EEE}
.rpt ol.names li:last-child{border-bottom:none}
.rpt ol.names li::before{content:counter(rn);width:22px;height:22px;border-radius:50%;background:#0A1F12;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Playfair Display',Georgia,serif}
.rpt ol.names li .nm{font-family:Consolas,monospace;font-weight:700;color:#0A1F12;letter-spacing:.03em}
.rpt .flag{border-radius:6px;padding:12px 14px;margin:10px 0;font-size:11.5px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.rpt .flag.warn{background:#FFF4E5;border-left:3px solid #E8730F;color:#7A5C10}
.rpt .flag.crit{background:#FFE8E5;border-left:3px solid #B8564F;color:#7C2318}
.rpt .flag.ok{background:#EAF7EE;border-left:3px solid #1E7B3C;color:#0F5C2A}
.rpt .flag .ic{flex-shrink:0;font-size:14px;margin-top:1px}
.rpt .foot{margin-top:22px;padding-top:16px;border-top:2px solid #0A1F12;font-size:10.5px;color:#666;line-height:1.6}
/* engagement letter */
.el{background:#fff;border:1px solid #D0D0D0;border-radius:8px;padding:34px 42px;font-size:13px;line-height:1.65;color:#222}
.el .eh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:3px solid #0A1F12;margin-bottom:22px;flex-wrap:wrap}
.el .eh .brand{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:800;color:#0A1F12;letter-spacing:1px}
.el .eh .brand em{font-style:normal;color:#E8730F}
.el .eh .sub{font-size:9.5px;color:#8A6828;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:4px}
.el .eh .dt{font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:800;color:#E8730F;letter-spacing:1.2px;text-align:right}
.el .eh .mt{font-size:11px;color:#666;text-align:right;margin-top:6px}
.el h4{font-family:'Playfair Display',Georgia,serif;font-size:15px;color:#0A1F12;font-weight:700;margin:22px 0 10px}
.el h4:first-of-type{margin-top:0}
.el p{margin:0 0 12px}
.el ul{margin:0 0 14px;padding-left:22px}
.el li{margin-bottom:6px;font-size:12.5px}
.el .total{margin-top:8px;padding-top:14px;border-top:2px solid #0A1F12;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.el .total .tl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#8A6828}
.el .total .tv{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:800;color:#E8730F}
.el .sign{margin-top:26px;padding-top:20px;border-top:1px solid #E0E0E0;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.el .sign .line{border-bottom:1px solid #333;height:36px;margin-bottom:8px}
.el .sign .lbl{font-size:10.5px;color:#666;font-weight:600}
.el .ft{margin-top:22px;padding-top:16px;border-top:2px solid #0A1F12;font-size:10.5px;color:#666;line-height:1.6}
/* modal */
.mb{background:#F5FAF6;border-radius:8px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.mbh{background:#0A1F12;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(245,166,35,.15)}
.mbb{padding:26px 30px}
/* pay */
.paygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.pmc{background:#fff;border:2px solid rgba(10,31,18,.12);border-radius:12px;padding:16px 12px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;transition:all .22s}
.pmc:hover{border-color:#F5A623;transform:translateY(-2px)}
.pmc.sel{border-color:#F5A623;box-shadow:0 0 0 4px rgba(245,166,35,.14)}
.pmc .lg{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.pmc .nm{font-size:12.5px;font-weight:800;color:#0A1F12}
.pmc .ds{font-size:10.5px;color:rgba(10,31,18,.5);line-height:1.35}
.pm-airtel .lg{background:#E40000;color:#fff;font-style:italic;text-transform:lowercase;font-size:14px}
.pm-mtn .lg{background:#FFCC00;color:#000;font-size:13px}
.pm-bank .lg{background:linear-gradient(135deg,#1B5E8C,#0D3D5E);color:#fff;font-size:20px}
.pm-paypal .lg{background:linear-gradient(135deg,#003087,#009CDE);color:#fff;font-size:18px}
.pm-crypto .lg{background:linear-gradient(135deg,#F7931A,#E2761B);color:#fff;font-size:20px}
.tl{list-style:none;padding:0;margin:0}
.tl li{position:relative;padding:0 0 22px 42px;border-left:2px solid rgba(10,31,18,.1);margin-left:16px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:attr(data-step);position:absolute;left:-13px;top:0;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #F5A623;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#E8730F;font-family:'Playfair Display',Georgia,serif}
.tl .tt{font-size:14px;font-weight:700;color:#0A1F12;margin-bottom:4px}
.tl .td{font-size:12.5px;color:rgba(10,31,18,.6);line-height:1.55;margin-bottom:6px}
.tl .tw{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#E8730F;background:rgba(232,115,15,.1);padding:3px 10px;border-radius:99px}
@media print{body.pr *{visibility:hidden!important}body.pr .printable,body.pr .printable *{visibility:visible!important}body.pr .printable{position:absolute;left:0;top:0;width:100%;padding:20px;background:#fff}}
</style>

/* ============================================================
   NAME ANALYSIS
   ============================================================ */
const PATTERNS=['zambia','lusaka','ndola','kitwe','livingstone','kabwe','solwezi','africa','copperbelt','zambezi','luangwa','trading','investments','holdings','enterprises','services','general','dealers','group','global','international'];
const PROTECTED=['bank','insurance','trust','microfinance','pension','securities','lottery','gaming','casino','university','national','government','ministry','municipal','council','chartered','royal','sacco','cooperative','revenue','customs'];
const GENERIC=['business','enterprise','enterprises','company','services','service','trading','traders','investments','investment','holdings','group','general','dealers','suppliers','ventures','solutions','consultants','consulting'];
function analyseName(name){
  const n=(name||'').trim().toLowerCase();
  if(!n)return{score:0,issues:[],patterns:[],protected:[]};
  const issues=[];
  const patterns=PATTERNS.filter(p=>n.includes(p));
  const prot=PROTECTED.filter(p=>n.includes(p));
  let score=100;
  if(n.length<3){score-=40;issues.push({level:'crit',text:'Name is too short to be distinctive.'});}
  if(/^\d+$/.test(n)){score-=40;issues.push({level:'crit',text:'A name made only of numbers is unlikely to be accepted.'});}
  if(n.length>30){score-=10;issues.push({level:'warn',text:'Unusually long — shorter distinctive names are usually stronger.'});}
  if(patterns.length>0){score-=patterns.length*6;issues.push({level:'warn',text:`Contains ${patterns.length} common pattern${patterns.length>1?'s':''}: ${patterns.join(', ')}. Add a more distinctive element.`});}
  if(prot.length>0){score-=prot.length*20;issues.push({level:'crit',text:`Contains protected term${prot.length>1?'s':''}: ${prot.join(', ')}. Written consent may be required.`});}
  if(GENERIC.includes(n)){score-=30;issues.push({level:'crit',text:'A single generic word is unlikely to be accepted.'});}
  score=Math.max(0,Math.min(100,Math.round(score)));
  return{score,issues,patterns,protected:prot};
}
function label(s){if(s>=80)return'Strong';if(s>=60)return'Moderate';if(s>=40)return'Weak';return'Needs work';}
function color(s){if(s>=80)return'#1E7B3C';if(s>=60)return'#E8730F';return'#B8564F';}

const ALL_SERVICES=Object.entries(S).map(([k,v])=>({key:k,...v}));
const findService=code=>{const entry=Object.entries(S).find(([k,v])=>v.code===code);return entry?{key:entry[0],...entry[1]}:null;};
const findServiceByKey=key=>S[key]?{key,...S[key]}:null;
const getDesk=id=>DESKS[id];

/* ============================================================

   ============================================================ */
function Modal({open,onClose,eyebrow,title,children,maxWidth='46rem'}){
  useEffect(()=>{if(open)document.body.style.overflow='hidden';else document.body.style.overflow='';return()=>{document.body.style.overflow=''}},[open]);
  if(!open)return null;
  return <div className="fixed inset-0 z-[200] flex items-center justify-center p-3 mf" style={{background:'rgba(10,31,18,0.88)'}} onClick={onClose}>
    <div className="mb mc" style={{maxWidth}} onClick={e=>e.stopPropagation()}>
      <div className="mbh">
        <div style={{display:'flex',alignItems:'center',gap:12,minWidth:0}}>
          <span style={{width:8,height:8,borderRadius:'50%',background:'#F5A623'}} className="pulse"></span>
          <span style={{fontSize:10.5,letterSpacing:'.2em',textTransform:'uppercase',fontWeight:700,color:'#F5A623',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{eyebrow||'StartEasy'}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:16}}>
          {title&&<span className="hidden sm:block" style={{fontSize:12,fontWeight:600,color:'rgba(255,255,255,.7)',maxWidth:'20rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{title}</span>}
          <button onClick={onClose} style={{background:'none',border:'none',color:'rgba(255,255,255,.5)',cursor:'pointer',padding:4}} aria-label="Close"><svg width="16" height="16" viewBox="0 0 14 14" fill="none"><path d="M1 1L13 13M13 1L1 13" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg></button>
        </div>
      </div>
      <div className="mbb">{children}</div>
    </div>
  </div>;
}

/* Engagement proposal */
function Engagement({serviceKey,onClose,onAgreed}){
  const s=serviceKey?findServiceByKey(serviceKey):null;
  const [client,setClient]=useState({name:'',business:'',email:'',phone:''});
  const [agreed,setAgreed]=useState(false);
  const [error,setError]=useState('');
  if(!s)return null;
  const desk=getDesk(s.desk);
  const sf=s.service?SF[s.service]:null;
  const og=s.ongoing?ONGOING[s.ongoing]:null;
  const proceed=()=>{
    setError('');
    if(!client.name.trim()){setError('Please enter your full name.');return}
    if(!client.email.trim()){setError('Please enter your email.');return}
    if(!agreed){setError('Please confirm you agree to the engagement terms.');return}
    onAgreed({client,service:s});
  };
  return <Modal open={!!s} onClose={onClose} eyebrow="Engagement proposal" maxWidth="54rem">
    <div className="el printable" id="engagementLetter">
      <div className="eh">
        <div>
          <div className="brand">Start<em>Easy</em></div>
          <div className="sub">Administrative Services Desk · Zambia</div>
        </div>

/* ============================================================
   WIZARD — Structure & Name
   ============================================================ */
function Wizard({initialScope,onExit,onOrderFormal}){
  const [step,setStep]=useState(0);
  const [scope,setScope]=useState(initialScope||null);
  const [idea,setIdea]=useState('');
  const [industry,setIndustry]=useState(null);
  const [structure,setStructure]=useState(null);
  const [descriptor,setDescriptor]=useState('');
  const [distinctive,setDistinctive]=useState('');

  useEffect(()=>{if(industry&&!descriptor){const ind=INDUSTRIES.find(i=>i.key===industry);if(ind)setDescriptor(ind.descriptors[0]);}},[industry]);
  useEffect(()=>{if(industry&&!structure&&scope!=='names'){setStructure('ltd');}},[industry,scope]);

  const stepsArr=useMemo(()=>{
    if(!scope)return['scope'];
    const s=['scope','idea','industry'];
    if(scope==='structure'||scope==='both')s.push('structure');
    if(scope==='names'||scope==='both'){s.push('descriptor');s.push('distinctive');}
    s.push('report');
    return s;
  },[scope]);
  const current=stepsArr[step];
  const industryData=industry?INDUSTRIES.find(i=>i.key===industry):null;
  const structureData=structure?STRUCTURES.find(s=>s.key===structure):null;
  const analysis=useMemo(()=>analyseName(distinctive),[distinctive]);

  const names=useMemo(()=>{
    if(!distinctive.trim()||!descriptor||!industryData)return[];
    const distinct=distinctive.trim().toUpperCase();
    const desc=descriptor.toUpperCase();
    const ending=structureData&&structureData.endings.length?structureData.endings[0]:'LIMITED';
    const out=[`${distinct} ${desc} ${ending}`.trim()];
    const alts=industryData.descriptors.filter(d=>d.toUpperCase()!==desc).slice(0,2);
    alts.forEach(a=>out.push(`${distinct} ${a.toUpperCase()} ${ending}`.trim()));
    return out.filter(Boolean);
  },[distinctive,descriptor,industryData,structureData]);

  const readiness=useMemo(()=>{
    let t=0;
    if(idea.trim().length>=20)t+=15;
    if(industry)t+=15;
    if(structure)t+=15;
    if(descriptor)t+=15;
    if(analysis.score>=80)t+=25;else if(analysis.score>=60)t+=18;else if(analysis.score>=40)t+=10;
    if(industryData?.flag)t-=5;
    return Math.max(0,Math.min(100,t));
  },[idea,industry,structure,descriptor,analysis,industryData]);

  useEffect(()=>{if(step>=stepsArr.length)setStep(stepsArr.length-1)},[stepsArr.length,step]);
  useEffect(()=>{window.scrollTo({top:120,behavior:'smooth'})},[step]);

  const next=()=>{if(step<stepsArr.length-1)setStep(step+1)};
  const back=()=>{if(step>0)setStep(step-1)};
  const can=()=>{
    if(current==='scope')return!!scope;
    if(current==='idea')return idea.trim().length>=15;
    if(current==='industry')return!!industry;
    if(current==='structure')return!!structure;
    if(current==='descriptor')return!!descriptor;
    if(current==='distinctive')return distinctive.trim().length>=3;

        <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',minWidth:520}}>
          <thead><tr><th style={{textAlign:'left',padding:'12px 20px',background:'#FBFDFB',borderBottom:'1px solid rgba(10,31,18,.06)',fontSize:10.5,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:700,color:'rgba(10,31,18,.5)'}}>Who</th><th style={{textAlign:'left',padding:'12px 20px',background:'#FBFDFB',borderBottom:'1px solid rgba(10,31,18,.06)',fontSize:10.5,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:700,color:'rgba(10,31,18,.5)'}}>Responsibility</th></tr></thead>
          <tbody>{[['StartEasy','Prepare, coordinate, submit, track and maintain your administrative filings — acting on your behalf.'],['Lawyer','Legal advice and legal documents.'],['Auditor / accountant','Professional accounting, audit and assurance.'],['Tax adviser','Specialist tax advice, computation and objections.'],['The regulator','Official decision and approval. This is never StartEasy\'s decision.']].map((r,i)=><tr key={i} style={{borderBottom:'1px solid rgba(10,31,18,.06)'}}><td style={{padding:'14px 20px',fontSize:13,fontWeight:600,color:'#0A1F12',verticalAlign:'top'}}>{r[0]}</td><td style={{padding:'14px 20px',fontSize:12.5,color:'rgba(10,31,18,.6)',lineHeight:1.6}}>{r[1]}</td></tr>)}</tbody>
        </table></div>
      </div>
      <div style={{padding:'24px 28px',background:'rgba(232,115,15,.06)',border:'1px solid rgba(232,115,15,.25)',borderRadius:10,maxWidth:900}}>
        <div style={{fontSize:11,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:10}}>Operational boundary</div>
        <p style={{fontSize:13.5,color:'rgba(10,31,18,.75)',lineHeight:1.7,margin:0}}>StartEasy provides administrative and compliance-support services. Tax computation/advice, audit opinions, legal opinions, litigation, immigration and other regulated professional work are handled by appropriately qualified professionals where required. Requirements and fees change — we verify the applicable requirement with the relevant authority before every submission.</p>
      </div>
    </section>
  </div>;
}

function FloatingAssistant(){
  const [open,setOpen]=useState(false);
  return <div className="fixed" style={{bottom:24,right:24,zIndex:100,display:'flex',flexDirection:'column',alignItems:'flex-end',paddingBottom:'env(safe-area-inset-bottom)'}}>
    {open&&<div style={{marginBottom:14,width:'18rem',maxWidth:'calc(100vw - 48px)',background:'#fff',borderRadius:10,boxShadow:'0 20px 60px rgba(0,0,0,.2)',border:'1px solid rgba(10,31,18,.1)',overflow:'hidden'}}>
      <div style={{background:'#0A1F12',padding:'14px 18px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}><span style={{width:8,height:8,borderRadius:'50%',background:'#F5A623'}}/><span style={{fontSize:12,fontWeight:600,color:'#fff'}}>Need guidance?</span></div>
        <button onClick={()=>setOpen(false)} style={{background:'none',border:'none',color:'rgba(255,255,255,.5)',cursor:'pointer'}} aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg></button>
      </div>
      <div style={{padding:18}}>
        <p style={{fontSize:12.5,color:'rgba(10,31,18,.65)',lineHeight:1.6,marginBottom:14}}>Pick a desk to explore, or message us directly with what you are trying to do.</p>
        <a href={waUrl('Hello StartEasy — I need help choosing the right service.')} target="_blank" rel="noopener noreferrer" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:9,background:'#25D366',color:'#fff',padding:'12px 18px',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp"></i> Chat on WhatsApp</a>
        <a href={'mailto:'+CONTACT_EMAIL} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:9,background:'#fff',color:'#0A1F12',padding:'12px 18px',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none',marginTop:8,border:'1px solid rgba(10,31,18,.15)'}}><i className="fas fa-envelope"></i> Email us</a>
      </div>
    </div>}
    <button onClick={()=>setOpen(!open)} style={{width:52,height:52,borderRadius:'50%',background:'linear-gradient(135deg,#E8730F,#F5A623)',boxShadow:'0 4px 20px rgba(232,115,15,.45)',display:'flex',alignItems:'center',justifyContent:'center',border:'none',cursor:'pointer'}} aria-label="Help"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
  </div>;
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [route,setRoute]=useState('home');
  const [routeArg,setRouteArg]=useState(null);
  const [wizardScope,setWizardScope]=useState(null);
  const [serviceModal,setServiceModal]=useState(null);
  const [engagementModal,setEngagementModal]=useState(null);
  const [engagementClient,setEngagementClient]=useState(null);
  const [paymentOpen,setPaymentOpen]=useState(false);

  useEffect(()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);if(parts.length)setRoute(parts[0]);if(parts.length>1)setRouteArg(parts[1])},[]);
  const go=useCallback((r,arg)=>{setRoute(r);setRouteArg(arg||null);try{location.hash='#/'+r+(arg?'/'+arg:'')}catch(e){}window.scrollTo({top:0,behavior:'auto'})},[]);
  useEffect(()=>{const h=()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);setRoute(parts[0]||'home');setRouteArg(parts[1]||null)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);

  const openWizard=useCallback(scope=>{setWizardScope(scope||null);go('wizard');setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),50)},[go]);
  const proceedToEngagement=useCallback(s=>{setServiceModal(null);setTimeout(()=>setEngagementModal(s.key||s.code),260)},[]);
  const agreedEngagement=useCallback(({client,service})=>{setEngagementClient({client,service});setEngagementModal(null);setTimeout(()=>setPaymentOpen(true),280)},[]);
  const closePayment=useCallback(()=>{setPaymentOpen(false);setTimeout(()=>setEngagementClient(null),260)},[]);
  const handleServiceClick=useCallback(s=>{if(s.wizardEntry){openWizard(s.wizardScope);return}setServiceModal(s.key)},[openWizard]);
  const handleWizardOrder=useCallback(wizData=>{
    setEngagementModal({code:wizData.code,desk:wizData.desk,title:wizData.title,clientDesc:wizData.clientDesc,whatsCovered:wizData.whatsCovered,service:wizData.service,timeline:wizData.timeline,key:'_wizard'});
  },[]);

  const view=()=>{
    switch(route){
      case 'wizard': return <Wizard initialScope={wizardScope} onExit={()=>go('home')} onOrderFormal={handleWizardOrder}/>;
      case 'desks': return <DesksPage go={go}/>;
      case 'desk': return <DeskDetail deskId={routeArg||'pacra'} go={go} onServiceClick={handleServiceClick} onWizard={openWizard}/>;
      case 'services': return <ServicesPage onServiceClick={handleServiceClick}/>;
      case 'engagement': return <EngagementPage go={go}/>;
      case 'pricing': return <PricingPage go={go}/>;
      case 'about': return <AboutPage/>;
      default: return <Home go={go}/>;
    }
  };

  const serviceForModal=useMemo(()=>{
    if(!serviceModal)return null;
    if(typeof serviceModal==='object'&&serviceModal._wizard)return serviceModal;
    return serviceModal;
  },[serviceModal]);

  return <div style={{minHeight:'100vh',background:'#F5FAF6',display:'flex',flexDirection:'column'}}>
    <Nav route={route} go={go}/>
    <main style={{flex:1}}>{view()}</main>
    <Footer go={go}/>
    <FloatingAssistant/>
    {serviceModal&&typeof serviceModal==='string'&&<ServiceDetail serviceKey={serviceModal} onClose={()=>setServiceModal(null)} onProceed={proceedToEngagement} onWizard={openWizard}/>}
    {engagementModal&&<Engagement serviceKey={engagementModal} onClose={()=>setEngagementModal(null)} onAgreed={agreedEngagement}/>}
    {paymentOpen&&engagementClient&&<Modal open={paymentOpen} onClose={closePayment} eyebrow="Engagement payment" maxWidth="52rem">
      <Payment service={engagementClient.service} client={engagementClient.client} onClose={closePayment} onDone={()=>{closePayment();setTimeout(()=>go('home'),320)}}/>
    </Modal>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
