html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--light);overflow-x:hidden;margin:0}
#root{overflow-x:hidden;width:100%}
*,*::before,*::after{box-sizing:border-box;min-width:0}
h1,h2,h3,h4,h5,h6,p,span,a,li,div{overflow-wrap:break-word}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.serif{font-family:'Playfair Display',Georgia,serif}
.micro{font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700}

input,select,textarea{font-family:'Inter',system-ui,sans-serif}

.fadein{animation:fadein .5s cubic-bezier(.22,.61,.36,1) both}

/* Guide tile */
.gtile{background:#fff;border:2px solid rgba(10,31,18,.10);border-radius:12px;padding:20px;text-align:left;cursor:pointer;font-family:inherit;transition:all .22s ease;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.gtile:hover{border-color:#E8730F;transform:translateY(-3px);box-shadow:0 10px 25px rgba(0,0,0,.07)}

.gtile .gt-icon{width:42px;height:42px;border-radius:10px;background:rgba(232,115,15,.10);color:#E8730F;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gtile.selected .gt-icon{background:#E8730F;color:#fff}
.gtile .gt-title{font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700;color:#0A1F12;line-height:1.25;margin:0}
.gtile .gt-desc{font-size:12.5px;color:rgba(10,31,18,.55);line-height:1.5;margin:0}
/* Service card */
.svc{background:#fff;border:1px solid rgba(10,31,18,.08);border-radius:12px;padding:0;cursor:pointer;font-family:inherit;text-align:left;transition:all .25s ease;display:flex;flex-direction:column;gap:0;position:relative;overflow:hidden;height:100%}

.svc .svc-bar{height:3px;width:100%;background:var(--accent,#E8730F)}
.svc .svc-body{padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.svc .svc-code{font-family:Consolas,monospace;font-size:10.5px;letter-spacing:.08em;color:rgba(10,31,18,.4);font-weight:700}
.svc .svc-title{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:#0A1F12;line-height:1.25;margin:0}
.svc .svc-desc{font-size:12.5px;color:rgba(10,31,18,.6);line-height:1.55;margin:0;flex:1}
.svc .svc-foot{padding-top:14px;border-top:1px solid rgba(10,31,18,.06);display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.svc .svc-lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(10,31,18,.4);font-weight:800;margin-bottom:3px}
.svc .svc-fee{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:800;color:#E8730F;line-height:1}
.svc .svc-when{font-size:10.5px;color:rgba(10,31,18,.4);margin-top:3px}
.svc .svc-arrow{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;flex-shrink:0}

.feebox .fb-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;align-items:baseline;font-size:13px}
.feebox .fb-row + .fb-row{border-top:1px dashed #E0D08A}
.feebox .fb-lbl{color:#666;font-weight:600}
.feebox .fb-val{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:800;color:#0A1F12;white-space:nowrap}

.el .el-brand-sub{font-size:9.5px;color:#8A6828;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:4px}
.el .el-doc{font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:800;color:#E8730F;letter-spacing:1.2px;text-align:right}
.el .el-meta{font-size:11px;color:#666;text-align:right;margin-top:6px}
.el h4{font-family:'Playfair Display',Georgia,serif;font-size:15px;color:#0A1F12;font-weight:700;margin:22px 0 10px}
.el h4:first-of-type{margin-top:0}
.el p{margin:0 0 12px}
.el ul{margin:0 0 14px;padding-left:22px}
.el li{margin-bottom:6px;font-size:12.5px}

.el .el-footer{margin-top:22px;padding-top:16px;border-top:2px solid #0A1F12;font-size:10.5px;color:#666;line-height:1.6}

.pmcard{background:#fff;border:2px solid rgba(10,31,18,.12);border-radius:12px;padding:16px 12px 14px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;transition:all .22s}

.pmcard .pmname{font-size:12.5px;font-weight:800;color:#0A1F12}
.pmcard .pmdesc{font-size:10.5px;color:rgba(10,31,18,.5);line-height:1.35}

.pm-mtn .pmlogo{background:#FFCC00;color:#000;font-size:13px}

/* Timeline */
.tl{list-style:none;padding:0;margin:0}
.tl li{position:relative;padding:0 0 22px 42px;border-left:2px solid rgba(10,31,18,.1);margin-left:16px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:attr(data-step);position:absolute;left:-13px;top:0;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #F5A623;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#E8730F;font-family:'Playfair Display',Georgia,serif}
.tl .tl-t{font-size:14px;font-weight:700;color:#0A1F12;margin-bottom:4px}

function Btn({children,onClick,variant='primary',size='md',className='',type='button',disabled}){
  const base='inline-flex items-center justify-center gap-2.5 transition-all duration-300 tracking-wide disabled:opacity-30 disabled:cursor-not-allowed rounded-sm font-semibold';
  const sizes={sm:'text-[12px] px-4 py-2.5',md:'text-[13px] px-6 py-3.5',lg:'text-[13.5px] px-8 py-4'};
  const variants={primary:'bg-gradient-to-br from-[#E8730F] to-[#F5A623] text-white hover:shadow-[0_0_25px_rgba(232,115,15,0.4)]',ghost:'border border-[#0A1F12]/20 text-[#0A1F12] hover:border-[#E8730F] hover:bg-[#E8730F]/5',ghostLight:'border border-white/20 text-white hover:bg-[#F5A623] hover:text-[#0A1F12] hover:border-[#F5A623]',forest:'bg-[#0A1F12] text-white hover:bg-[#123A1F]'};
  return <button type={type} onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>{children}</button>;
}
function Arrow({className=''}){return <svg className={className} width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M9 1L13 5L9 9M13 5H1" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}

    <div className="mb" style={{maxWidth}} onClick={e=>e.stopPropagation()}>
      <div className="mb-head">
        <div style={{display:'flex',alignItems:'center',gap:12,minWidth:0}}>
          <span style={{width:8,height:8,borderRadius:'50%',background:'#F5A623'}} className="pulse-soft"></span>
          <span style={{fontSize:10.5,letterSpacing:'.2em',textTransform:'uppercase',fontWeight:700,color:'#F5A623',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{eyebrow||'StartEasy'}</span>

  const copyText=(text,key)=>{const done=()=>{setCopied(key);setTimeout(()=>setCopied(''),1500)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(done);else done()};

    setErrorMsg('');
    if(!method){setErrorMsg('Select a payment method.');return}
    if(!senderName.trim()){setErrorMsg('Enter the name on the payment.');return}
    if(!senderContact.trim()){setErrorMsg('Enter the phone or email used.');return}

        <p style={{fontSize:11,letterSpacing:'.18em',textTransform:'uppercase',color:'#F5A623',fontWeight:700,marginBottom:20}}>Start Right. Stay Compliant. Grow with Confidence.</p>
        <p style={{fontSize:15.5,lineHeight:1.7,color:'rgba(255,255,255,.6)',maxWidth:840,marginBottom:28}}>Business compliance and regulatory administration for Zambian entrepreneurs, founders, SMEs and established companies.</p>
        <NotRegulatorStrip tone="dark"/>
      </div>
    </section>
    <section className="max-w-[1240px] mx-auto px-6 lg:px-10 py-14">
      <div className="grid lg:grid-cols-2 gap-6 mb-12">
        <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:30,borderTopWidth:4,borderTopColor:'#1E7B3C'}}>
          <h3 className="serif" style={{fontSize:20,color:'#0A1F12',marginBottom:16}}>What StartEasy is</h3>
          <ul style={{listStyle:'none',padding:0,margin:0}}>{['An administrative services desk.','A technology-enabled platform for guided exploration and engagement.','A preparation and quality-control step before submission.','A keeper of your compliance calendar and records.','A referral route to qualified professionals.'].map((x,i)=><li key={i} style={{display:'flex',gap:12,fontSize:13.5,color:'rgba(10,31,18,.7)',lineHeight:1.6,marginBottom:11}}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1E7B3C" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" style={{marginTop:4,flexShrink:0}}><path d="M20 6L9 17l-5-5"/></svg>{x}</li>)}</ul>
        </div>
        <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:30,borderTopWidth:4,borderTopColor:'#B8564F'}}>
          <h3 className="serif" style={{fontSize:20,color:'#0A1F12',marginBottom:16}}>What StartEasy is not</h3>
          <ul style={{listStyle:'none',padding:0,margin:0}}>{['Not a government authority or regulator.','Not a law firm, auditor or tax advisory practice.','Not a guarantor of regulatory approval.','Not a payment processor — payments are verified manually.','Not an informal agent outside official channels.'].map((x,i)=><li key={i} style={{display:'flex',gap:12,fontSize:13.5,color:'rgba(10,31,18,.7)',lineHeight:1.6,marginBottom:11}}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B8564F" strokeWidth="3" strokeLinecap="round" style={{marginTop:4,flexShrink:0}}><path d="M6 6l12 12M18 6L6 18"/></svg>{x}</li>)}</ul>
        </div>
      </div>
      <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,overflow:'hidden',marginBottom:20}}>
        <div style={{padding:'16px 24px',borderBottom:'1px solid rgba(10,31,18,.06)',background:'#FBFDFB'}}><span style={{fontSize:14,fontWeight:600,color:'#0A1F12'}}>How the roles divide</span></div>
        <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',minWidth:520}}>
          <thead><tr><th style={{textAlign:'left',padding:'12px 20px',background:'#FBFDFB',borderBottom:'1px solid rgba(10,31,18,.06)',fontSize:10.5,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:700,color:'rgba(10,31,18,.5)'}}>Who</th><th style={{textAlign:'left',padding:'12px 20px',background:'#FBFDFB',borderBottom:'1px solid rgba(10,31,18,.06)',fontSize:10.5,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:700,color:'rgba(10,31,18,.5)'}}>Responsibility</th></tr></thead>
          <tbody>{[['StartEasy','Prepare, coordinate, submit, track and maintain your administrative filings — acting on your behalf.'],['Lawyer','Legal advice and legal documents.'],['Auditor / accountant','Professional accounting, audit and assurance.'],['Tax adviser','Specialist tax advice, computation and objections.'],['The regulator','Official decision and approval. This is never StartEasy\'s decision.']].map((r,i)=><tr key={i} style={{borderBottom:'1px solid rgba(10,31,18,.06)'}}><td style={{padding:'14px 20px',fontSize:13,fontWeight:600,color:'#0A1F12',verticalAlign:'top'}}>{r[0]}</td><td style={{padding:'14px 20px',fontSize:12.5,color:'rgba(10,31,18,.6)',lineHeight:1.6}}>{r[1]}</td></tr>)}</tbody>
        </table></div>
      </div>
      <div style={{padding:'24px 28px',background:'rgba(232,115,15,.06)',border:'1px solid rgba(232,115,15,.25)',borderRadius:10,maxWidth:900}}>
        <div style={{fontSize:11,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:10}}>Operational boundary</div>
        <p style={{fontSize:13.5,color:'rgba(10,31,18,.75)',lineHeight:1.7,margin:0}}>StartEasy provides administrative and compliance-support services. Tax computation/advice, audit opinions, legal opinions, litigation, immigration and other regulated professional work are handled by appropriately qualified professionals where required. Requirements and fees change — we verify the applicable requirement with the relevant authority before every submission rather than publishing fixed government fees.</p>
      </div>
    </section>
  </div>;
}

/* ============================================================
   FLOATING ASSISTANT
   ============================================================ */
function FloatingAssistant(){
  const [open,setOpen]=useState(false);
  return <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end" style={{paddingBottom:'env(safe-area-inset-bottom)'}}>
    {open&&<div style={{marginBottom:14,width:'18rem',maxWidth:'calc(100vw - 48px)',background:'#fff',borderRadius:10,boxShadow:'0 20px 60px rgba(0,0,0,.2)',border:'1px solid rgba(10,31,18,.1)',overflow:'hidden'}}>
      <div style={{background:'#0A1F12',padding:'14px 18px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}><span style={{width:8,height:8,borderRadius:'50%',background:'#F5A623'}}/><span style={{fontSize:12,fontWeight:600,color:'#fff'}}>Need guidance?</span></div>
        <button onClick={()=>setOpen(false)} style={{background:'none',border:'none',color:'rgba(255,255,255,.5)',cursor:'pointer'}} aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg></button>
      </div>
      <div style={{padding:18}}>
        <p style={{fontSize:12.5,color:'rgba(10,31,18,.65)',lineHeight:1.6,marginBottom:14}}>Pick a desk to explore, or message us directly with what you are trying to do.</p>
        <a href={waUrl('Hello StartEasy — I need help choosing the right service.')} target="_blank" rel="noopener noreferrer" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:9,background:'#25D366',color:'#fff',padding:'12px 18px',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none'}}><i className="fab fa-whatsapp"></i> Chat on WhatsApp</a>
        <a href={'mailto:'+CONTACT_EMAIL} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:9,background:'#fff',color:'#0A1F12',padding:'12px 18px',borderRadius:8,fontSize:13,fontWeight:700,textDecoration:'none',marginTop:8,border:'1px solid rgba(10,31,18,.15)'}}><i className="fas fa-envelope"></i> Email us</a>
      </div>
    </div>}
    <button onClick={()=>setOpen(!open)} style={{width:52,height:52,borderRadius:'50%',background:'linear-gradient(135deg,#E8730F,#F5A623)',boxShadow:'0 4px 20px rgba(232,115,15,.45)',display:'flex',alignItems:'center',justifyContent:'center',border:'none',cursor:'pointer'}} aria-label="Help"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
  </div>;
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [route,setRoute]=useState('home');
  const [routeArg,setRouteArg]=useState(null);
  const [serviceModal,setServiceModal]=useState(null);
  const [engagementModal,setEngagementModal]=useState(null);
  const [engagementClient,setEngagementClient]=useState(null);
  const [paymentOpen,setPaymentOpen]=useState(false);

  useEffect(()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);if(parts.length)setRoute(parts[0]);if(parts.length>1)setRouteArg(parts[1])},[]);
  const go=useCallback((r,arg)=>{setRoute(r);setRouteArg(arg||null);try{location.hash='#/'+r+(arg?'/'+arg:'')}catch(e){}window.scrollTo({top:0,behavior:'auto'})},[]);
  useEffect(()=>{const h=()=>{const raw=(location.hash||'').replace(/^#\/?/,'');const parts=raw.split('/').filter(Boolean);setRoute(parts[0]||'home');setRouteArg(parts[1]||null)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);

  const proceedToEngagement=useCallback(s=>{setServiceModal(null);setTimeout(()=>setEngagementModal(s),260)},[]);
  const agreedEngagement=useCallback(({client,service})=>{setEngagementClient({client,service});setEngagementModal(null);setTimeout(()=>setPaymentOpen(true),280)},[]);
  const closePayment=useCallback(()=>{setPaymentOpen(false);setTimeout(()=>setEngagementClient(null),260)},[]);
  const handleServiceClick=useCallback(s=>{setServiceModal(s)},[]);

  const view=()=>{
    switch(route){
      case 'desks': return <DesksPage go={go}/>;
      case 'desk': return <DeskDetail deskId={routeArg||'pacra'} go={go} onServiceClick={handleServiceClick}/>;
      case 'services': return <ServicesPage onServiceClick={handleServiceClick}/>;
      case 'advisory': return <AdvisoryPage go={go} onServiceClick={(code)=>{const s=findService(code);if(s)setServiceModal(s)}}/>;
      case 'engagement': return <EngagementPage go={go}/>;
      case 'pricing': return <PricingPage go={go}/>;
      case 'about': return <AboutPage/>;
      default: return <Home go={go}/>;
    }
  };

  return <div className="min-h-screen bg-[#F5FAF6] flex flex-col">
    <Nav route={route} go={go}/>
    <main className="flex-1">{view()}</main>
    <Footer go={go}/>
    <FloatingAssistant/>
    {serviceModal&&<ServiceDetail code={Object.keys(S).find(k=>S[k].code===serviceModal.code)} onClose={()=>setServiceModal(null)} onProceed={proceedToEngagement}/>}
    {engagementModal&&<Engagement code={Object.keys(S).find(k=>S[k].code===engagementModal.code)} onClose={()=>setEngagementModal(null)} onAgreed={agreedEngagement}/>}
    {paymentOpen&&engagementClient&&<ModalShell open={paymentOpen} onClose={closePayment} eyebrow="Engagement payment" maxWidth="52rem">
      <PaymentFlow service={engagementClient.service} client={engagementClient.client} onClose={closePayment} onDone={()=>{closePayment();setTimeout(()=>go('home'),320)}}/>
    </ModalShell>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
