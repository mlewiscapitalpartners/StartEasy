<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StartEasy — Regulatory &amp; Administrative Services Desk · Zambia</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>
<style>
  :root{
    --forest:#0A1F12; --forest-2:#123A1F; --forest-3:#0F2F1A;
    --green:#1E7B3C; --green-2:#2E9C4A; --green-3:#4CB050; --green-4:#7DD957;
    --orange:#E8730F; --orange-2:#F5A623; --yellow:#FFC107;
    --light:#F5FAF6; --cream:#FBFDFB;
    --line:#DCE9DF; --muted:#5E7A67;
  }
  html{overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;text-rendering:optimizeLegibility}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:var(--light);overflow-x:hidden;width:100%;max-width:100vw;position:relative}
  #root{overflow-x:hidden;width:100%;min-width:0}
  *,*::before,*::after{box-sizing:border-box;min-width:0}
  h1,h2,h3,h4,h5,h6,p,span,a,li,div{overflow-wrap:break-word;word-wrap:break-word}
  button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  img,svg,video,canvas,iframe,embed,object{max-width:100%;height:auto}
  .serif{font-family:'Playfair Display',Georgia,serif}
  .micro{font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700}
  ::selection{background:var(--orange-2);color:var(--forest)}
  input,select,textarea{font-family:'Inter',system-ui,sans-serif}
  input:focus,select:focus,textarea:focus{outline:none}
  .fadein{animation:fadein .5s cubic-bezier(.22,.61,.36,1) both}
  @keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .fadein-s{animation:fadein .3s ease both}
  .slide-up{animation:slideUp .45s ease both}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .pulse-soft{animation:pulseSoft 2s infinite ease-in-out}
  @keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.55}}
  .bar-grow{animation:barGrow 1s cubic-bezier(.22,.61,.36,1) both}
  @keyframes barGrow{from{width:0 !important}}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--forest)}
  ::-webkit-scrollbar-thumb{background:var(--orange-2);border-radius:4px}
  .glow{box-shadow:0 0 30px rgba(232,115,15,.18)}
  .glow-green{box-shadow:0 0 30px rgba(46,156,74,.18)}
  .modal-fade{animation:modalFade .25s ease both}
  @keyframes modalFade{from{opacity:0}to{opacity:1}}
  .modal-card{animation:modalCard .35s cubic-bezier(.22,.61,.36,1) both}
  @keyframes modalCard{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
  .paper{box-shadow:0 10px 40px -10px rgba(10,31,18,.15),0 2px 8px rgba(10,31,18,.04)}
  @media (max-width:768px){
    .fadein,.fadein-s,.slide-up{animation:none !important;opacity:1 !important;transform:none !important}
    .pulse-soft{animation:none !important;opacity:1 !important}
    .bar-grow{animation-duration:.4s !important}
    .backdrop-blur-md,.backdrop-blur,.backdrop-blur-sm{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important}
  }
  @media (min-width:1024px){html{scroll-behavior:smooth}}

  /* ===== PAYMENT COMPONENTS ===== */
  .pay-amount-banner{background:linear-gradient(135deg,var(--forest) 0%,var(--forest-2) 100%);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
  .pay-amount-banner .pab-label{font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--orange-2);margin-bottom:6px;position:relative;z-index:2}
  .pay-amount-banner .pab-amount{font-family:'Playfair Display',Georgia,serif;font-size:clamp(2rem,4vw,2.6rem);font-weight:800;color:var(--orange-2);line-height:1;position:relative;z-index:2}
  .pay-amount-banner .pab-context{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:8px;position:relative;z-index:2;max-width:400px;line-height:1.6}
  .pay-amount-banner .pab-icon{font-size:44px;color:var(--orange-2);opacity:.65;position:relative;z-index:2;flex-shrink:0}
  .fee-tier-note{background:linear-gradient(135deg,#E7F4EC 0%,#F1FAF4 100%);border-left:4px solid var(--green-2);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;gap:12px;align-items:flex-start;font-size:12.5px;color:#0A4D28;line-height:1.65}
  .fee-tier-note i{color:var(--green);font-size:16px;flex-shrink:0;margin-top:2px}
  .fee-tier-note strong{color:#0A4D28}
  .pay-methods-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .pay-method-card{background:#fff;border:2px solid rgba(10,31,18,.12);border-radius:14px;padding:18px 12px 16px;cursor:pointer;transition:border-color .25s ease,box-shadow .25s ease,transform .25s ease;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-family:inherit;position:relative;overflow:hidden}
  .pay-method-card:hover{border-color:var(--orange-2);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
  .pay-method-card.selected{border-color:var(--orange-2);box-shadow:0 0 0 4px rgba(245,166,35,.14);transform:translateY(-3px)}
  .pay-method-card.selected::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:8px;right:8px;width:22px;height:22px;background:var(--orange-2);color:var(--forest);border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center}
  .pay-method-card .pm-logo{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:Arial,Helvetica,sans-serif;letter-spacing:-.5px;flex-shrink:0}
  .pay-method-card .pm-name{font-size:12.5px;font-weight:800;color:var(--forest);line-height:1.25;letter-spacing:.2px}
  .pay-method-card .pm-desc{font-size:10.5px;color:rgba(10,31,18,.5);font-weight:500;line-height:1.35}
  .pm-airtel .pm-logo{background:#E40000;color:#fff;font-size:15px;font-style:italic;text-transform:lowercase;letter-spacing:-1px;padding-bottom:2px}
  .pm-mtn .pm-logo{background:#FFCC00;color:#000;font-size:14px;letter-spacing:-.5px}
  .pm-bank .pm-logo{background:linear-gradient(135deg,#1B5E8C 0%,#0D3D5E 100%);color:#fff;font-size:22px}
  .pm-paypal .pm-logo{background:linear-gradient(135deg,#003087 0%,#009CDE 100%);color:#fff;font-size:20px}
  .pm-crypto .pm-logo{background:linear-gradient(135deg,#F7931A 0%,#E2761B 100%);color:#fff;font-size:22px}
  .pay-details-panel{margin-top:14px;background:#fff;border:2px solid rgba(10,31,18,.12);border-radius:16px;overflow:hidden;animation:fadein .35s ease}
  .pay-details-panel.brand-airtel{border-color:#E40000}
  .pay-details-panel.brand-mtn{border-color:#FFCC00}
  .pay-details-panel.brand-bank{border-color:#1B5E8C}
  .pay-details-panel.brand-paypal{border-color:#003087}
  .pay-details-panel.brand-crypto{border-color:#F7931A}
  .pdp-header{padding:16px 20px;display:flex;align-items:center;gap:14px;color:#fff}
  .brand-airtel .pdp-header{background:#E40000}
  .brand-mtn .pdp-header{background:#FFCC00;color:#000}
  .brand-bank .pdp-header{background:linear-gradient(135deg,#1B5E8C 0%,#0D3D5E 100%)}
  .brand-paypal .pdp-header{background:linear-gradient(135deg,#003087 0%,#009CDE 100%)}
  .brand-crypto .pdp-header{background:linear-gradient(135deg,#F7931A 0%,#E2761B 100%)}
  .pdp-header .pdp-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .brand-mtn .pdp-header .pdp-icon{background:rgba(0,0,0,.12)}
  .pdp-header .pdp-title{font-size:15px;font-weight:800;letter-spacing:.3px;line-height:1.25}
  .pdp-header .pdp-sub{font-size:11.5px;opacity:.88;margin-top:2px;font-weight:500}
  .pdp-body{padding:20px}
  .pdp-amount-banner{background:linear-gradient(135deg,rgba(245,166,35,.1) 0%,rgba(245,166,35,.05) 100%);border:1px solid rgba(245,166,35,.35);border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .pdp-amount-banner .pab-l{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#8A6828}
  .pdp-amount-banner .pab-v{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:800;color:var(--forest);line-height:1}
  .pdp-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  .pay-detail-row{background:#F7FAF8;border:1px solid rgba(10,31,18,.1);border-radius:10px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pay-detail-row .pdr-info{flex:1;min-width:0}
  .pay-detail-row .pdr-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8A6828;font-weight:800;margin-bottom:3px}
  .pay-detail-row .pdr-value{font-size:15px;font-weight:700;color:var(--forest);font-family:'SFMono-Regular',Consolas,'Courier New',monospace;word-break:break-all;line-height:1.35}
  .pay-detail-row .pdr-value.plain{font-family:'Inter',sans-serif;font-size:14.5px;letter-spacing:.2px}
  .pay-detail-row .pdr-copy{background:rgba(245,166,35,.15);border:none;color:#8A6828;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s ease;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .pay-detail-row .pdr-copy:hover{background:var(--orange-2);color:var(--forest);transform:scale(1.05)}
  .pay-detail-row .pdr-copy.copied{background:#28A745;color:#fff}
  .pdp-steps{background:#fff;border:1px solid rgba(10,31,18,.1);border-radius:10px;padding:18px 20px 18px 44px;margin-bottom:12px}
  .pdp-steps .pds-title{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--forest);margin-bottom:14px;margin-left:-22px;display:flex;align-items:center;gap:8px}
  .pdp-steps .pds-title i{color:#8A6828}
  .pdp-steps ol{list-style:none;padding:0;margin:0;counter-reset:stepc}
  .pdp-steps ol li{position:relative;padding:0 0 14px 0;font-size:13px;color:rgba(10,31,18,.8);line-height:1.55;counter-increment:stepc}
  .pdp-steps ol li::before{content:counter(stepc);position:absolute;left:-30px;top:0;width:22px;height:22px;border-radius:50%;background:rgba(245,166,35,.15);color:#8A6828;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif}
  .pdp-steps ol li:last-child{padding-bottom:0}
  .pdp-warning{background:#FFF4E5;border-left:3px solid var(--yellow);border-radius:8px;padding:14px 18px;font-size:12.5px;color:#7A5C10;line-height:1.6;margin-top:6px;display:flex;gap:12px;align-items:flex-start}
  .pdp-warning i{color:#D89400;font-size:16px;flex-shrink:0;margin-top:2px}
  .pdp-warning strong{color:#5C4508}
  .ussd-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .ussd-link{display:inline-flex;align-items:center;gap:7px;background:var(--forest);color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:700;transition:all .25s ease;text-decoration:none;border:1px solid var(--forest);cursor:pointer}
  .ussd-link:hover{background:var(--forest-2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .ussd-link i{font-size:12px}
  .ussd-link.ussd-airtel{background:#E40000;border-color:#E40000}
  .ussd-link.ussd-airtel:hover{background:#C20000;border-color:#C20000}
  .ussd-link.ussd-mtn{background:#FFCC00;border-color:#FFCC00;color:#000}
  .ussd-link.ussd-mtn:hover{background:#E6B800;border-color:#E6B800}
  .pay-confirm-form{margin-top:20px;padding-top:20px;border-top:1px dashed rgba(10,31,18,.15)}
  .pay-confirm-form h4{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--forest);margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .pay-confirm-form h4 i{color:#8A6828}
  .payment-success{background:linear-gradient(135deg,#EAF7EE 0%,#F0FBF4 100%);border:2px solid #28A745;border-radius:14px;padding:24px 22px;text-align:center;margin-top:8px}
  .payment-success i.ps-icon{font-size:56px;color:#28A745;margin-bottom:10px;display:block}
  .payment-success h4{font-family:'Playfair Display',Georgia,serif;font-size:22px;color:var(--forest);margin-bottom:8px}
  .payment-success > p{font-size:13.5px;color:rgba(10,31,18,.6);margin-bottom:6px;line-height:1.65}
  .payment-success > p strong{color:var(--forest);font-weight:700}
  .ps-whatsapp-block{background:#fff;border:1px dashed #25D366;border-radius:12px;padding:18px;margin-top:18px;text-align:left}
  .ps-whatsapp-block .psw-title{font-size:12.5px;font-weight:800;letter-spacing:.6px;color:#075E54;margin-bottom:8px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
  .ps-whatsapp-block .psw-title i{color:#25D366;font-size:16px}
  .ps-whatsapp-block p{font-size:12.5px;color:rgba(10,31,18,.6);line-height:1.6;margin-bottom:12px}
  .btn-whatsapp{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;padding:13px 22px;border-radius:10px;font-size:14px;font-weight:700;width:100%;transition:all .25s ease;border:none;cursor:pointer;font-family:inherit;text-decoration:none}
  .btn-whatsapp:hover{background:#1EBE5A;transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,211,102,.35)}
  .btn-whatsapp i{font-size:18px}
  .psw-note{font-size:11.5px;color:rgba(10,31,18,.5);margin-top:10px;font-style:italic;line-height:1.55;text-align:center}
  .psw-sent{background:#E7F7EC;border:1px solid #25D366;color:#075E54;font-size:12.5px;font-weight:600;padding:10px 14px;border-radius:8px;margin-top:12px;display:none;align-items:center;gap:8px}
  .psw-sent.show{display:flex}
  .receipt-section{margin-top:20px;text-align:left}
  .receipt-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:0 4px}
  .receipt-section-head h5{font-family:'Playfair Display',Georgia,serif;font-size:16px;color:var(--forest);font-weight:700}
  .receipt-section-head .rsh-sub{font-size:11.5px;color:rgba(10,31,18,.5);margin-top:2px}
  .receipt-buttons{display:flex;gap:8px;flex-wrap:wrap}
  .receipt-btn{display:inline-flex;align-items:center;gap:7px;background:var(--forest);color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;font-weight:700;border:none;cursor:pointer;transition:all .25s ease;font-family:inherit}
  .receipt-btn:hover{background:var(--forest-2);transform:translateY(-1px)}
  .receipt-btn.receipt-btn-gold{background:var(--orange-2);color:var(--forest)}
  .receipt-btn.receipt-btn-gold:hover{background:#FFCA3A}
  .receipt-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .se-receipt{background:#fff;border:1px solid #D0D0D0;border-radius:6px;padding:26px 28px;font-family:'Inter',Arial,sans-serif;color:#222;font-size:12.5px;line-height:1.55;margin-top:10px;max-width:640px;word-break:break-word}
  .se-receipt .nr-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:14px;border-bottom:3px solid var(--forest);margin-bottom:16px;flex-wrap:wrap}
  .se-receipt .nr-brand{font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:800;color:var(--forest);letter-spacing:1px;line-height:1.1}
  .se-receipt .nr-brand em{font-style:normal;color:var(--orange)}
  .se-receipt .nr-brand-sub{font-size:9.5px;color:#8A6828;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:4px}
  .se-receipt .nr-doc-type{font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:800;color:var(--orange);letter-spacing:1.5px;text-align:right;line-height:1.2}
  .se-receipt .nr-status{display:inline-block;font-size:9px;font-weight:800;letter-spacing:1.2px;padding:4px 10px;border-radius:50px;margin-top:6px}
  .se-receipt .nr-status.status-pending{background:#FFF3CD;color:#856404;border:1px solid #FFE69C}
  .se-receipt .nr-meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11.5px;padding:12px 14px;background:#FAFAF8;border-radius:6px;margin-bottom:16px}
  .se-receipt .nr-lbl{color:#666;font-weight:600}
  .se-receipt .nr-meta strong,.se-receipt .nr-grid-2 strong{color:var(--forest);font-weight:700}
  .se-receipt .nr-section{padding:12px 0;border-bottom:1px dashed #E0E0E0}
  .se-receipt .nr-section:last-of-type{border-bottom:none}
  .se-receipt .nr-section-title{font-size:9.5px;font-weight:800;letter-spacing:1.5px;color:#8A6828;text-transform:uppercase;margin-bottom:8px}
  .se-receipt .nr-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:5px 24px;font-size:12px}
  .se-receipt .nr-footer{margin-top:16px;padding-top:14px;border-top:2px solid var(--forest);font-size:10.5px;color:#666}
  .se-receipt .nr-highlight-amount{background:#FFF9E6;border:1px solid #F0E0A0;border-radius:8px;padding:12px 16px;margin:14px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .se-receipt .nr-highlight-amount .nr-ha-lbl{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:#8A6828;font-weight:800}
  .se-receipt .nr-highlight-amount .nr-ha-val{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:800;color:var(--forest);line-height:1}
  .se-receipt .nr-amount-words{font-size:10.5px;color:#555;font-style:italic;margin-top:6px;width:100%}
  .nr-qr-block{display:flex;gap:16px;align-items:center;padding:12px 14px;background:#F7F9FB;border-radius:8px;margin:14px 0;border:1px solid #E8EEF3;flex-wrap:wrap}
  .nr-qr-canvas-wrap{background:#fff;padding:6px;border-radius:6px;border:1px solid #E0E0E0;flex-shrink:0}
  .nr-qr-canvas-wrap canvas{display:block;width:92px!important;height:92px!important}
  .nr-qr-text{flex:1;font-size:10.5px;color:#555;line-height:1.55;min-width:0}
  .nr-qr-text strong{color:var(--forest);display:block;margin-bottom:3px;font-size:11px}
  .nr-qr-text code{background:#fff;padding:2px 6px;border-radius:4px;font-size:10px;color:var(--forest);border:1px solid #E0E0E0;display:inline-block;margin-top:4px;word-break:break-all}
  .nr-signature{margin-top:16px;padding-top:12px;border-top:1px solid #E0E0E0;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .nr-signature .nr-sig-block{flex:1;min-width:180px}
  .nr-signature .nr-sig-line{border-bottom:1px solid #333;height:34px;margin-bottom:6px}
  .nr-signature .nr-sig-lbl{font-size:10px;color:#666;font-weight:600}
  .receipt-check{background:linear-gradient(135deg,#F0FAF3 0%,#F7FCF9 100%);border:1px solid #BDE0C7;border-radius:12px;padding:16px 18px;margin-top:16px;text-align:left}
  .receipt-check h6{font-size:12px;font-weight:800;letter-spacing:.6px;color:#0F5C2A;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .receipt-check h6 i{font-size:14px}
  .receipt-check-row{display:flex;gap:8px;flex-wrap:wrap}
  .receipt-check-row input{flex:1;min-width:160px;padding:10px 14px;border:2px solid #BDE0C7;border-radius:8px;font-family:inherit;font-size:13.5px;color:#0F5C2A;background:#fff}

function isMobileDevice() {
  if (typeof navigator === 'undefined') return false;
  const ua = (navigator.userAgent || navigator.vendor || '').toLowerCase();
  return /android|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile/i.test(ua);
}
function buildWhatsappUrl(message, phone) {
  const p = phone || ADMIN_WHATSAPP;
  const encoded = encodeURIComponent(message);
  if (isMobileDevice()) return 'whatsapp://send?phone=' + p + '&text=' + encoded;
  return 'https://wa.me/' + p + '?text=' + encoded;
}
function launchWhatsapp(message, phone) {
  const url = buildWhatsappUrl(message, phone);
  if (isMobileDevice()) {
    try {
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.style.display = 'none';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      return { opened: true, url };
    } catch (e) { return { opened: false, url }; }
  }
  let placeholder = null;
  try {
    placeholder = window.open('about:blank', '_blank');
    if (placeholder) { try { placeholder.document.write('<title>Opening WhatsApp…</title><body style="font-family:system-ui;padding:24px;color:#0A1F12">Opening WhatsApp…</body>'); } catch(e){} }
  } catch (e) {}
  return { opened: false, url, placeholder };
}

const PROTECTED_WORDS = ['bank','banking','insurance','assurance','trust','microfinance','pension','securities','stock exchange','lottery','gaming','casino','university','national','government','ministry','municipal','council','chartered','royal','sacco','cooperative','co-operative','revenue','customs','judicial','parliament','state'];

const GENERIC_WORDS = ['business','enterprise','enterprises','company','services','service','trading','traders','investments','investment','holdings','group','general','dealers','suppliers','ventures','solutions','consultants','consulting'];

function bigrams(s){const t=s.replace(/[^a-z0-9]/g,'');const out=[];for(let i=0;i<t.length-1;i++)out.push(t.slice(i,i+2));return out;}
function similarity(a,b){const A=bigrams(a),B=bigrams(b);if(!A.length||!B.length)return 0;const m={};A.forEach(g=>m[g]=(m[g]||0)+1);let inter=0;B.forEach(g=>{if(m[g]){m[g]--;inter++;}});return(2*inter)/(A.length+B.length);}
function analyseName(raw){
  const name=String(raw||'').trim();
  if(!name) return { name, score:0, band:'Not assessed', cls:'neutral', issues:[['critical','No name entered.']], notes:[] };
  const lower=name.toLowerCase();
  const tokens=lower.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  const issues=[],notes=[];
  let score=100;
  if(name.length<3){score-=40;issues.push(['critical','The name is too short to be distinctive.']);}
  if(name.length>60){score-=14;issues.push(['warn','Unusually long — shorter names are easier to clear.']);}
  if(/^\d+$/.test(name)){score-=32;issues.push(['critical','A name made up only of numbers is unlikely to be accepted.']);}
  if(/[^A-Za-z0-9 &.,'()\-]/.test(name)){score-=10;issues.push(['warn','Contains unusual characters or symbols.']);}
  if(/(.)\1{2,}/.test(lower)){score-=9;issues.push(['warn','Repeated letters may look like a typing error.']);}
  if(/\b(\w+)\s+\1\b/.test(lower)){score-=12;issues.push(['warn','A word is repeated.']);}
  PROTECTED_WORDS.forEach(w=>{if(lower.includes(w)){score-=20;issues.push(['critical',`Contains the protected or regulated term “${w}”. Normally requires written consent.`]);}});
  CAUTION_WORDS.forEach(w=>{if(lower.includes(w)){score-=6;issues.push(['warn',`Contains the commonly used term “${w}”. Expect closer scrutiny.`]);}});
  if(tokens.length===1&&GENERIC_WORDS.includes(tokens[0])){score-=30;issues.push(['critical','A single generic word is very unlikely to be accepted.']);}
  else if(tokens.length&&tokens.every(t=>GENERIC_WORDS.includes(t))){score-=18;issues.push(['warn','Every word is generic — add a distinctive element.']);}
  let best=0,bestName='';
  SAMPLE_NAMES.forEach(s=>{const sim=similarity(lower,s.toLowerCase());if(sim>best){best=sim;bestName=s;}});
  if(best>0.84){score-=34;issues.push(['critical',`Very close to an existing registered name (${bestName}).`]);}
  else if(best>0.70){score-=17;issues.push(['warn',`Noticeably similar to an existing entity (${bestName}).`]);}
  else if(best>0.58){score-=7;notes.push(`Some overlap with an existing entity (${bestName}) — acceptable, but worth reviewing.`);}
  if(!/(limited|ltd|plc|incorporated|inc|enterprises|trading|services|solutions)\b/i.test(name)&&tokens.length<3){notes.push('If registering a company, the registry will normally expect “Limited” or “Ltd”.');}
  score=Math.max(0,Math.min(100,Math.round(score)));
  let band,cls;
  if(score>=80){band='High readiness';cls='ok';}
  else if(score>=60){band='Medium readiness';cls='warn';}
  else if(score>=40){band='Low readiness';cls='bad';}
  else{band='High risk';cls='bad';}
  return { name, score, band, cls, issues, notes };
}

const $ = (s,r=document)=>(r||document).querySelector(s);
const $$ = (s,r=document)=>Array.from((r||document).querySelectorAll(s));
const uid = (p='id')=>p+'_'+Math.random().toString(36).slice(2,9);
const fmtDate = (d)=>{ if(!d) return '—'; const x=new Date(d); if(isNaN(x)) return '—'; return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };
const pct = (a,b)=> b===0?0:Math.round((a/b)*100);
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

function numberToWords(num){
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(num===0)return'Zero';
  function chunk(n){
    if(n<20)return ones[n];
    if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
    if(n<1000)return ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+chunk(n%100):'');
    if(n<1000000)return chunk(Math.floor(n/1000))+' Thousand'+(n%1000?' '+chunk(n%1000):'');
    return chunk(Math.floor(n/1000000))+' Million'+(n%1000000?' '+chunk(n%1000000):'');
  }
  return chunk(num);
}
function amountInWords(amountStr,currency){
  const num=parseFloat(String(amountStr).replace(/[^\d.]/g,''))||0;
  const words=numberToWords(Math.round(num));
  if(currency==='USD') return 'US Dollars '+words+' Only';
  if(currency==='ZMW') return words+' Kwacha Only';
  return words+' Only';
}

function PaymentFlow({ amount, currency, purpose, purposeDetail, applicant, receiptPrefix, onConfirmed, onClose }){
  const [method, setMethod] = useState(null);
  const [senderName, setSenderName] = useState('');
  const [senderContact, setSenderContact] = useState('');
  const [userRef, setUserRef] = useState('');
  const [agree, setAgree] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');
  const [confirmed, setConfirmed] = useState(false);
  const [receiptNo, setReceiptNo] = useState('');
  const [receiptDate, setReceiptDate] = useState('');
  const [whatsappUrl, setWhatsappUrl] = useState('');
  const [whatsappSent, setWhatsappSent] = useState(false);
  const [whatsappOpened, setWhatsappOpened] = useState(false);
  const [copied, setCopied] = useState('');
  const [generatingPDF, setGeneratingPDF] = useState(false);
  const [checkRef, setCheckRef] = useState('');
  const [checkResult, setCheckResult] = useState('');
  const [copiedMessage, setCopiedMessage] = useState(false);

  const copyText = (text, key) => {
    const done = ()=>{ setCopied(key); setTimeout(()=>setCopied(''),1500); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
    else fallbackCopy(text,done);
  };
  const fallbackCopy = (text,done)=>{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){} document.body.removeChild(ta); };

  const buildWhatsappMessage = (rcpt, dateOverride) => {
    const dateStr = dateOverride || receiptDate;
    return [
      '*STARTEASY — PAYMENT PROOF*','',
      '*Receipt No:* ' + rcpt,
      '*Date & Time:* ' + dateStr,
      '', '*APPLICANT',
      'Name: ' + (applicant.firstName||'') + ' ' + (applicant.lastName||''),
      'Company: ' + (applicant.company||'—'),
      'Email: ' + (applicant.email||'—'),
      'Country: ' + (applicant.country||'—'),
      '', '*PURPOSE*', purpose, '',
      '*PAYMENT DETAILS*',
      'Method: ' + (PAYMENT_METHODS[method] ? PAYMENT_METHODS[method].label : '—'),
      'Amount: ' + amount,
      'Sender Name: ' + senderName,
      'Sender Contact: ' + senderContact,
      'Transaction ID / Ref: ' + (userRef||'(not provided)'),
      '', '_Please verify this payment against our records and confirm receipt. A provisional receipt has been auto-generated for the applicant._'
    ].join('\n');
  };

  const handleConfirm = async () => {
    setErrorMsg('');
    if(!method){ setErrorMsg('Please select a payment method first.'); return; }
    if(!senderName.trim()){ setErrorMsg('Please enter the name on the payment.'); return; }
    if(!senderContact.trim()){ setErrorMsg('Please enter the phone or email used to pay.'); return; }
    if(!userRef.trim()){ setErrorMsg('Please enter your transaction reference.'); return; }
    if(!agree){ setErrorMsg('Please tick the confirmation checkbox.'); return; }

    let waWindow = null;
    if(!isMobileDevice()){
      try{
        waWindow = window.open('about:blank','_blank');
        if(waWindow){ try{ waWindow.document.write('<title>Opening WhatsApp…</title><body style="font-family:system-ui;padding:24px;color:#0A1F12">Opening WhatsApp…</body>'); }catch(e){} }
      }catch(e){}
    }

    const rcpt = receiptPrefix + '-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random()*90000)+10000);
    const now = new Date();
    const dt = now.toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    setReceiptNo(rcpt); setReceiptDate(dt);

    const msg = buildWhatsappMessage(rcpt, dt);

    if(isMobileDevice()){
      const result = launchWhatsapp(msg);
      setWhatsappUrl(result.url);
      setWhatsappOpened(result.opened);
    } else {
      const url = buildWhatsappUrl(msg);
      setWhatsappUrl(url);
      if(waWindow && !waWindow.closed){
        try{ waWindow.location.href = url; setWhatsappOpened(true); }catch(e){}
      }
    }

    setConfirmed(true);

    const m = PAYMENT_METHODS[method];
    const data = {
      receiptNo: rcpt,
      receiptDate: dt,
      amount, currency, purpose,
      method: m.label,
      transactionRef: userRef,
      senderName, senderContact,
      applicantName: ((applicant.firstName||'')+' '+(applicant.lastName||'')).trim(),
      applicantEmail: applicant.email,
      applicantCountry: applicant.country,
      applicantCompany: applicant.company,
      recipientAccount: m.recipientAccount,
      status: 'pending'
    };
    // Persist locally
    try{
      const stored = JSON.parse(localStorage.getItem('se_receipts') || '[]');
      stored.push(data);
      localStorage.setItem('se_receipts', JSON.stringify(stored));
    }catch(e){}
    if(onConfirmed) onConfirmed(data);
  };

  const copyWhatsappMessage = () => {
    const text = buildWhatsappMessage(receiptNo, receiptDate);
    const done = ()=>{ setCopiedMessage(true); setTimeout(()=>setCopiedMessage(false),2500); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){} document.body.removeChild(ta); });
    } else {
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){} document.body.removeChild(ta);
    }
  };

  const downloadReceiptPDF = async () => {
    const el = document.getElementById('seReceipt');
    if(!el) return;
    if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){ setErrorMsg('PDF generator not ready. Use Print instead.'); return; }
    setGeneratingPDF(true);
    try{
      const canvas = await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
      const pdfW = pdf.internal.pageSize.getWidth();
      const pdfH = pdf.internal.pageSize.getHeight();
      const margin = 10; const usableW = pdfW - margin*2;
      const ratio = canvas.height / canvas.width;
      let dispW = usableW; let dispH = dispW * ratio;
      if(dispH > pdfH - margin*2){ dispH = pdfH - margin*2; dispW = dispH / ratio; }
      const xOffset = (pdfW - dispW)/2;
      pdf.addImage(imgData,'PNG',xOffset,margin,dispW,dispH);
      pdf.save('StartEasy-Receipt-'+receiptNo+'.pdf');
    }catch(err){ console.error(err); setErrorMsg('Could not generate PDF. Try Print instead.'); }
    finally{ setGeneratingPDF(false); }
  };

  const printReceipt = () => {
    document.body.classList.add('print-receipt-mode');
    setTimeout(()=>{ window.print(); setTimeout(()=>document.body.classList.remove('print-receipt-mode'),200); },100);
  };

  const lookupReceipt = () => {
    if(!checkRef.trim()){ setCheckResult('Please enter a receipt number.'); return; }
    try{
      const stored = JSON.parse(localStorage.getItem('se_receipts') || '[]');

        setCheckResult('PENDING — awaiting verification by our team.');

        setCheckResult('Receipt not found on this device. Contact engagements@starteasy.zm with your receipt number.');
      }
    }catch(e){ setCheckResult('Could not check right now. Please try again later.'); }
  };

  if(confirmed){
    const m = PAYMENT_METHODS[method];
    const receiptData = { receiptNo, receiptDate, amount, currency, purpose, method: m.label, transactionRef: userRef, senderName, senderContact, applicantName:((applicant.firstName||'')+' '+(applicant.lastName||'')).trim(), applicantEmail: applicant.email, applicantCountry: applicant.country, recipientAccount: m.recipientAccount };

              <span>{whatsappOpened ? 'Open WhatsApp again' : 'Send Proof to WhatsApp'}</span>
            </a>
            <button type="button" onClick={copyWhatsappMessage}
              style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',marginTop:10,padding:'11px 18px',background:'#fff',border:'1.5px solid #25D366',color:'#075E54',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit',transition:'all .2s ease'}}>

              </div>
            </div>

        </div>
      </div>
    );
  }

      </div>
      <div className="pay-methods-grid" role="radiogroup" aria-label="Payment method">
        {Object.entries(PAYMENT_METHODS).map(([key,pm])=>{
          const isSelected = method === key;
          return (

              <div className="pm-logo">
                {key==='airtel' ? 'airtel' : key==='mtn' ? 'MTN' : key==='bank' ? <i className="fas fa-university"></i> : key==='paypal' ? <i className="fab fa-paypal"></i> : <i className="fab fa-bitcoin"></i>}

      {m && (

            <div className="pdp-rows" style={{marginTop:14}}>

function Btn({ children, onClick, variant='primary', size='md', className='', type='button', disabled }){

  const sizes = { sm:'text-[12px] px-4 py-2.5', md:'text-[13px] px-6 py-3.5', lg:'text-[13.5px] px-8 py-4' };
  const variants = {
    primary: 'bg-gradient-to-br from-[#E8730F] to-[#F5A623] text-white hover:shadow-[0_0_25px_rgba(232,115,15,0.4)]',
    green:   'bg-gradient-to-br from-[#1E7B3C] to-[#2E9C4A] text-white hover:shadow-[0_0_25px_rgba(46,156,74,0.4)]',
    ghost:   'border border-[#0A1F12]/20 text-[#0A1F12] hover:border-[#E8730F] hover:bg-[#E8730F]/5',
    ghostLight: 'border border-white/20 text-white hover:bg-[#F5A623] hover:text-[#0A1F12] hover:border-[#F5A623]',

}

function ChipGroup({ options, value, onChange, multi=false, columns=2 }){
  const isOn = (o)=> multi ? (value||[]).includes(o) : value===o;
  const toggle = (o)=>{
    if(multi){ const v = value||[]; onChange(v.includes(o) ? v.filter(x=>x!==o) : [...v,o]); }
    else onChange(o);
  };
  const cols = { 1:'grid-cols-1', 2:'grid-cols-1 sm:grid-cols-2', 3:'grid-cols-1 sm:grid-cols-3' };
  return (
    <div className={`grid ${cols[columns]} gap-2.5`}>
      {options.map(o=>{
        const label = typeof o==='string' ? o : o.v;
        const desc = typeof o==='string' ? null : o.d;
        const on = isOn(label);
        return (
          <button key={label} type="button" onClick={()=>toggle(label)}
            className={`text-left px-4 py-3.5 rounded-sm border transition-all duration-200 ${
              on ? 'border-[#E8730F] bg-[#E8730F]/10 shadow-[0_0_15px_rgba(232,115,15,0.1)]' : 'border-[#0A1F12]/12 bg-white hover:border-[#E8730F]/50 hover:bg-[#E8730F]/5'

              <span className="min-w-0">
                <span className={`block text-[13.5px] leading-snug ${on?'text-[#0A1F12] font-semibold':'text-[#0A1F12]/80'}`}>{label}</span>
                {desc && <span className="block text-[11.5px] text-[#0A1F12]/45 mt-1 leading-snug">{desc}</span>}

            </div>
          </button>
        );
      })}
    </div>
  );
}

const HERO_SLIDES = [
  { title:'Right the first time.', sub:'Regulatory & administrative work, prepared to the standard the regulator expects.' },
  { title:'Every desk, one platform.', sub:'PACRA, ZRA, NAPSA, licensing and compliance — coordinated.' },
  { title:'Free discovery → guided support.', sub:'Start free, pay only when you need more help.' },
  { title:'Built for Zambian businesses.', sub:'SMEs, cooperatives, startups and established organisations.' }
];

function HeroSlider(){
  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);
  const n = HERO_SLIDES.length;
  useEffect(()=>{
    if(paused) return;
    const t = setInterval(()=>setIdx(p=>(p+1)%n),5200);
    return ()=>clearInterval(t);
  },[paused,n]);
  const slide = (d)=>setIdx(p=>(p+d+n)%n);
  const active = HERO_SLIDES[idx];

function FloatingAssistant(){
  const [open, setOpen] = useState(false);
  const [msg, setMsg] = useState('');
  const [chat, setChat] = useState([{ from:'bot', text:'Hello! I am the StartEasy assistant. Tell me what you are trying to do and I will point you in the right direction.' }]);
  const handleSend = ()=>{
    if(!msg.trim()) return;
    setChat([...chat,{ from:'user', text:msg }]);
    setMsg('');
    setTimeout(()=>setChat(prev=>[...prev,{ from:'bot', text:'Thanks. A StartEasy officer will follow up. In the meantime, try the "Find Your Pathway" wizard for an instant action plan.' }]),800);
  };
  return (
    <div className="fixed bottom-6 right-6 z-[100] flex flex-col items-end" style={{paddingBottom:'env(safe-area-inset-bottom)'}}>

              <span className="w-2 h-2 rounded-full bg-[#F5A623] pulse-soft"/>

              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>

function OrientationWizard({ go, onComplete }){
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [done, setDone] = useState(false);
  const total = ORI_QUESTIONS.length;
  const current = ORI_QUESTIONS[step];
  const value = answers[current?.key];
  const canAdvance = !!value;
  const set = (v)=>setAnswers({...answers,[current.key]:v});
  const next = ()=>{ if(!canAdvance) return; if(step < total-1) setStep(step+1); else setDone(true); };
  const back = ()=>{ if(step>0) setStep(step-1); };
  useEffect(()=>{ window.scrollTo(0,0); },[step,done]);

  const recommendedJourney = useMemo(()=>{
    if(!done) return null;
    const a = answers;
    if(a.goal === 'close') return getJourney('close-business');
    if(a.goal === 'licence') return getJourney('business-licence');
    if(a.goal === 'change') return getJourney('change-company-details');

              )}
              {step === 1 && (
                <>

                <>

                  {[
                    'I have identified all the people who must sign.',
                    'Names on my documents match identification exactly.',
                    'I have certified copies where certification is required.',
                    'I have proof of business / registered office address.',
                    'I know which tax types will apply to my business.',
                    'I have prepared at least three proposed names (if registering).',
                    'I have confirmed the current fee for each authority.',

                    return (
                      <label key={i} className={`flex items-start gap-3 p-3.5 rounded-sm border cursor-pointer transition-all ${on?'border-[#E8730F] bg-[#E8730F]/8':'border-[#0A1F12]/10 bg-white hover:border-[#E8730F]/50'}`}>
                        <input type="checkbox" checked={on} onChange={()=>{
                          const list = f.documents||[];

function NameCheck({ go, openPayment }){
  const [names, setNames] = useState(['','','']);
  const [results, setResults] = useState(null);
  const [qc, setQc] = useState({});

  const runCheck = ()=>{
    const entered = names.filter(n=>n.trim());
    if(!entered.length){ return; }
    const analysed = entered.map(n=>analyseName(n));
    const order = analysed.slice().sort((a,b)=>b.score - a.score);
    setResults(order);
  };

  const qcList = [
    'The entity type has been decided and recorded.',
    'All proposed names are in order of preference and at least three are prepared.',
    'I have identified every person who must sign.',
    'Names on all documents match identification documents exactly.',
    'I have certified copies where certification is required.',
    'The registered office / business address evidence is ready.',
    'The share structure has been decided and reconciles across all forms.',
    'Any required resolution has been signed and dated.'
  ];
  const qcScore = pct(Object.values(qc).filter(Boolean).length, qcList.length);

  const scoreColor = (s)=> s>=80 ? '#1E7B3C' : s>=60 ? '#E8730F' : '#B8564F';
  const scoreBg = (s)=> s>=80 ? 'rgba(30,123,60,.12)' : s>=60 ? 'rgba(232,115,15,.12)' : 'rgba(184,86,79,.12)';
  const scoreLabel = (s)=> s>=80 ? 'High readiness' : s>=60 ? 'Medium readiness' : s>=40 ? 'Low readiness' : 'High risk';

  return (
    <div className="fadein bg-[#F5FAF6]">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
        <SectionHead eyebrow="Regulatory Readiness Check" title="Catch avoidable errors before submission." sub="A reversion costs time and money. This check does not promise approval — it identifies the issues that most commonly cause a name or application to be sent back, so you can deal with them first." className="mb-12 max-w-3xl"/>

        <div className="grid lg:grid-cols-2 gap-8 lg:gap-12">
          <div>
            <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden mb-6">
              <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between">
                <span className="text-[14px] font-semibold text-[#0A1F12]">Name Readiness Review</span>
                <span className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#1E7B3C] bg-[#1E7B3C]/10 px-2.5 py-1 rounded-full">PACRA Desk</span>
              </div>
              <div className="p-6 space-y-5">
                <Field label="Preferred name (1st choice)"><TextInput value={names[0]} onChange={v=>setNames([v,names[1],names[2]])} placeholder="e.g. Zambezi Fresh Foods Limited"/></Field>
                <Field label="Alternative name (2nd choice)"><TextInput value={names[1]} onChange={v=>setNames([names[0],v,names[2]])} placeholder="e.g. Northern Harvest Trading Limited"/></Field>
                <Field label="Alternative name (3rd choice)" hint="Submit three names, always in order of preference"><TextInput value={names[2]} onChange={v=>setNames([names[0],names[1],v])} placeholder="e.g. Kanyama Star Enterprises Limited"/></Field>
                <div className="flex flex-wrap gap-3 pt-2">
                  <Btn variant="primary" onClick={runCheck} disabled={!names.filter(n=>n.trim()).length}>Run readiness review</Btn>
                  <Btn variant="ghost" onClick={()=>{setNames(['','','']);setResults(null);}}>Clear</Btn>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
              <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between">
                <span className="text-[14px] font-semibold text-[#0A1F12]">Pre-submission checklist</span>
                <span className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#0E7C7B] bg-[#0E7C7B]/10 px-2.5 py-1 rounded-full">General</span>
              </div>
              <div className="p-6">
                <p className="text-[12.5px] text-[#0A1F12]/55 mb-4">Tick what you have already confirmed. Unchecked items are the usual causes of delay.</p>
                <div className="space-y-1">
                  {qcList.map((item,i)=>(
                    <label key={i} className={`flex items-start gap-3 p-2.5 rounded cursor-pointer transition-colors ${qc[i]?'bg-[#1E7B3C]/8':'hover:bg-[#F5FAF6]'}`}>
                      <input type="checkbox" checked={!!qc[i]} onChange={()=>setQc({...qc,[i]:!qc[i]})} style={{width:16,height:16,accentColor:'#1E7B3C',marginTop:3,flexShrink:0,cursor:'pointer'}}/>
                      <span className={`text-[13px] leading-relaxed ${qc[i]?'text-[#0A1F12]/50 line-through':'text-[#0A1F12]/80'}`}>{item}</span>
                    </label>
                  ))}
                </div>
                <div className="mt-5 pt-5 border-t border-[#0A1F12]/6">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[12px] text-[#0A1F12]/50 font-semibold">Preparedness</span>
                    <span className="text-[14px] font-bold text-[#0A1F12] tabular-nums">{qcScore}%</span>
                  </div>
                  <div className="h-2 bg-[#0A1F12]/8 rounded-full overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-[#1E7B3C] to-[#2E9C4A] rounded-full transition-all" style={{width:`${qcScore}%`}}/>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div>
            {!results ? (
              <div className="bg-white rounded-sm border border-[#0A1F12]/8 p-12 text-center">
                <div className="w-14 h-14 rounded-full bg-[#E8730F]/10 flex items-center justify-center mx-auto mb-4">
                  <i className="fas fa-search" style={{fontSize:22,color:'#E8730F'}}></i>
                </div>
                <h3 className="serif text-[22px] text-[#0A1F12] mb-3">No review run yet</h3>
                <p className="text-[13px] text-[#0A1F12]/55 leading-relaxed max-w-md mx-auto">Enter up to three proposed names and run the review. Each name is scored for readiness and the issues are explained in plain language.</p>
              </div>
            ) : (
              <div className="space-y-4">
                {results.map((r,i)=>(
                  <div key={i} className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden" style={{borderLeftWidth:4,borderLeftColor:scoreColor(r.score)}}>
                    <div className="p-6">
                      <div className="flex items-start justify-between gap-4 mb-4">
                        <div className="flex-1 min-w-0">
                          <span className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#0A1F12]/40 mb-1 block">Proposed name {i+1}</span>
                          <h4 className="serif text-[19px] text-[#0A1F12] leading-tight truncate">{r.name}</h4>
                        </div>
                        <div className="text-right shrink-0">
                          <div className="serif text-[36px] leading-none font-bold" style={{color:scoreColor(r.score)}}>{r.score}</div>
                          <span className="inline-block text-[10px] tracking-[0.1em] uppercase font-bold px-2 py-1 rounded-full mt-2" style={{background:scoreBg(r.score),color:scoreColor(r.score)}}>{scoreLabel(r.score)}</span>
                        </div>
                      </div>
                      <div className="h-1.5 rounded-full overflow-hidden mb-4" style={{background:'#0A1F12',opacity:.08}}>
                        <div className="h-full rounded-full" style={{width:`${r.score}%`,background:scoreColor(r.score)}}/>
                      </div>
                      {(r.issues||[]).length > 0 && (
                        <div className="space-y-2 mb-3">
                          {r.issues.map((iss,ii)=>(
                            <div key={ii} className={`flex gap-3 text-[12px] leading-relaxed p-3 rounded-sm ${iss[0]==='critical'?'bg-[#B8564F]/8 text-[#7C2318]':'bg-[#F5A623]/10 text-[#7A5C10]'}`}>
                              <span className="shrink-0">{iss[0]==='critical' ? '⛔' : '⚠️'}</span>
                              <span>{iss[1]}</span>
                            </div>
                          ))}
                        </div>
                      )}
                      {(r.notes||[]).length > 0 && (
                        <div className="pt-3 mt-3 border-t border-[#0A1F12]/6">
                          {r.notes.map((n,ni)=><div key={ni} className="text-[12px] text-[#0A1F12]/55 leading-relaxed mb-1.5">• {n}</div>)}
                        </div>
                      )}
                      {(r.issues||[]).length === 0 && (r.notes||[]).length === 0 && (
                        <div className="flex gap-3 text-[12px] leading-relaxed p-3 rounded-sm bg-[#1E7B3C]/8 text-[#0F5C2A]">
                          <span>✓</span><span>No obvious defects detected at this stage.</span>
                        </div>
                      )}
                    </div>
                  </div>
                ))}

                <div className="bg-gradient-to-br from-[#0A1F12] to-[#123A1F] rounded-sm p-6 text-white relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-40 h-40 bg-[#E8730F]/10 rounded-full blur-[60px] pointer-events-none"/>
                  <div className="relative">
                    <span className="micro text-[#F5A623] block mb-4">Recommended submission order</span>
                    <div className="space-y-2.5 mb-5">
                      {results.map((r,i)=>(
                        <div key={i} className="flex items-center justify-between gap-3">
                          <span className="text-[13px] text-white/80 truncate"><strong className="text-[#F5A623]">{i+1}.</strong> {r.name}</span>
                          <span className="text-[10.5px] tracking-[0.1em] uppercase font-bold shrink-0" style={{color:scoreColor(r.score)}}>{scoreLabel(r.score)}</span>
                        </div>
                      ))}
                    </div>
                    <p className="text-[11.5px] leading-relaxed text-white/45 mb-5">This is guidance only. Name clearance is granted at the discretion of the registry and StartEasy does not guarantee approval. Always submit through the official PACRA channel.</p>
                    <button onClick={()=>openPayment({
                      amount:'K50',
                      currency:'ZMW',
                      purpose:'Name Readiness Report — Formal',
                      purposeDetail:'A formal PDF report with detailed screening, similarity analysis and recommended submission order. Delivered within 2 business days.',
                      applicant:{ firstName:'', lastName:'', email:'', phone:'', country:'Zambia', company:'' },
                      receiptPrefix:'SE-NMR'
                    })} className="inline-flex items-center gap-2.5 font-bold rounded-sm text-[13px] px-5 py-3" style={{background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',cursor:'pointer',fontFamily:'inherit'}}>
                      <i className="fas fa-file-invoice"></i> Order formal Name Report — K50 / $5 USD
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      </section>
    </div>
  );
}

              <span className="text-[14px] font-semibold text-[#0A1F12]">Request assistance</span>
              <span className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#1E7B3C] bg-[#1E7B3C]/10 px-2.5 py-1 rounded-full">Human support</span>

            <form onSubmit={handleSubmit} className="p-6 space-y-5">

              <div className="grid sm:grid-cols-2 gap-4">
                <Field label="Email" required><TextInput type="email" value={form.email} onChange={v=>setForm({...form,email:v})} placeholder="you@company.com"/></Field>
                <Field label="Phone"><TextInput value={form.phone} onChange={v=>setForm({...form,phone:v})} placeholder="+260 ..."/></Field>
              </div>
              <div className="grid sm:grid-cols-2 gap-4">
                <Field label="Service level">
                  <Select value={form.tier} onChange={v=>setForm({...form,tier:v})} options={TIERS.map(t=>t.name)} placeholder="Select tier"/>
                </Field>
                <Field label="Which desk?">
                  <Select value={form.desk} onChange={v=>setForm({...form,desk:v})} options={Object.keys(DESKS).map(k=>DESKS[k].name)} placeholder="Select desk"/>
                </Field>
              </div>
              <Field label="What do you need help with?" required><TextInput value={form.subject} onChange={v=>setForm({...form,subject:v})} placeholder="e.g. My PACRA application was reverted for a name issue"/></Field>
              <Field label="Describe the situation"><TextArea value={form.detail} onChange={v=>setForm({...form,detail:v})} rows={4} placeholder="Include any reference numbers, dates and what you have already tried."/></Field>
              <div className="bg-[#0A1F12]/5 border border-[#0A1F12]/10 rounded-sm p-4">
                <p className="text-[12px] text-[#0A1F12]/60 leading-relaxed"><strong className="text-[#0A1F12]">Scope note.</strong> StartEasy provides administrative process support. We do not provide legal, tax or accounting advice; where that is needed we will refer you to an appropriately qualified professional.</p>
              </div>
              <button type="submit" style={{width:'100%',padding:'13px 16px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Submit request</button>
            </form>
          </div>

          <div className="space-y-6">
            <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
              <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between">
                <span className="text-[14px] font-semibold text-[#0A1F12]">Your requests</span>
                <span className="text-[11px] font-bold text-[#0A1F12]/40">{tickets.length}</span>
              </div>
              <div className="p-6">
                {tickets.length === 0 ? (
                  <p className="text-[13px] text-[#0A1F12]/45 italic">No requests logged. Use the form to open a support matter.</p>
                ) : tickets.map(t=>(
                  <div key={t.id} className="py-4 border-b border-[#0A1F12]/6 last:border-0">
                    <div className="flex items-start justify-between gap-3 mb-2">
                      <span className="text-[13.5px] font-semibold text-[#0A1F12]">{t.subject}</span>
                      <span className={`text-[10px] tracking-[0.1em] uppercase font-bold px-2 py-1 rounded-full shrink-0 ${t.status==='Resolved'?'bg-[#1E7B3C]/15 text-[#1E7B3C]':'bg-[#F5A623]/20 text-[#8A6828]'}`}>{t.status}</span>
                    </div>
                    <div className="text-[11.5px] text-[#0A1F12]/45 mb-2">
                      {DESKS[t.desk]?.name || t.desk} · {t.tier} · Ref {t.ref} · logged {fmtDate(t.createdAt)}

                    {t.detail && <p className="text-[12px] text-[#0A1F12]/60 leading-relaxed">{t.detail}</p>}
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
              <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB]">
                <span className="text-[14px] font-semibold text-[#0A1F12]">What the Desk can and cannot do</span>
              </div>
              <div className="p-6 grid sm:grid-cols-2 gap-6">
                <div>
                  <span className="text-[11px] tracking-[0.14em] uppercase font-bold text-[#1E7B3C] block mb-3">Can</span>
                  <ul className="space-y-2">
                    {['Identify the correct process','Prepare and review your pack','Submit through official channels','Interpret reversion notices','Track and follow up','Manage your compliance calendar'].map((x,i)=>(
                      <li key={i} className="text-[12px] text-[#0A1F12]/65 leading-relaxed">• {x}</li>
                    ))}
                  </ul>
                </div>
                <div>
                  <span className="text-[11px] tracking-[0.14em] uppercase font-bold text-[#B8564F] block mb-3">Cannot</span>
                  <ul className="space-y-2">
                    {['Guarantee approval','Act as a government authority','Give legal advice','Give tax or accounting advice','Influence a regulator\'s decision'].map((x,i)=>(
                      <li key={i} className="text-[12px] text-[#0A1F12]/65 leading-relaxed">• {x}</li>
                    ))}
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  );
}

/* ============================================================
   VIEW: COMPLIANCE PASSPORT
   ============================================================ */
function CompliancePassport({ go }){
  const [biz, setBiz] = useState(()=>{ try{ return JSON.parse(localStorage.getItem('se_business')||'null'); }catch(e){ return null; } });
  const [form, setForm] = useState({
    name:'', entity:'Private Limited Company', regNo:'', tpin:'', napsa:'',
    city:'Lusaka', sector:'general', employees:'0',
    licence:'', sectorLicence:'', clearance:''
  });
  const [renewals, setRenewals] = useState(()=>{ try{ return JSON.parse(localStorage.getItem('se_renewals')||'[]'); }catch(e){ return []; } });
  const [vault, setVault] = useState(()=>{ try{ return JSON.parse(localStorage.getItem('se_vault')||'[]'); }catch(e){ return []; } });
  const [showRenewalForm, setShowRenewalForm] = useState(false);
  const [newRenewal, setNewRenewal] = useState({ name:'', authority:'', date:'' });
  const [showDocForm, setShowDocForm] = useState(false);
  const [newDoc, setNewDoc] = useState({ name:'', type:'Registration certificate' });

  const saveBiz = (data)=>{ setBiz(data); try{ localStorage.setItem('se_business', JSON.stringify(data)); }catch(e){} };
  const saveRenewals = (list)=>{ setRenewals(list); try{ localStorage.setItem('se_renewals', JSON.stringify(list)); }catch(e){} };
  const saveVault = (list)=>{ setVault(list); try{ localStorage.setItem('se_vault', JSON.stringify(list)); }catch(e){} };

  if(!biz){
    return (
      <div className="fadein bg-[#F5FAF6]">
        <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
          <div className="max-w-2xl">
            <SectionHead eyebrow="Compliance Passport" title="Create your business regulatory profile." sub="Your Compliance Passport keeps your registration details, licences, renewals and filings in one place, and alerts you before something lapses." className="mb-10"/>
            <form onSubmit={e=>{e.preventDefault(); saveBiz({...form, createdAt:new Date().toISOString()});}} className="bg-white rounded-sm border border-[#0A1F12]/8 p-6 lg:p-8 space-y-5">
              <div className="grid sm:grid-cols-2 gap-5">
                <Field label="Registered business name" required><TextInput value={form.name} onChange={v=>setForm({...form,name:v})} placeholder="e.g. Zambezi Fresh Foods Limited"/></Field>
                <Field label="Entity type">
                  <Select value={form.entity} onChange={v=>setForm({...form,entity:v})} options={['Private Limited Company','Business Name','Sole Trader','Cooperative','Other']} placeholder="Select type"/>
                </Field>
                <Field label="PACRA registration number"><TextInput value={form.regNo} onChange={v=>setForm({...form,regNo:v})} placeholder="e.g. 120200012345"/></Field>
                <Field label="TPIN"><TextInput value={form.tpin} onChange={v=>setForm({...form,tpin:v})} placeholder="e.g. 1001234567"/></Field>
                <Field label="NAPSA employer number"><TextInput value={form.napsa} onChange={v=>setForm({...form,napsa:v})} placeholder="If registered as an employer"/></Field>
                <Field label="Business licence number"><TextInput value={form.licence} onChange={v=>setForm({...form,licence:v})} placeholder="If issued"/></Field>
                <Field label="City / town">
                  <Select value={form.city} onChange={v=>setForm({...form,city:v})} options={['Lusaka','Ndola','Kitwe','Livingstone','Kabwe','Solwezi','Chipata','Kasama','Mongu','Choma','Mansa','Other']} placeholder="Select city"/>
                </Field>
                <Field label="Number of employees"><TextInput type="number" value={form.employees} onChange={v=>setForm({...form,employees:v})} placeholder="0"/></Field>
              </div>
              <button type="submit" style={{width:'100%',padding:'13px 16px',background:'linear-gradient(135deg,#1E7B3C,#2E9C4A)',color:'#fff',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Create my Compliance Passport</button>
            </form>
          </div>
        </section>
      </div>
    );
  }

  const alerts = [];
  renewals.forEach(r=>{
    const d = Math.ceil((new Date(r.date) - Date.now())/864e5);
    if(d < 0) alerts.push({ level:'bad', text:`${r.name} expired ${Math.abs(d)} day(s) ago.` });
    else if(d <= 60) alerts.push({ level:'warn', text:`${r.name} is due in ${d} day(s) — ${fmtDate(r.date)}.` });
  });
  if(!biz.tpin) alerts.push({ level:'warn', text:'No TPIN recorded. Tax registration may still be outstanding.' });
  if(Number(biz.employees)>0 && !biz.napsa) alerts.push({ level:'warn', text:'You have employees but no NAPSA employer number recorded.' });

  const passportItems = [
    { desk:'pacra', label:'PACRA', tone:'#2E9C4A', rows:[
      ['Entity type', biz.entity],
      ['Registration number', biz.regNo || 'Not recorded'],
      ['Registration status', biz.regNo ? 'Active (as recorded)' : 'Not recorded']
    ]},
    { desk:'zra', label:'ZRA', tone:'#1B6CA8', rows:[
      ['TPIN', biz.tpin || 'Not recorded'],
      ['Tax clearance', biz.clearance ? fmtDate(biz.clearance) : 'Not recorded']
    ]},
    { desk:'napsa', label:'NAPSA', tone:'#7A4FA3', rows:[
      ['Employer registration', biz.napsa || 'Not recorded'],
      ['Employees', String(biz.employees||0)]
    ]},
    { desk:'council', label:'Licences', tone:'#E8730F', rows:[
      ['Business licence', biz.licence || 'Not recorded'],
      ['Sector licence', biz.sectorLicence || 'Not recorded'],
      ['Renewals tracked', String(renewals.length)]
    ]}
  ];

  const totalScore = Math.min(100, 
    (biz.regNo?25:0) + (biz.tpin?25:0) + (biz.napsa?20:0) + (biz.licence?20:0) + (renewals.length>0?10:0)
  );

  return (
    <div className="fadein bg-[#F5FAF6]">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
        <div className="flex flex-wrap items-end justify-between gap-6 mb-10">
          <div>
            <span className="micro text-[#0A1F12]/50 block mb-4">Compliance Passport</span>
            <h1 className="serif text-[clamp(1.8rem,4vw,2.6rem)] leading-tight text-[#0A1F12] mb-3">{biz.name}</h1>
            <p className="text-[14px] text-[#0A1F12]/55">{biz.entity} · {biz.city} · Created {fmtDate(biz.createdAt)}</p>
          </div>
          <div className="flex items-center gap-5">
            <div className="text-right">
              <div className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#0A1F12]/40 mb-1">Profile completeness</div>
              <div className="serif text-[32px] font-bold leading-none text-[#1E7B3C]">{totalScore}%</div>
            </div>
            <button onClick={()=>{ localStorage.removeItem('se_business'); localStorage.removeItem('se_renewals'); localStorage.removeItem('se_vault'); setBiz(null); setRenewals([]); setVault([]); }} style={{padding:'8px 14px',background:'none',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'rgba(10,31,18,.6)'}}>Reset</button>
          </div>
        </div>

        {alerts.length > 0 && (
          <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden mb-8">
            <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between">
              <span className="text-[14px] font-semibold text-[#0A1F12]">StartEasy alerts</span>
              <span className="text-[10.5px] tracking-[0.14em] uppercase font-bold text-[#E8730F] bg-[#E8730F]/10 px-2.5 py-1 rounded-full">{alerts.length}</span>
            </div>
            <div className="p-6 space-y-3">
              {alerts.map((a,i)=>(
                <div key={i} className={`flex items-start gap-3 p-3.5 rounded-sm border ${a.level==='bad'?'bg-[#B8564F]/8 border-[#B8564F]/20 text-[#7C2318]':'bg-[#F5A623]/10 border-[#F5A623]/30 text-[#7A5C10]'}`}>
                  <span className="shrink-0 mt-0.5">{a.level==='bad' ? '⛔' : '⚠️'}</span>
                  <span className="text-[13px] leading-relaxed">{a.text}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="grid lg:grid-cols-2 gap-6 mb-8">
          {passportItems.map(p=>(
            <div key={p.desk} className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden" style={{borderTopWidth:3,borderTopColor:p.tone}}>
              <div className="p-6">
                <div className="flex items-center justify-between mb-5">
                  <h3 className="serif text-[20px] text-[#0A1F12]">{p.label}</h3>
                  <span className="text-[10.5px] tracking-[0.14em] uppercase font-bold px-2.5 py-1 rounded-full" style={{background:`${p.tone}18`,color:p.tone}}>{DESKS[p.desk]?.name}</span>
                </div>
                <div className="space-y-0">
                  {p.rows.map((r,i)=>(
                    <div key={i} className="flex justify-between gap-4 py-3 border-b border-[#0A1F12]/6 last:border-0">
                      <span className="text-[12.5px] text-[#0A1F12]/45">{r[0]}</span>
                      <span className="text-[12.5px] text-[#0A1F12] font-semibold text-right">{r[1]}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ))}
        </div>

        <div className="grid lg:grid-cols-2 gap-6">
          <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
            <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between">
              <span className="text-[14px] font-semibold text-[#0A1F12]">Renewals &amp; deadlines</span>
              <button onClick={()=>setShowRenewalForm(!showRenewalForm)} style={{padding:'6px 12px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:6,fontSize:11.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>+ Add</button>
            </div>
            <div className="p-6">
              {showRenewalForm && (
                <div className="bg-[#F5FAF6] rounded-sm border border-[#0A1F12]/8 p-4 mb-5 space-y-3">
                  <TextInput value={newRenewal.name} onChange={v=>setNewRenewal({...newRenewal,name:v})} placeholder="What is being renewed? (e.g. Council licence)"/>
                  <TextInput value={newRenewal.authority} onChange={v=>setNewRenewal({...newRenewal,authority:v})} placeholder="Issuing authority"/>
                  <input type="date" value={newRenewal.date} onChange={e=>setNewRenewal({...newRenewal,date:e.target.value})} className={inputCls}/>
                  <button onClick={()=>{
                    if(!newRenewal.name || !newRenewal.date) return;
                    saveRenewals([...renewals, newRenewal]);
                    setNewRenewal({name:'',authority:'',date:''});
                    setShowRenewalForm(false);
                  }} style={{width:'100%',padding:'10px 16px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Add renewal</button>
                </div>
              )}
              {renewals.length === 0 ? (
                <p className="text-[13px] text-[#0A1F12]/45 italic">No renewals tracked yet. Add licence and filing dates so StartEasy can alert you in advance.</p>
              ) : renewals.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).map((r,i)=>{
                const d = Math.ceil((new Date(r.date) - Date.now())/864e5);
                const tone = d<0 ? '#B8564F' : d<=60 ? '#E8730F' : '#1E7B3C';
                return (
                  <div key={i} className="flex items-center justify-between gap-3 py-3 border-b border-[#0A1F12]/6 last:border-0">
                    <div className="flex-1 min-w-0">
                      <p className="text-[13px] font-semibold text-[#0A1F12] truncate">{r.name}</p>
                      <p className="text-[11.5px] text-[#0A1F12]/45 mt-0.5">{r.authority} · due {fmtDate(r.date)}</p>
                    </div>
                    <span className="text-[10px] tracking-[0.1em] uppercase font-bold px-2 py-1 rounded-full shrink-0" style={{background:`${tone}18`,color:tone}}>{d<0?'Overdue':d+'d'}</span>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white rounded-sm border border-[#0A1F12]/8 overflow-hidden">
            <div className="px-6 py-4 border-b border-[#0A1F12]/6 bg-[#FBFDFB] flex items-center justify-between">
              <span className="text-[14px] font-semibold text-[#0A1F12]">Document vault</span>
              <button onClick={()=>setShowDocForm(!showDocForm)} style={{padding:'6px 12px',background:'#0A1F12',color:'#fff',border:'none',borderRadius:6,fontSize:11.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>+ Add</button>
            </div>
            <div className="p-6">
              {showDocForm && (
                <div className="bg-[#F5FAF6] rounded-sm border border-[#0A1F12]/8 p-4 mb-5 space-y-3">
                  <TextInput value={newDoc.name} onChange={v=>setNewDoc({...newDoc,name:v})} placeholder="Document name"/>
                  <Select value={newDoc.type} onChange={v=>setNewDoc({...newDoc,type:v})} options={['Registration certificate','Tax document','Licence / permit','Statutory filing','Identification','Clearance','Resolution','Correspondence','Other']} placeholder="Select type"/>
                  <button onClick={()=>{
                    if(!newDoc.name) return;
                    saveVault([...vault, {...newDoc, added:new Date().toISOString()}]);
                    setNewDoc({name:'',type:'Registration certificate'});
                    setShowDocForm(false);
                  }} style={{width:'100%',padding:'10px 16px',background:'linear-gradient(135deg,#1E7B3C,#2E9C4A)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Log document</button>
                </div>
              )}
              {vault.length === 0 ? (
                <p className="text-[13px] text-[#0A1F12]/45 italic">No documents recorded. Log your certificates, clearances and acknowledgements here so you always know what you hold.</p>
              ) : vault.map((d,i)=>(
                <div key={i} className="flex items-center justify-between gap-3 py-3 border-b border-[#0A1F12]/6 last:border-0">
                  <div className="flex-1 min-w-0">
                    <p className="text-[13px] font-semibold text-[#0A1F12] truncate">📄 {d.name}</p>
                    <p className="text-[11.5px] text-[#0A1F12]/45 mt-0.5">{d.type} · added {fmtDate(d.added)}</p>
                  </div>
                  <button onClick={()=>saveVault(vault.filter((_,x)=>x!==i))} style={{background:'none',border:'none',color:'rgba(10,31,18,.4)',cursor:'pointer',fontSize:14,padding:4,fontFamily:'inherit'}}>✕</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>
    </div>
  );
}

/* ============================================================
   VIEW: TRACKER
   ============================================================ */
const STATUSES = ['Draft','Preparing','Ready to submit','Submitted','Under review','Reverted','Approved','Completed'];
function Tracker(){
  const [apps, setApps] = useState(()=>{ try{ return JSON.parse(localStorage.getItem('se_apps')||'[]'); }catch(e){ return []; } });
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ title:'', desk:'pacra', ref:'', status:'Draft', notes:'' });

  const save = (list)=>{ setApps(list); try{ localStorage.setItem('se_apps', JSON.stringify(list)); }catch(e){} };

  const addApp = ()=>{
    if(!form.title.trim()) return;
    const newApp = { id:uid('app'), ...form, createdAt:new Date().toISOString(), timeline:[{ at:new Date().toISOString(), status:form.status }] };
    save([newApp, ...apps]);
    setForm({ title:'', desk:'pacra', ref:'', status:'Draft', notes:'' });
    setShowForm(false);
  };

  const updateStatus = (id, status)=>{
    save(apps.map(a => a.id===id ? { ...a, status, timeline:[...(a.timeline||[]), { at:new Date().toISOString(), status }] } : a));
  };

  const statusColor = (s)=>{
    if(s==='Completed'||s==='Approved') return { bg:'#1E7B3C18', fg:'#1E7B3C' };
    if(s==='Reverted') return { bg:'#B8564F18', fg:'#B8564F' };
    if(s==='Submitted'||s==='Under review') return { bg:'#1B6CA818', fg:'#1B6CA8' };
    if(s==='Ready to submit'||s==='Preparing') return { bg:'#F5A62318', fg:'#8A6828' };
    return { bg:'#0A1F1212', fg:'#5E7A67' };
  };

  return (
    <div className="fadein bg-[#F5FAF6]">
      <section className="max-w-[1320px] mx-auto px-6 lg:px-10 py-14 lg:py-20">
        <div className="flex flex-wrap items-end justify-between gap-6 mb-10">
          <SectionHead eyebrow="Process tracker" title="Track every submission in one place." sub="Record the reference number, watch the status, and keep a history of what happened." className="max-w-2xl"/>
          <button onClick={()=>setShowForm(!showForm)} style={{padding:'12px 20px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>+ New process</button>
        </div>

        {showForm && (
          <div className="bg-white rounded-sm border border-[#0A1F12]/8 p-6 mb-8 space-y-5 max-w-3xl">
            <div className="grid sm:grid-cols-2 gap-5">
              <Field label="Process name" required><TextInput value={form.title} onChange={v=>setForm({...form,title:v})} placeholder="e.g. Private company incorporation"/></Field>
              <Field label="Desk">
                <Select value={form.desk} onChange={v=>setForm({...form,desk:v})} options={Object.keys(DESKS).map(k=>DESKS[k].name)} placeholder="Select desk"/>
              </Field>
              <Field label="Reference number"><TextInput value={form.ref} onChange={v=>setForm({...form,ref:v})} placeholder="Record this after submission"/></Field>
              <Field label="Status">
                <Select value={form.status} onChange={v=>setForm({...form,status:v})} options={STATUSES} placeholder="Select status"/>
              </Field>
            </div>
            <Field label="Notes"><TextArea value={form.notes} onChange={v=>setForm({...form,notes:v})} rows={3} placeholder="What was submitted, what the officer said, what is outstanding…"/></Field>
            <div className="flex gap-3">
